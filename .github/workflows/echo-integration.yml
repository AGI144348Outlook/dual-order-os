name: Assemble and test integrated Echo workspace
on:
  push:
    branches: [integration/echo-genesis-unified]
    paths:
      - '.github/workflows/echo-integration.yml'
      - 'libraries/echo_*.py'
      - 'libraries/catalog_box.py'
      - 'libraries/algorithms/**'
      - 'tools/observe_echo_dictionary.py'
      - 'tools/run_question_tag_intake.py'
      - 'tools/read_consent_paradox.py'
      - 'libraries/research-papers/**'
      - 'tests/**'
      - 'tools/materialize_genesis.py'
      - 'tools/run_echo_integration.py'
      - 'matrices/echo-integration/source-manifest.json'
      - 'matrices/echo-integration/branch-components.json'
      - 'benchmarks/**'
      - 'tools/check_branch_components.py'
      - 'tools/run_echo_benchmarks.py'
      - 'vendor/echo-language/**'
      - 'vendor/echo-articulation/**'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: echo-integration-assembly
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/echo-genesis-unified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize complete pinned Genesis snapshot
        run: python tools/materialize_genesis.py
      - name: Run combined tests, diagnostics and persistence demo
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/run_echo_integration.py
      - name: Verify recovered branch components and run linguistic diagnostics
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/run_echo_benchmarks.py
      - name: Observe bounded dictionary behavior without a sentence task
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          PYTHONHASHSEED=42 python tools/observe_echo_dictionary.py --archive vendor/echo-genesis/integration-inbox/core-lexicon/core-lexicon.zip --output reports/echo-cards/complete-42
          PYTHONHASHSEED=7 python tools/observe_echo_dictionary.py --archive vendor/echo-genesis/integration-inbox/core-lexicon/core-lexicon.zip --output reports/echo-cards/complete-7
      - name: Reproduce provisional dictionary question tags
        run: python tools/run_question_tag_intake.py --archive vendor/echo-genesis/integration-inbox/core-lexicon/core-lexicon.zip --output reports/echo-question-tags/dictionary-intake.json
      - name: Read preserved Consent Paradox record five times
        env:
          PYTHONHASHSEED: '42'
        run: python tools/read_consent_paradox.py --archive vendor/echo-genesis/integration-inbox/core-lexicon/core-lexicon.zip
      - name: Commit verified snapshot and results to integration branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/echo-genesis reports/echo-integration reports/echo-benchmarks reports/echo-cards/complete-42/result.json reports/echo-cards/complete-7/result.json reports/echo-question-tags/dictionary-intake.json reports/echo-consent-reading
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve complete verified Genesis snapshot and integrated test results'
            git push origin HEAD:integration/echo-genesis-unified
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-integration-results
          path: |
            reports/echo-integration/
            reports/echo-benchmarks/
            reports/echo-cards/**/*.json
            reports/echo-question-tags/
            reports/echo-consent-reading/
          if-no-files-found: ignore
          retention-days: 14
