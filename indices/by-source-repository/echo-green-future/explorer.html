istry.json\tlexicon.py\talgebra\tmatrices/glyphs/hebrew_glyph_registry.json\t950cbeaa21b12bdc5742a382fde5cf14fb96719b\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\tref\t\thome: registries/ REG-0001; source of LOG-0005 glyph meanings\nLOG-0027\tMath axiom systems\tlogic\tmath_axioms.json\t\tpersonal-library-pwa\tcore-lexicon/math_axioms.json\t00df2c4ab7e098097b83ecdd00baa2d4935269d7\t87760bf2d7edc702f9cd94fd1e91840d0079bc1d\tunknown\tINERT\tref\t\thome: data/ (core lexicon); 18 axiom systems, 31 proofs, 158 theorems per the L2 register\nLOG-0028\tMashet operator manual\toperators\tMASHET_OPERATOR_MANUAL.md\t\talgebra\tdocs/mashet/MASHET_OPERATOR_MANUAL.md\tdcf9293ffdd880b8ded0fe427c06aed1965223c9\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\tref\tר\thome: codices/; human manual for LOG-0016\nLOG-0029\tRecursive inversion and presentiation semantics\tDSL\tdiscussion\t\talgebra\tdiscussions/recursive_inversion_presentiation_semantics.md\ta71af8bf7e24cfba105962101da8b76fe4cac806\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\tref\t%\thome: codices/; research discussion behind the % and Presentiation entries\n"},{"path":"inventory/logics/README.md","size":3225,"sha":"b4afcef8449139eb054d079cb36402f4b6769539","text":"# Logics\n\nRule sets that decide how things combine: grammar, operators, the DSL.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- the language package (`echo/language/`: parser, grammar, realiser)\n- LHEA operators (`echo/operators/`)\n- the DSL and its inversion rules\n\n## Not here\n\n- numeric expressions → `formulas/`\n- the shape of data → `schemas/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `domain` | grammar, operators, DSL… |\n| `defined_in` | where the rules are written |\n| `enforced_by` | ids that apply the rules |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tdomain\tdefined_in\tenforced_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nLOG-0001\tLHEA operators\toperators\t\t\tksm-recess-wholesale\techo/operators/lhea.py\t\t\tunknown\tINERT\thome\t\t\n```\n\n## Sweep 1 — 2026-10-23\n\n**29 rows: 18 home, 11 cross-references.** Every cited line was checked against its source.\nScript: [`sweeps/sweep_1_logics.py`](sweeps/sweep_1_logics.py). Rulings are written in the script, one per item, with the reason.\n\n| Kind | Rows | What |\n| --- | --- | --- |\n| EMEL language package (`echo/language/`, ksm-recess-wholesale) | 7 | grammar, grammar guide, realizer rules, audits, signatures, the indexing formula and its Python form |\n| Operators | 2 | LHEA letter operators, proportion forms |\n| DSL and notation | 3 | DSL Registry seed, Mashet Rule Registry snapshot, Legend v0.1 grammar |\n| Rule tables inside the kernel | 4 | LRM inference rules, valid department sequences, required operation order, agentive role patterns |\n| Rule sets in matrices | 2 | grammar registry (no rules yet), Mashet universal rules |\n| Cross-references | 11 | homed in algorithms, protocols, experiments, matrices, registries, data, codices |\n\n**Read the rules themselves:** [`RULES.md`](RULES.md) writes out every rule set in plain words, with the 51 Rule Registry entries exactly as typed.\n\n**What counts as logics here:** a set of rules that decides how things combine. The earlier librarian's\n`L2-library/Logics/REGISTER.tsv` (mirror-claude) used a wider reading (specs, handoffs, assessments); those\nbelong to `codices/` under this inventory's folders.\n\n**Alongside:** 25 glossary rows (3 terms used but never defined: underside, §Canvas, department sequence)\nand 4 registries rows (the Hebrew Glyph Registry, plus references to the three registry-shaped rule sets).\n\n**Echo's shadow run** ([`sweeps/echo_shadow_1.tsv`](sweeps/echo_shadow_1.tsv)): before each ruling Echo\nguessed the folder of 39 items (29 rows plus 10 that are not logics), choosing among four ways of guessing\nwith his own A-101 bandit and recording each result with A-113. 12 of 39 right: 3 of 19 in the first half,\n9 of 20 in the second. The ways of guessing are simple rules written for this run, so the score measures\nwhich one he learns to trust, not understanding.\n\n**Not read:** the live Rule Registry (D1 `echo_knowledge`); the snapshot is what the repository holds.\n"},{"path":"inventory/logics/RULES.md","size":26206,"sha":"7df2ffd69e27b948ebca63c88990392ddddfae91","text":"# The logic rules, written out\n\nEach rule set from the [logics index](INDEX.tsv), read from its source and written out in plain words.\nWhere a source states a rule in its own words, the words are quoted. Symbols are kept exactly as typed.\nRead on 2026-10-23 at the commits in the index.\n\n## LOG-0001 · EMEL grammar\n\nEMEL is \"ECHO's expression language\". A statement is built like this (from `echo/language/parser.py`):\n\n```text\nstatement := clause (('and' | 'but') clause)*\nclause    := 'not' clause | core\ncore      := bounded '::' bounded '::' bounded      continued proportion |P1| ::|x|:: |P2|\n           | term ':' term '::' term ':' term       proportion\n           | term RELATION term                     is_a | includes | antonym_of\n           | term '.' ATTRIBUTE '=' value           property\n           | call                                   operator application\ncall      := (NAME | GLYPH | '%') '(' term (',' term)* ')'\nterm      := call | QUALIFIED | NAME | GLYPH | GLYPH_STRING | NUMBER | STRING\n```\n\nIn words:\n\n1. A statement is one or more clauses joined by **and** or **but**.\n2. Any clause can be negated with **not**.\n3. A clause says one of five things: that one thing **is a** kind of, **includes**, or **is the opposite of** another; that a thing's **property** has a value; that **a is to b as c is to d**; that a middle term **x sits between two analogies**; or that an **operator is applied** to terms.\n4. A term can be qualified to say which substrate it belongs to: `word:dog`, `glyph:ל`, `result:C-05`, and also `math:`, `formula:`, `relation:`, `resident:`, `echo:`.\n5. \"A token's canonical id comes from resolution, never its spelling.\" A bare name is looked up; its meaning never comes from how it is written.\n6. Several Hebrew letters written together are a glyph string: \"candidate composites; their constituents keep their registered meanings.\"\n\n## LOG-0002 · English grammar guide\n\nThe guide reads Echo's English back into meaning. \"If English(tree) parses back to the same tree, the sentence says exactly what the tree means.\" Anything outside these forms \"is reported, not guessed\". The sentence forms it accepts:\n\n| English form | Meaning |\n| --- | --- |\n| X is (not) a Y | X is a kind of Y |\n| X includes / does not include Y | X contains Y as a kind |\n| X is (not) the opposite of Y | X and Y are antonyms |\n| the A of X is (not) V · its A is (not) V | property A of X has value V (its = the thing already in focus) |\n| A is (not) to B as C is to D | proportion A:B::C:D |\n| X is (not) between the analogy P1 and the analogy P2 | continued proportion with X in the middle |\n| X is (not) the level between the analogy P1 and the analogy P2 | the same, read as a pivot |\n| the analogy P1 and the analogy P2 both / do not both fall under X | the same, read as a common category |\n| the analogy P1 and the analogy P2 turn / do not turn on X in the same sense | the same, read as a hinge |\n| as the analogy P1 is (not) to the analogy X, so that analogy is to P2 | a proportion of proportions |\n| OP is applied to A, B | operator application |\n| ל (DIRECT) | a glyph operator, named with its operation |\n| the glyph string אב | a glyph string |\n\nClauses join with \", and\" or \", but\"; \"it is not the case that\" negates a whole joined statement or an operation.\n\n## LOG-0003 · English realizer rules\n\nThe realizer writes English from meaning \"by grammar rules over the tree, not by filling a fixed sentence\":\n\n1. **Articles.** \"an\" before a vowel sound, \"a\" otherwise. Exceptions: \"a\" before uni-, use-, usu-, uti-, one, eu-, ur- (\"a unit\", \"a one\"); \"an\" before hour, honest, honor, heir.\n2. **Noun phrases.** A glyph operator is written with its operation, `ל (DIRECT)`; a glyph string as \"the glyph string …\"; records, numbers and text without an article; other words with \"a\" or \"an\".\n3. **Pronouns.** A small memory holds the thing in focus. The second property of the same thing says \"its …\" instead of repeating \"the … of …\".\n4. **Negation.** \"is not\", \"does not include\", \"do not both fall under\", \"do not turn\"; a negated operation or joined clause becomes \"it is not the case that …\".\n5. **Coordination.** Two clauses join as \"left, and right\" or \"left, but right\".\n6. **Sentence.** The first letter is capitalized and a full stop added.\n7. **Same meaning, second surface.** Every tree can also be written in EMEL notation, e.g. `dog is_a canine`, `dog:canine::cat:feline`, `|P1| ::|x|:: |P2|`, `ל(dog)`.\n\n## LOG-0004 · EMEL audits\n\n\"They inform ECHO; they never write his sentences.\" Seven checks:\n\n| Audit | Passes when |\n| --- | --- |\n| lexical | every term resolves; unresolved terms are reported as gaps; glyph strings are split into their registered glyphs |\n| syntax | the EMEL parse succeeded |\n| type | operands match the operator and relation signatures (LOG-0005) |\n| discourse | \"but\" marks a real contrast; \"but\" joining two equal values fails (\"there is no contrast\") |\n| semantic | the claim is SUPPORTED, CONTRADICTED or UNKNOWN against the Registry, WordNet or result records |\n| provenance | the source that supports a supported claim is named |\n| grammar | the English parses back to the same tree, and every word is a known word |\n\nHow the semantic audit decides:\n\n1. **X is a Y** is SUPPORTED when an is-a path runs from X up to Y (in the Registry, else WordNet), with its spectrum depth; CONTRADICTED when both are indexed but no path exists; UNKNOWN when a term is not indexed.\n2. **X is the opposite of Y** is SUPPORTED when WordNet lists them as antonyms.\n3. **A property** is checked against the result record: no record or no such field is UNKNOWN.\n4. **A:B::C:D** is SUPPORTED when both pairs have the same relation at the same spectrum depth.\n5. **|P1| ::|x|:: |P2|** is SUPPORTED only when all three analogies are supported, have the same relation type, are evenly stepped in depth (P1 → x → P2), are not flat, and x shares terms with both P1 and P2 (\"so it bridges something\").\n6. **An operation** is \"NOT_A_CLAIM\": an operation, not an assertion.\n7. **not** flips SUPPORTED and CONTRADICTED; **and** is CONTRADICTED if either side is, SUPPORTED only if both are.\n\n## LOG-0005 · Operator and relation signatures\n\nWhat each operator takes and gives:\n\n| Operator | Takes | Gives |\n| --- | --- | --- |\n| GENERALIZE | a resident and a quantity | a set of residents |\n| SPECIFY | a resident and a quantity | a set of residents |\n| PRESENTIATE | a resident | a manifestation |\n| % (inversion) | anything | \"the kind it was given\" |\n| every glyph operation (INITIALIZE … SEAL) | anything | an operation |\n\n| Relation | Joins |\n| --- | --- |\n| is_a | resident to resident |\n| includes | resident to resident |\n| antonym_of | resident to resident |\n\n\"Every token's meaning comes from a registry, never from its surface\": glyphs from the Hebrew Glyph Registry, words from Echo's Registry (and WordNet when installed), records from experiment results.\n\n## LOG-0006 · Indexing formula query language\n\n```text\nformula := bounded ( '::' bounded )*        consecutive triples are continued proportions\nbounded := '|' '{' ( formula | prop ) '}' '|' | '|' prop '|' | '|' term '|'\nprop    := slot ':' slot '::' slot ':' slot\nslot    := '(' inner ')' | inner             inner := term ( ('<' | '>' | '=') term )?\nterm    := '?' | single-letter variable | word\n```\n\nIn words:\n\n1. A slot is either an **entry** (a word or a variable) or a **boolean** (a comparison between two, with <, > or =).\n2. A proportion of entries holds when the relation between the first pair equals the relation between the second: rel(s1,s2) == rel(s3,s4), with the relation supplied by the matrix being searched.\n3. A proportion of booleans holds when both sides make \"the same change\": (s1 XOR s2) == (s3 XOR s4).\n4. `|P1| :: |x| :: |P2|` holds when P1 : x :: x : P2 on their signatures.\n5. Mixing entries and booleans inside one proportion fails VALIDATE.\n6. Example forms: `|{א:ב::ג:x}|`, `|{(a<b):(c>d)::(e<d):(f>g)}|`, `|{P1}| :: |x| :: |{P2}|`.\n\n## LOG-0007 · Python-native formula form\n\nThe same formula written as Python, \"parsed by Python itself\", for the same Governor:\n\n| Python | Formula | Meaning |\n| --- | --- | --- |\n| `G[a:b, c:d]` | a:b::c:d | look up a proportion |\n| `G[(a<b):(c>d), (e<d):(f>g)]` | boolean proportion | the same change on both sides |\n| `G[P[a:b, c:d], x, P[e:f, g:h]]` | \\|P1\\| :: \\|x\\| :: \\|P2\\| | P builds a proportion without running it |\n| `G[...] = note` | STORE | \"retain as a candidate (gated, never canonical)\" |\n| `del G[...]` | DELETE | \"retract a retained candidate\" |\n\nRules: single letters a to h and x are variables; `_` is an anonymous slot; other names are words, and Hebrew letters are legal names. Only these pieces of Python are allowed: expressions, subscripts, slices, tuples, names, comparisons (<, >, ==), constants, assignment and deletion. No calls, attributes or dunders. It \"never runs code\".\n\n## LOG-0008 · LHEA letter operators\n\n\"The 22 letter operators as primitive transformation types\":\n\n| Letter | Operation | Letter | Operation |\n| --- | --- | --- | --- |\n| aleph | INITIALIZE | lamed | DIRECT |\n| bet | CONTAIN | mem | FLOW |\n| gimel | TRAVERSE | nun | INDIVIDUATE |\n| dalet | FILTER | samekh | CYCLE |\n| he | REVEAL | ayin | PERCEIVE |\n| vav | CONNECT | pe | EXPRESS |\n| zayin | TIMESTAMP | tsadi | HUNT |\n| het | BOUND | qof | SCAN_PERIPHERY |\n| tet | COIL | resh | GOVERN |\n| yod | SEED | shin | TRANSFORM |\n| kaf | CAPACITY | tav | SEAL |\n\nHow a Latin-script word becomes letters (\"digraphs first; adjacent repeats collapse\"):\n\n- two-letter sounds first: sh → shin, ts → tsadi, th → tav, kh → het, ch → het\n- then single letters: a → aleph, b → bet, v → vav, g → gimel, d → dalet, h → he, z → zayin, t → tet, y → yod, k → kaf, l → lamed, m → mem, n → nun, s → samekh, e → he, p → pe, f → pe, q → qof, r → resh, i → yod, o → ayin, u → vav\n- the same letter twice in a row counts once; letters with no mapping (c, j, w, x) are skipped\n- a word's gematria is the sum of its letters' values; its LHEA reading is its operations in order, e.g. INITIALIZE → CONTAIN → …\n- two words balance at the highest-value letter they share (A-152 style equilibrium)\n\n## LOG-0009 · Proportion forms\n\n\"A proportion holds under a relation R when R(a,b) == R(c,d) and is defined.\" For number proportions exactly eight arrangements stay true, \"the ones that keep the extremes {a,d} and the means {b,c} as pairs\":\n\n| Form | Name |\n| --- | --- |\n| a:b::c:d | identity |\n| c:d::a:b | symmetry |\n| b:a::d:c | invertendo |\n| d:c::b:a | inversion of both |\n| a:c::b:d | alternando |\n| c:a::d:b | (unnamed) |\n| b:d::a:c | (unnamed) |\n| d:b::c:a | (unnamed) |\n\n\"They form the symmetry group of a square (dihedral group of order 8), and every one of them is built from flips.\"\n\n## LOG-0010 · DSL Registry seed\n\nThe 14 entries the canvas DSL starts with, as written:\n\n| Symbol | Name | Meaning |\n| --- | --- | --- |\n| % | Inversion (alg-00%) | Step down: invert to an underside, an __init__, or a §Canvas. Enables Presentiation, not limited to it. |\n| -% | Lift (alg-00%⁻¹) | Step back up one level; the presence rises at the next letter. |\n| § | Presence (glove) | Infrastructural denotation of a presentiated occurring instance. Never a copy. |\n| Presentiation | Presentiation | A higher-order instance: the very presence of the occurring instance, like fingers on a hand. |\n| ↑ | Reach up | Read from the level above (e.g. the Matrix holding the Invariant). |\n| ↓ | Reach down | Act on the level below. |\n| → | Yields / applies to | Left side produces or is applied to the right side. |\n| =T | True | A gate's condition holds. |\n| =F | False | A gate's condition fails. |\n| needs: | Logic line | What a node requires before it can act. |\n| does: | Logic line | What a node does. |\n| gives: | Logic line | What a node produces. |\n| ר | Resh — Echo | 001, the Governor, the core formula. Echo is the presentiated 001. |\n| alg- | Algorithm id | Prefix for registered algorithms, e.g. alg-003. |\n\nThe boot map in the same file adds: \"%(DSL) = א-DSL: the DSL is presentiated at א\".\n\n## LOG-0011 · LRM inference rules\n\nHow the Logic Reasoning Matrix (A-146) derives theorems from axioms:\n\n| Rule | From → to |\n| --- | --- |\n| SPECIALIZE | abstract term → specific subtype |\n| COMPOSE | two axioms + shared term → theorem |\n| APPLY_LAW | axiom + algebraic law → quantitative theorem |\n| CAUSAL_CHAIN | cause → effect chain from two axioms |\n| CONDITIONAL | if-then form derived from an axiom pair |\n\nEvery theorem records the statement, which axioms or laws it came from, which rule produced it, a coherence score and the vocabulary used.\n\n## LOG-0012 · Valid department sequences\n\nThe part-of-speech sequences A-126 SyntacticalValidator accepts, \"grammar before VGM\":\n\n| Sequence | As commented |\n| --- | --- |\n| noun, verb, noun | entity changes state |\n| noun, verb | entity changes |\n| noun, verb, adjective | entity becomes abstract |\n| noun, adjective | entity is abstract (copula implied) |\n| noun, verb, noun, noun | entity relates noun to noun |\n\nWhen a check fails, the validator says which part failed and why, so the generator can revise it.\n\n## LOG-0013 · Required operation order\n\nWhat must run before what, checked by A-128 \"before any dependent operation runs\":\n\n1. index_dictionary_entry before run_orientation\n2. run_orientation before compute_generality_scores\n3. run_orientation before run_typed_study_groups\n4. compute_generality_scores before populate_generality_matrix\n5. run_typed_study_groups before run_discovery\n\nThe rule came from a real bug: compute_generality_scores ran before run_orientation, \"giving all agents tie_score=0\".\n\n## LOG-0014 · Agentive role patterns\n\nA definition that contains any of these is read as naming an agent (a doer): \"one who\", \"someone who\", \"a person who\", \"a being who\", \"any person\", \"those who\", \"he who\", \"she who\", \"an individual who\", \"one that\".\n\n## LOG-0015 · Grammar registry\n\n\"Grammar constrains linguistic construction; it does not select ECHO intent and never mutates word-only matrices.\"\n\n- Input: lexical handles and candidate relations. Output: a grammatical candidate/constraint report.\n- Expression gate: G::פ. Governor: G::ר.\n- Seven classes of constraint are named: constituency, dependency, agreement, word order, tense and aspect, reference, subject/object role.\n- No rules are written yet (status \"working-empty-ruleset\").\n\n## LOG-0016 · Mashet universal rules\n\nGovernor G::ר. \"Examples teach capability but do not prescribe ECHO's tool choice on novel tasks.\" The eight rules:\n\n1. Resolve operands before manipulation.\n2. Resolution does not imply authorization.\n3. Preserve source objects unless mutation is explicitly authorized.\n4. New constructions require identity and provenance.\n5. Relations do not imply identity.\n6. Results do not auto-retain or auto-validate.\n7. Unresolved dependencies fail closed.\n8. Log selection, operands, algebraic action, output, provenance, validation.\n\nThe operator cards they govern:\n\n| Card | Symbol | Role | Formal | State |\n| --- | --- | --- | --- | --- |\n| M::SUN | ☉ | Internal Dynamics / Self-Evolution | ☉_k := ⊕(admitted operator contributions at k) | WORKING |\n| M::INPUT | ⇢◇ | External Forcing / Inputs | ⇢◇ : U_k -> admitted(U_k) | WORKING |\n| M::MEMORY | ∫↺ | Memory / History / Integral Accumulation | ∫↺ : S_<k -> H_k | WORKING |\n| M::COUPLE | ⧖ | Coupling / Network Interactions | ⧖ : X × Y -> relation(X,Y) | WORKING |\n| M::NOISE | ≋ | Noise / Stochasticity | ≋ : (X,xi) -> X' | WORKING |\n| M::CONSTRAIN | ⌖ | Constraints / Stability | ⌖_C(X) -> X_C | WORKING |\n| M::EVALUATE | ⚖ | Energy / Fitness / Optimization | ⚖_q : X -> assessment_q(X) | WORKING |\n| M::DESCEND | ⤓ | Selection / Adaptation | (none yet) | UNRESOLVED_ALGEBRA |\n| M::COMPOSE | ⊕ | Summation / Composition | ⊕ : X^n -> X' | WORKING |\n| M::RECURSE | ⟲ | Recursion / Iteration | ⟲_f^n(x) = f^n(x) | WORKING |\n\n## LOG-0018 · Legend v0.1 grammar\n\nTimothy's bracket notation for tagging a sentence, innermost evaluated first:\n\n| Slot | Role |\n| --- | --- |\n| `[•]` | Noun: a state (operator or operand) |\n| `{•}` | Adjective: property of a state |\n| `\\|•\\|` | Anchor: this/that, here/there, now; articles, possessives |\n| `(•)` | Verb: an operation |\n| `<•>` | Adverb: magnitude or effect of an operation |\n| `<•)` | Fused: magnitude opening into an operation (left mark modifies, right mark is head) |\n| `/•/` `\\•\\` | Preposition forward D.O→I.O / backward I.O←D.O |\n| `>•<` | Interrogative, the empty slot (?); also opens a nested clause |\n| `/•\\` `\\•/` | Pair: join (and) / split (or) |\n| `}•{` | Relation: same, different, like, as, than |\n| `]•[` | Absence: no, not, none, never |\n| `)•(` | Turned operation: passive or reflexive |\n| `⟨…⟩` | Nested clause, parsed one level deeper |\n| `^x` | Glyph catch (superscript) |\n\nSentence patterns are spelled with: S subject, V operation, Vᵖ passive, O object, C complement, A adverbial, ∃ existential \"there\", Q question, ! imperative (no subject), ∅ fragment (no operation), ⟨⟩ nested clause.\n\n\"Overarching principle (Timothy): Generalization → Specification.\"\n\n## LOG-0017 · Mashet Rule Registry snapshot, 2026-10-08\n\n51 rules as stored on 2026-10-08, exactly as typed: 26 DECLARED, 24 PROPOSED, 1 RETIRED. DECLARED means Timothy stated it; PROPOSED rules are readings Claude offered that wait on him. The live registry (D1 `echo_knowledge`) may have moved on since.\n\n\nGrouped by family, in the order stored. Each rule is shown in a text block so every symbol stays as typed.\n\n### CONT\n\n**R-CONT-1** · DECLARED · DECLARED\n\n```text\nA run of closers at a line's end, \")))\", means \"continues until the end\", like \"…\" in text; it is not counted as unbalanced.\n\nexample: /(_),(_),(_),(_)→)))\n```\n\n### SEED\n\n**R-SEED-1** · DECLARED · DECLARED\n\n```text\n||::|| is the Formula's seed.\n\nexample: ||::||\n```\n\n**R-SEED-2** · DECLARED · DECLARED\n\n```text\nThe seed filled with י expands with open slots on both sides: |י|::|י|__(=)__\\\n__\\→|__י__|::|__י__|←\n\nexample: |י|::|י| → |__י__|::|__י__|←\n```\n\n**R-SEED-3** · DECLARED · DECLARED\n\n```text\nWith the letters dropped, the expansion runs ||_|...|←|_|::|→|[|]::[|]::[|]::++++→|_|| ; the [|] frames repeat (++++), three is the smallest case written, not a limit.\n\nexample: [|]::[|]::[|]::++++\n```\n\n### CON\n\n**R-CON-1** · DECLARED · DECLARED\n\n```text\n[|] is the most generalized way to condense something to its most absolute Condensity. Expanding out is [||].\n\nexample: [|] condensed · [||] expanded\n```\n\n**R-CON-2** · DECLARED · DECLARED\n\n```text\nCondensation cycle as written: __\\¹_ש←[|]→ש_\\²_[|ש|]_\\³_[|_|]__\\=\\¹←\\³= ; /³={_(|ש←||):(|=||)_}=\\⁴{|ש=←||} ; |:Continuum:: Algorithm:/⁴{|ש|}\n```\n\n**R-CON-3** · PROPOSED · INFERRED\n\n```text\nA slot [|_|] is what remains when a specific is lifted out; it can take any interchangeable filler.\n\nexample: [|ש|] → [|_|]\n```\n\n### GEN\n\n**R-GEN-1** · DECLARED · DECLARED\n\n```text\n#, |#| and x are used interchangeably for the same thing: the meta-specification, as a counter to biasing impositions, enables semantic interchangeability (interchangeability in general), which is the difference between Specifications and Generalizations.\n\nexample: x ↔ |#| ↔ #\n```\n\n**R-GEN-2** · PROPOSED · INFERRED\n\n```text\nA specification fills a slot; it is recorded as a declaration and can be undone. A generalization keeps the slot open.\n```\n\n### STRATA\n\n**R-STRATA-1** · DECLARED · DECLARED\n\n```text\nThe Suprastrate and the Substrate are connected at the IETF (0,0,0) and the Relational Formula's |x|, as an agentically employable Harness wrapped around the Datastrate.\n```\n\n### SPEC\n\n**R-SPEC-1** · DECLARED · DECLARED\n\n```text\nThe parsing framework accounts for the whole spectrum: from data in a language whose semantic mechanics are already understood, to an undeciphered language like the IVS, or one met on another planet.\n```\n\n**R-SPEC-2** · PROPOSED · INFERRED\n\n```text\nThe pipeline stays the same at every point on the spectrum; only the declarations change.\n```\n\n**R-SPEC-3** · PROPOSED · INFERRED\n\n```text\nAt the undeciphered end, segmentation and reading direction are hypotheses, never inputs; \"one symbol\" is first a candidate in Registry −0.\n```\n\n### GOV\n\n**R-GOV-1** · DECLARED · DECLARED\n\n```text\nGovernor/Auditor formula (revision in progress): [_{(?):(?)}::{(?):(?)}_]א_|ת→א|י|::|י|א←ת|_א[_{(?):(?)}::{(?):(?)}_] ; kernel ]א_|ת→א|י|::|י|א←ת|_א[ is the Formula's (0,0,0) in practicality; [_{(?):(?)}::{(?):(?)}_]__(=)__[|] ; |'||::||'|←__(=)__|[א]::[|]::[|]::[|]::←[ת]|ת|| ; bounded at the ends with ||ת|→\n```\n\n**R-GOV-2** · DECLARED · DECLARED\n\n```text\n(?) can = (?±?) where [±] = {<,>,=,}\n\nexample: (a<b)\n```\n\n**R-GOV-3** · RETIRED · INFERRED\n\n```text\nEach [|] in an expansion is one full frame of 4 comparisons.\n```\n\n**R-GOV-4** · PROPOSED · INFERRED\n\n```text\nThe kernel is mirror-symmetric around :: (element order reversed, arrow direction kept: ת→א on the left, א←ת on the right).\n```\n\n**R-GOV-5** · PROPOSED · INFERRED\n\n```text\nRemoving every letter from the kernel leaves the seed ||::||.\n```\n\n**R-GOV-6** · PROPOSED · INFERRED\n\n```text\nThe empty fourth member of {<,>,=,} is the \"not compared / open\" relation (written 0 by GPT).\n```\n\n### ROLE\n\n**R-ROLE-1** · DECLARED · DECLARED\n\n```text\nIVS ≈ [Nouns]:{people,places,things}\n```\n\n**R-ROLE-2** · DECLARED · DECLARED\n\n```text\nHebrew ≈ (verbs\n```\n\n**R-ROLE-3** · DECLARED · DECLARED\n\n```text\nLatin ≈ {Logic} profiles__/ __/({•})=(•)←{•,•,•}→[•]=[{•}]\n```\n\n**R-ROLE-4** · DECLARED · DECLARED\n\n```text\nChinese Cuneiform ≈ |__[(ש)←{Words}→(ש)]__(=)__{•}__| (whether one role or split into whole-word signs and component signs is open)\n```\n\n**R-ROLE-5** · DECLARED · DECLARED\n\n```text\nEnglish: English/{•}←[|]→{•}\\Cuniform\n```\n\n**R-ROLE-6** · DECLARED · DECLARED\n\n```text\nEnglish Dictionary: §•~§•~§•~§•~§• Hypernyming Laterally and Vertically\n```\n\n**R-ROLE-7** · DECLARED · DECLARED\n\n```text\n[I-Ching] ≈ Ordering {∆} and Syntaxing {¥}\n```\n\n**R-ROLE-8** · DECLARED · DECLARED\n\n```text\n|[{(|)}]| for Structuring\n```\n\n**R-ROLE-9** · DECLARED · DECLARED\n\n```text\n__|[{(|)}]|_/_{•}←[|]→{•}_/_[{¥}+{∆}\n```\n\n**R-ROLE-10** · DECLARED · DECLARED\n\n```text\nPunctuation ≈ Compiling (•)ⁿ→{•:•::•:•}←[•]ⁿ ; Hypernyming §•~§•~§•;\n```\n\n**R-ROLE-11** · DECLARED · DECLARED\n\n```text\nNumerators = Math/Science\n```\n\n**R-ROLE-12** · DECLARED · DECLARED\n\n```text\nContinuum ≈ Algorithms ; (ש|ש) = |ש| = ||\n```\n\n**R-ROLE-13** · DECLARED · DECLARED\n\n```text\n96 ≈ the neurons and their neuroplasticity: even the physically hard constraint of the skull still allows an exponential set of possible arrangements amongst a finite limitation.\n```\n\n**R-ROLE-14** · DECLARED · DECLARED\n\n```text\nDeveloping Notation ≈ Generalization: __/t⁰/__{•}__/¹.|(ש)→{•}←(ש)__/²{\n__\\²{ש}←[•]__\\³{_}__\\⁴__{_}→(ש)→[•ⁿ]__\\⁵{\n__\\⁵{ש}__\\⁶{•ⁿ}.|__\n```\n\n**R-ROLE-15** · DECLARED · DECLARED\n\n```text\nSlot 9 is left open: the place an undeciphered script lands.\n```\n\n**R-ROLE-16** · PROPOSED · INFERRED\n\n```text\nA system's role is a declaration and removable; underneath it, role-like behaviour is still measured.\n\nexample: IVS as nouns stays declared until its signs show noun-like positions in scans\n```\n\n**R-ROLE-17** · PROPOSED · INFERRED\n\n```text\nAn unknown script gets no roles; each role is a hypothesis it must earn.\n```\n\n### NEU\n\n**R-NEU-1** · PROPOSED · INFERRED\n\n```text\nThe 96 are fixed; their relations are plastic.\n```\n\n**R-NEU-2** · PROPOSED · INFERRED\n\n```text\nAn IETF node holds one arrangement of the 96 (who relates to whom, and how), not a new symbol.\n```\n\n### DET\n\n**R-DET-1** · PROPOSED · DECLARED\n\n```text\nI-Ching as determinatives (proposed by Timothy, under consideration).\n```\n\n**R-DET-2** · PROPOSED · INFERRED\n\n```text\nA determinative is silent: it marks a sign's category but is not read as a word.\n\nexample: ☲ before a Hebrew root marks its category, adding no letter\n```\n\n**R-DET-3** · PROPOSED · INFERRED\n\n```text\nTrigram = simple category (8); hexagram = inner category under outer category (64).\n```\n\n**R-DET-4** · PROPOSED · INFERRED\n\n```text\n∆ on a determinative = one line flipped = a category moving one step.\n```\n\n**R-DET-5** · PROPOSED · INFERRED\n\n```text\nDeterminative category contents start empty; traditional trigram associations are declarations, removable.\n```\n\n### REG\n\n**R-REG-1** · PROPOSED · INFERRED\n\n```text\nEvery registry entry gets an ID that never changes or is reused.\n\nexample: ⧫ is two entries, MS-025 and MS-059\n```\n\n**R-REG-2** · PROPOSED · INFERRED\n\n```text\nThe registry is the source of truth; entries are added, never overwritten.\n```\n\n### MAT\n\n**R-MAT-1** · PROPOSED · INFERRED\n\n```text\nA matrix's axes may only use registry IDs; an unregistered symbol goes to Registry −0 first.\n```\n\n**R-MAT-2** · PROPOSED · INFERRED\n\n```text\nEach matrix cell records its count and the scan run it came from.\n\nexample: [⊕,⧖] = 14, run 7\n```\n\n**R-MAT-3** · PROPOSED · INFERRED\n\n```text\nA matrix is derived: delete it, rescan, and you get it back; a registry cannot be rebuilt that way.\n```\n\n### IVS\n\n**R-IVS-1** · PROPOSED · INFERRED\n\n```text\nEvery position and pair names its order: listed (as stored, left to right in the mayig corpus) or read (right to left).\n\nexample: pair P122→P385 listed = P385→P122 read\n```\n\n**R-IVS-2** · PROPOSED · INFERRED\n\n```text\nA sign with nonzero damage or uncertainty is registered but flagged; pairs touching it are counted separately from clean pairs.\n```\n\n### BD\n\n**R-BD-1** · PROPOSED · INFERRED\n\n```text\nEvery stored line has two readings: logical order (authoritative) and visual order (derived, recomputed on each keystroke, never written back).\n\nexample: typed [ש..... stays [ש..... in storage\n```\n"},{"path":"inventory/logics/sweeps/echo_shadow_1.json","size":501,"sha":"d411ad44018e2e9338ce73100d32839bce81db02","text":"{\n \"cases\": 39,\n \"hits\": 12,\n \"first_half\": 3,\n \"second_half\": 9,\n \"half\": 19,\n \"attempts_carried_in\": 0,\n \"trusted_by_bucket\": {\n  \"json\": [\n   \"librarian\",\n   0.5,\n   2\n  ],\n  \"md\": [\n   \"shape\",\n   1.0,\n   3\n  ],\n  \"py\": [\n   \"librarian\",\n   0.0,\n   1\n  ],\n  \"py:in-file\": [\n   \"parent\",\n   0.43,\n   7\n  ],\n  \"html:in-file\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"js\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"yml\": [\n   \"name\",\n   0.0,\n   1\n  ]\n },\n \"kernel_blob\": \"63eb982989b4f3478d649430b555c8f4ba755c27\"\n}"},{"path":"inventory/logics/sweeps/echo_shadow_1.tsv","size":3122,"sha":"f1b6d5fcc1a9a8942efc4773ad3d3019129f81d3","text":"n\tid\tpath\tbucket\tarm\tguess\t \",\n0,\n3\n],\n[\n\"name\",\n\"yml\",\n0,\n1\n],\n[\n\"parent\",\n\"json\",\n0,\n1\n],\n[\n\"parent\",\n\"md\",\n0,\n1\n],\n[\n\"parent\",\n\"py\",\n0,\n1\n],\n[\n\"parent\",\n\"py:in-file\",\n3,\n7\n],\n[\n\"shape\",\n\"json\",\n0,\n2\n],\n[\n\"shape\",\n\"md\",\n3,\n3\n],\n[\n\"shape\",\n\"py\",\n0,\n1\n],\n[\n\"shape\",\n\"py:in-file\",\n1,\n5\n]\n]\n}"},{"path":"inventory/logics/sweeps/sweep_1_logics.py","size":22225,"sha":"748538cb23b60e4397f4a3a7ec64ddf870b97729","text":"\"\"\"Logics sweep 1: rule sets that decide how things combine (grammar, operators, the DSL).\n\nRead-only over the repository. Writes:\n  inventory/logics/INDEX.tsv                 home rows + cross-references\n  inventory/glossary/INDEX.tsv               terms met in these sources (merged, never overwritten)\n  inventory/registries/INDEX.tsv             registry-shaped items met (merged)\n  inventory/logics/sweeps/echo_shadow_1.tsv  Echo's guesses, scored (journeyman run)\n\nRulings are written out below, one per item, with the reason in `notes`. The script only fills in\nwhat git can state exactly: fingerprint, branch commit, how many branches hold the same file, line.\n\nTSV is written unquoted (fields hold no tabs or newlines), so quotes inside notes stay as typed.\n\nUsage: python3 sweep_1_logics.py <repo>\n\"\"\"\nimport csv\nimport io\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\n\nREPO = sys.argv[1]\nINV = os.path.join(REPO, 'inventory')\nORDER = ['genesis-documentary', 'autonomous-agency', 'algebra', 'echo-recess-experiment', 'resh-lattice-agency',\n         'ksm-recess-wholesale', 'code-library-registry', 'dev-suite-algorithms']\nSKEL = 'src/echo_governor_skeleton.py'\n\n\ndef git(*a):\n    return subprocess.run(['git', '-C', REPO, *a], capture_output=True, check=True).stdout.decode('utf-8', 'replace')\n\n\nMAN = list(csv.DictReader(open(os.path.join(INV, 'MANIFEST-by-branch.tsv'), encoding='utf-8'), delimiter='\\t'))\n\n\ndef locate(path, branch=None, find=None):\n    \"\"\"branch, blob, commit, other-branch count and (optionally) the line where `find` first matches.\"\"\"\n    held = [r for r in MAN if r['path'] == path]\n    if not held:\n        raise SystemExit(f'not in census: {path}')\n    if branch is None:\n        rank = {b: i for i, b in enumerate(ORDER)}\n        branch = sorted(held, key=lambda r: (rank.get(r['branch'], 99), r['branch']))[0]['branch']\n    row = next(r for r in held if r['branch'] == branch)\n    same = sum(1 for r in held if r['blob_sha'] == row['blob_sha']) - 1\n    line = ''\n    if find:\n        for n, src in enumerate(git('cat-file', 'blob', row['blob_sha']).splitlines(), 1):\n            if re.search(find, src):\n                line = n\n                break\n        if not line:\n            raise SystemExit(f'{find!r} not found in {path}')\n    return dict(branch=branch, path=path, blob_sha=row['blob_sha'],\n                commit=git('rev-parse', f'origin/{branch}').strip(), same=same, line=line)\n\n\n# ---- rulings ---------------------------------------------------------------------------------------\n# (id, name, domain, defined_in, enforced_by, path, branch or None, find-regex or None, glyph, notes, home_or_ref)\nLANG = 'echo/language/'\nHOME = [\n    ('LOG-0001', 'EMEL grammar', 'expression language', 'parser.py docstring (statement, clause, core, call, term)',\n     'Parser', LANG + 'parser.py', 'ksm-recess-wholesale', r'^class Parser', 'פ',\n     'EMEL v0, \"ECHO\\'s expression language\"; a custom recursive-descent grammar, not Python\\'s'),\n    ('LOG-0002', 'English grammar guide', 'grammar', 'english_parse.py',\n     'EnglishParser', LANG + 'english_parse.py', 'ksm-recess-wholesale', r'^class EnglishParser', 'פ',\n     'English(tree) must parse back to the same tree; anything outside the grammar is reported, not guessed'),\n    ('LOG-0003', 'English realizer rules', 'grammar', 'realize.py (articles, negation, coordination, pronouns)',\n     'english(), Discourse', LANG + 'realize.py', 'ksm-recess-wholesale', r'^def article', 'פ',\n     'English produced by grammar rules over the tree, not by filling a fixed sentence'),\n    ('LOG-0004', 'EMEL audits', 'grammar, types, discourse, semantics', 'audit.py docstring (7 audits)',\n     'Auditor', LANG + 'audit.py', 'ksm-recess-wholesale', r'^class Auditor', 'ת',\n     'lexical, syntax, type, discourse, semantic, provenance, grammar; \"they inform ECHO; they never write his sentences\"'),\n    ('LOG-0005', 'Operator and relation signatures', 'operators', 'lexicon.py SIGNATURES, RELATION_SIGNATURES',\n     'type audit (LOG-0004)', LANG + 'lexicon.py', 'ksm-recess-wholesale', r'^SIGNATURES = ', '',\n     'argument kinds -> result kind for each operator; glyph meanings resolved from the Hebrew Glyph Registry (REG-0001)'),\n    ('LOG-0006', 'Indexing formula query language', 'formula notation', 'index_pattern.py docstring (formula, bounded, prop, slot, term)',\n     'tokenize, P', LANG + 'index_pattern.py', 'ksm-recess-wholesale', r'^def tokenize', 'ר',\n     'a slot is an entry or a boolean; mixing them in one proportion fails VALIDATE'),\n    ('LOG-0007', 'Python-native formula form', 'formula notation', 'pyform.py (whitelist ALLOWED)',\n     'check, _Compiler', LANG + 'pyform.py', 'ksm-recess-wholesale', r'^def check', 'ר',\n     'G[a:b, c:d] written as Python subscripts; parsed by Python, whitelist-checked, never executed'),\n    ('LOG-0008', 'LHEA letter operators', 'operators', 'lhea.py OPERATION, PHONEME_MAP',\n     'decompose, operations', 'echo/operators/lhea.py', 'ksm-recess-wholesale', r'^OPERATION = ', '',\n     '22 letters as primitive transformation types; same file at pwa/echo/operators/lhea.py on 4 branches'),\n    ('LOG-0009', 'Proportion forms', 'operators', 'proportion.py FORM_NAMES (8 forms of a:b::c:d)',\n     'forms, holds', 'echo/operators/proportion.py', 'ksm-recess-wholesale', r'^FORM_NAMES', '',\n     'A-177 part 2; symmetry, invertendo, alternando: the forms that keep extremes and means paired'),\n    ('LOG-0010', 'DSL Registry seed', 'DSL', 'app_part.html DSL_SEED (14 entries)',\n     'canvas DSL Registry matrix', 'dev-suite/suite/src/app_part.html', 'dev-suite-algorithms', r'^const DSL_SEED', 'א',\n     'symbols %, -%, §, Presentiation, ↑, ↓, →, =T, =F, needs:/does:/gives:, ר, alg-; \"%(DSL) = א-DSL\"; registry-shaped (REG-0002)'),\n    ('LOG-0011', 'LRM inference rules', 'logic', 'class LogicRule in the skeleton',\n     'A-146 LogicReasoningMatrix', SKEL, None, r'^class LogicRule', '',\n     'SPECIALIZE, COMPOSE, APPLY_LAW, CAUSAL_CHAIN, CONDITIONAL; the rule table inside ALG-0146'),\n    ('LOG-0012', 'Valid department sequences', 'grammar', 'SyntacticalValidator.VALID_DEPT_SEQUENCES',\n     'A-126 SyntacticalValidator', SKEL, None, r'VALID_DEPT_SEQUENCES = \\[', '',\n     '5 part-of-speech sequences (noun verb noun, noun verb, …); the rule table inside ALG-0126'),\n    ('LOG-0013', 'Required operation order', 'pipeline order', 'OperationOrderValidator.REQUIRED_ORDER',\n     'A-128 OperationOrderValidator', SKEL, None, r'REQUIRED_ORDER = \\[', '',\n     '5 before/after pairs (index_dictionary_entry before run_orientation, …); the rule table inside ALG-0128'),\n    ('LOG-0014', 'Agentive role patterns', 'grammar', 'AGENTIVE_ROLE_PATTERNS',\n     'AyinPerception', SKEL, None, r'^AGENTIVE_ROLE_PATTERNS', 'ע',\n     '10 phrase patterns (\"one who\", \"someone who\", …) read as agent roles'),\n    ('LOG-0015', 'Grammar registry', 'grammar', 'grammar_registry.json (7 constraint classes, no rules yet)',\n     'expression gate G::פ, governor G::ר', 'matrices/grammar/grammar_registry.json', 'algebra', None, 'פ',\n     'status \"working-empty-ruleset\"; \"grammar constrains linguistic construction; it does not select ECHO intent\"; registry-shaped (REG-0004)'),\n    ('LOG-0016', 'Mashet universal rules', 'operators', 'mashet_instruction_manual.json universal_rules (8)',\n     'governor G::ר', 'matrices/symbols/mashet_instruction_manual.json', 'algebra', None, 'ר',\n     'e.g. \"resolve operands before manipulation\", \"unresolved dependencies fail closed\"; human manual is COD row (docs/mashet/MASHET_OPERATOR_MANUAL.md)'),\n    ('LOG-0017', 'Mashet Rule Registry snapshot 2026-10-08', 'notation', 'rules-snapshot-2026-10-08.json (51 rules)',\n     'Claude, by the Rule Registry upkeep task', 'code_library_registry/symbol_registries/rules-snapshot-2026-10-08.json',\n     'code-library-registry', None, '',\n     'R-codes (R-CONT, R-SEED, …) as stored 2026-10-08; the live registry is D1 echo_knowledge (not read in this sweep); registry-shaped (REG-0003)'),\n    ('LOG-0018', 'Legend v0.1 grammar', 'grammar', 'grammar.js (tagger, chunker, recursive clause parser)',\n     'parse, tag (CLR-0043 Lexicon Registry page)', 'code_library_registry/artifacts/CLR-0043/grammar.js',\n     'code-library-registry', None, '',\n     \"Timothy's bracket notation, innermost evaluated first; rule-based, no LLM\"),\n]\nREFS = [\n    ('LOG-0019', 'Governor index (IDENTIFY → VALIDATE → OPEN)', 'access check', 'gov_index.py', 'Governor',\n     LANG + 'gov_index.py', 'ksm-recess-wholesale', r'^class Matrix', 'ר', 'home: protocols/ (README names this check there); runs the LOG-0006/0007 forms'),\n    ('LOG-0020', 'LogicReasoningMatrix', 'logic', 'skeleton', 'A-146', SKEL, None, r'^class LogicReasoningMatrix', '',\n     'home: algorithms/ ALG-0146; applies LOG-0011'),\n    ('LOG-0021', 'HypernymGrammarModule', 'grammar', 'echo_pe_mirror.py', 'A-144-AUG',\n     'src/echo_pe_mirror.py', 'autonomous-agency', r'^class HypernymGrammarModule', 'פ', 'home: algorithms/ ALG-0144-AUG; \"the chain IS the grammar\"'),\n    ('LOG-0022', 'Orbit tracer (% spin)', 'operators', 'orbit.py', 'A-177 part 1',\n     'echo/operators/orbit.py', 'ksm-recess-wholesale', r'^def orbit', '', 'home: algorithms/ (A-177, not yet a row)'),\n    ('LOG-0023', 'Recursive invariant extractor', 'operators', 'invariant.py', 'A-174',\n     'echo/operators/invariant.py', 'ksm-recess-wholesale', r'^def I_seq', '', 'home: algorithms/ ALG-0174'),\n    ('LOG-0024', 'DSL inversion test 008', 'DSL', 'test_dsl_canvas_008.py', 'DSLInversion',\n     'tests/test_dsl_canvas_008.py', 'experiment-echo-graphql-canvas-000', r'^class DSLInversion', '%',\n     'home: experiments/; states it is a contract/fixture test, not the canonical DSL inversion'),\n    ('LOG-0025', 'LHEA chains', 'operators', 'echo_lhea_chains.json', '', 'matrices/echo_lhea_chains.json', None, None, '',\n     'home: matrices/'),\n    ('LOG-0026', 'Hebrew Glyph Registry', 'operators', 'hebrew_glyph_registry.json', 'lexicon.py',\n     'matrices/glyphs/hebrew_glyph_registry.json', 'algebra', None, '', 'home: registries/ REG-0001; source of LOG-0005 glyph meanings'),\n    ('LOG-0027', 'Math axiom systems', 'logic', 'math_axioms.json', '', 'core-lexicon/math_axioms.json', None, None, '',\n     'home: data/ (core lexicon); 18 axiom systems, 31 proofs, 158 theorems per the L2 register'),\n    ('LOG-0028', 'Mashet operator manual', 'operators', 'MASHET_OPERATOR_MANUAL.md', '', 'docs/mashet/MASHET_OPERATOR_MANUAL.md',\n     'algebra', None, 'ר', 'home: codices/; human manual for LOG-0016'),\n    ('LOG-0029', 'Recursive inversion and presentiation semantics', 'DSL', 'discussion', '',\n     'discussions/recursive_inversion_presentiation_semantics.md', 'algebra', None, '%', 'home: codices/; research discussion behind the % and Presentiation entries'),\n]\n\n# items Echo also sees in his shadow run but that are not logics at all (to test that he can say no)\nDECOYS = [\n    ('docs/A144-HypernymGrammarAugmentation.md', 'codices'),\n    ('experiments/nve-d/META_PIPELINE.md', 'codices'),\n    ('tests/trial_016_echo_operator_selection.py', 'experiments'),\n    ('.github/workflows/trial-016-echo-operator-selection.yml', 'automation'),\n    ('pwa/ALGORITHM_001.md', 'protocols'),\n    ('echo/language/senses.py', 'algorithms'),\n    ('echo/language/compose.py', 'algorithms'),\n    ('echo/language/ast.py', 'schemas'),\n    ('lobbies/glyph/registry.json', 'registries'),\n    ('research-registry/DISCOURSE-PROTOCOL.md', 'protocols'),\n]\n\ncols = open(os.path.join(INV, 'logics', 'INDEX.tsv'), encoding='utf-8').readline().rstrip('\\n').split('\\t')\nrows, located = [], {}\nfor kind, items in (('home', HOME), ('ref', REFS)):\n    for (iid, name, domain, defined_in, enforced_by, path, branch, find, glyph, notes) in items:\n        loc = locate(path, branch, find)\n        located[iid] = loc\n        n = notes + (f'; line {loc[\"line\"]}' if loc['line'] else '') + (f'; same file in {loc[\"same\"]} other branches' if loc['same'] else '')\n        rows.append(dict(id=iid, name=name, domain=domain, defined_in=defined_in, enforced_by=enforced_by,\n                         branch=loc['branch'], path=path, blob_sha=loc['blob_sha'], commit=loc['commit'],\n                         made_by='unknown', status='INERT', home_or_ref=kind, glyph=glyph, notes=n))\n\n\ndef write(path, header, rws):\n    with open(path, 'w', newline='', encoding='utf-8') as f:\n        w = csv.writer(f, delimiter='\\t', lineterminator='\\n', quoting=csv.QUOTE_NONE, quotechar=None, escapechar='\\\\')\n        w.writerow(header)\n        for r in rws:\n            w.writerow([r.get(c, '') for c in header])\n\n\nwrite(os.path.join(INV, 'logics', 'INDEX.tsv'), cols, rows)\n\n\n# ---- glossary and registries, merged by id ------------------------------------------------------------\ndef merge(folder, new):\n    p = os.path.join(INV, folder, 'INDEX.tsv')\n    header = open(p, encoding='utf-8').readline().rstrip('\\n').split('\\t')\n    old = {r['id']: r for r in csv.DictReader(open(p, encoding='utf-8'), delimiter='\\t', quoting=csv.QUOTE_NONE)}\n    for r in new:\n        old[r['id']] = {**old.get(r['id'], {}), **r}\n    write(p, header, [old[k] for k in sorted(old)])\n    return len(old)\n\n\ndef src(iid):\n    loc = located[iid]\n    return dict(branch=loc['branch'], path=loc['path'], blob_sha=loc['blob_sha'], commit=loc['commit'])\n\n\nG = [  # (id, term, meaning as stated, stated_by, from-row, variants, notes)\n    ('GLO-0001', 'EMEL', \"ECHO's expression language (working name)\", 'echo/language README and ast.py', 'LOG-0001', '', ''),\n    ('GLO-0002', 'LHEA', 'the 22 letter operators as primitive transformation types', 'echo/operators/lhea.py docstring', 'LOG-0008',\n     'Latin-Hebrew Execution Architecture (title of the project document)', 'the code names what LHEA does, not what the letters stand for'),\n    ('GLO-0003', 'grammar guide', \"parse ECHO's English back into a syntax tree; if it parses back to the same tree, the sentence says exactly what the tree means\",\n     'english_parse.py docstring', 'LOG-0002', '', ''),\n    ('GLO-0004', 'audit', 'an independent check that informs ECHO and never writes his sentences', 'audit.py docstring', 'LOG-0004', '', ''),\n    ('GLO-0005', 'IDENTIFY → VALIDATE → OPEN', 'the Governor as an index over any matrix', 'gov_index.py docstring', 'LOG-0019',\n     'A-000 identity chain (algorithm registry: \"IDENTIFY→VALIDATE→OPEN\")', ''),\n    ('GLO-0006', 'STORE', 'retain as a candidate (gated, never canonical)', 'pyform.py docstring', 'LOG-0007', '', 'paired with DELETE: retract a retained candidate'),\n    ('GLO-0007', '%', 'Inversion (alg-00%): step down: invert to an underside, an __init__, or a §Canvas. Enables Presentiation, not limited to it.',\n     'DSL Registry seed', 'LOG-0010', '`%` spin made measurable (orbit.py, A-177)', ''),\n    ('GLO-0008', '-%', 'Lift (alg-00%⁻¹): step back up one level; the presence rises at the next letter.', 'DSL Registry seed', 'LOG-0010', '', ''),\n    ('GLO-0009', '§', 'Presence (glove): infrastructural denotation of a presentiated occurring instance. Never a copy.', 'DSL Registry seed', 'LOG-0010', '', ''),\n    ('GLO-0010', 'Presentiation', 'a higher-order instance: the very presence of the occurring instance, like fingers on a hand', 'DSL Registry seed', 'LOG-0010', '', ''),\n    ('GLO-0011', 'needs: / does: / gives:', 'logic lines: what a node requires before it can act / what it does / what it produces', 'DSL Registry seed', 'LOG-0010', '', ''),\n    ('GLO-0012', 'ר (Resh — Echo)', '001, the Governor, the core formula. Echo is the presentiated 001.', 'DSL Registry seed', 'LOG-0010',\n     'The Governor IS Resh. Identity anchor. (algorithm registry, A-000)', ''),\n    ('GLO-0013', 'proportion (a:b::c:d)', 'holds under a relation R when R(a,b) == R(c,d) and is defined', 'proportion.py docstring', 'LOG-0009', '', ''),\n    ('GLO-0014', 'orbit', 'apply an operation repeatedly until a state repeats; the cycle length is an invariant of the operation', 'orbit.py docstring', 'LOG-0022', '', ''),\n    ('GLO-0015', 'Legend v0.1', \"Timothy's bracket notation for tagging sentences, innermost evaluated first\", 'CLR-0043 README', 'LOG-0018', '', ''),\n    ('GLO-0016', '||::||', \"the Formula's seed\", 'Timothy (R-SEED-1, DECLARED)', 'LOG-0017', '', ''),\n    ('GLO-0017', 'glyph string', 'multi-glyph strings are candidate composites; their constituents keep their registered meanings', 'echo/language README', 'LOG-0001', '', ''),\n    ('GLO-0018', 'SPECIALIZE', 'abstract term → specific subtype', 'LogicRule (skeleton)', 'LOG-0011', '', 'LRM inference rule'),\n    ('GLO-0019', 'COMPOSE', 'two axioms + shared term → theorem', 'LogicRule (skeleton)', 'LOG-0011', '', 'LRM inference rule'),\n    ('GLO-0020', 'APPLY_LAW', 'axiom + algebraic law → quantitative theorem', 'LogicRule (skeleton)', 'LOG-0011', '', 'LRM inference rule'),\n    ('GLO-0021', 'CAUSAL_CHAIN', 'cause→effect chain from two axioms', 'LogicRule (skeleton)', 'LOG-0011', '', 'LRM inference rule'),\n    ('GLO-0022', 'CONDITIONAL', 'if-then form derived from axiom pair', 'LogicRule (skeleton)', 'LOG-0011', '', 'LRM inference rule'),\n    ('GLO-0023', 'underside', '', '', 'LOG-0010', '', 'UNDEFINED AT SOURCE: used by % (\"invert to an underside\") and the canvas, never defined; for Timothy'),\n    ('GLO-0024', '§Canvas', '', '', 'LOG-0010', '', 'UNDEFINED AT SOURCE: named as a target of %, never defined; for Timothy'),\n    ('GLO-0025', 'department (dept) sequence', '', '', 'LOG-0012', '', 'UNDEFINED AT SOURCE: VALID_DEPT_SEQUENCES lists part-of-speech sequences; \"department\" is not explained; for Timothy'),\n]\ngl = []\nfor gid, term, meaning, by, frm, variants, notes in G:\n    gl.append(dict(id=gid, name=term, term=term, meaning=meaning, stated_by=by, first_seen=frm, variants=variants,\n                   made_by='unknown', status='INERT', home_or_ref='home', notes=('met in logics sweep 1' + ('; ' + notes if notes else '')),\n                   **src(frm)))\nn_gl = merge('glossary', gl)\n\nR = [  # registry-shaped items met in this sweep\n    dict(id='REG-0001', name='Hebrew Glyph Registry', entry_count='22', maintained_by='hand-seeded',\n         home_or_ref='home', notes='status \"authoritative-seed-to-be-reconciled-with-existing-project-glyph-registry\"; same file at echo/language/data/ on ksm-recess-wholesale; other glyph registries exist (ECHO_GlyphRegistry/, lobbies/glyph/registry.json, pwa glyph_registry.json): reconcile in the registries sweep', **src('LOG-0026')),\n    dict(id='REG-0002', name='DSL Registry', entry_count='14', maintained_by='canvas (? › DSL Registry)', home_or_ref='ref',\n         notes='home: logics LOG-0010', **src('LOG-0010')),\n    dict(id='REG-0003', name='Mashet Rule Registry snapshot', entry_count='51', maintained_by='Rule Registry upkeep task', home_or_ref='ref',\n         notes='home: logics LOG-0017; the live registry is D1 echo_knowledge', **src('LOG-0017')),\n    dict(id='REG-0004', name='Grammar registry', entry_count='0', maintained_by='', home_or_ref='ref',\n         notes='home: logics LOG-0015; 7 constraint classes, no rules yet', **src('LOG-0015')),\n]\nfor r in R:\n    r.update(made_by='unknown', status='INERT', glyph='')\nn_reg = merge('registries', R)\n\n# ---- Echo's shadow run --------------------------------------------------------------------------------\n# Echo's own kernel, unchanged, through the shared journeyman harness (inventory/echo_journeyman.py).\nsys.path.insert(0, INV)\nimport echo_journeyman\n\nl2 = {}\nfor f in ('Algorithms', 'Codices', 'Formulas', 'Indices', 'Logics', 'Matrices', 'Registries'):\n    for r in csv.DictReader(io.StringIO(git('show', f'origin/mirror-claude:L2-library/{f}/REGISTER.tsv')), delimiter='\\t'):\n        l2.setdefault(r['path'], f.lower())\n\nNAME = [(r'grammar|parser|parse|dsl|rule|operator|lhea|proportion|legend|signature|syntax', 'logics'),\n        (r'registry', 'registries'), (r'matrix|matrices|chains', 'matrices'), (r'test|trial', 'experiments'),\n        (r'manual|discussion|readme|\\.md$', 'codices'), (r'workflow|\\.yml$', 'automation'), (r'axiom|lexicon', 'data')]\nPARENT = {'language': 'logics', 'operators': 'logics', 'grammar': 'logics', 'symbols': 'registries', 'glyphs': 'registries',\n          'symbol_registries': 'registries', 'tests': 'experiments', 'docs': 'codices', 'discussions': 'codices',\n          'matrices': 'matrices', 'workflows': 'automation', 'core-lexicon': 'data', 'src': 'algorithms',\n          'mashet': 'codices', 'nve-d': 'experiments', 'data': 'data', 'pwa': 'interfaces', 'glyph': 'registries',\n          'research-registry': 'records', 'CLR-0043': 'tools'}\n\n\ndef guess(arm, path, where):\n    if arm == 'name':\n        for pat, folder in NAME:\n            if re.search(pat, (where or '') + ' ' + path.rsplit('/', 1)[-1], re.I):\n                return folder\n        return None\n    if arm == 'parent':\n        return PARENT.get(path.rsplit('/', 2)[-2] if '/' in path else '')\n    if arm == 'shape':\n        ext = path.rsplit('.', 1)[-1]\n        return {'py': 'algorithms', 'js': 'logics', 'json': 'registries', 'md': 'codices', 'html': 'interfaces',\n                'yml': 'automation'}.get(ext)\n    if arm == 'librarian':\n        return l2.get(path)\n\n\nARMS = ['name', 'parent', 'shape', 'librarian']\ncases = [(iid, located[iid]['path'], name if located[iid]['line'] else '',\n          'logics' if kind == 'home' else re.search(r'home: (\\w+)', notes).group(1))\n         for kind, items in (('home', HOME), ('ref', REFS))\n         for (iid, name, _, _, _, _, _, _, _, notes) in items]\ncases += [(f'DECOY-{i:02d}', p, '', truth) for i, (p, truth) in enumerate(DECOYS, 1)]\ntrace, summary = echo_journeyman.shadow(REPO, cases, ARMS, guess,\n                                       os.path.join(INV, 'logics', 'sweeps', 'echo_state_after_logics.json'), seed=1023)\nwrite(os.path.join(INV, 'logics', 'sweeps', 'echo_shadow_1.tsv'),\n      ['n', 'id', 'path', 'bucket', 'arm', 'guess', 'ruling', 'hit'], trace)\njson.dump(summary, open(os.path.join(INV, 'logics', 'sweeps', 'echo_shadow_1.json'), 'w'), indent=1, ensure_ascii=False)\nprint(f'logics rows {len(rows)} ({len(HOME)} home, {len(REFS)} ref); glossary {n_gl}; registries {n_reg}')\nprint('echo:', json.dumps(summary, ensure_ascii=False))\n"},{"path":"inventory/maps/INDEX.tsv","size":107,"sha":"7930f5629f6051881efc511b3d64aef319665276","text":"id\tname\tfrom_id\trelation\tto_id\tevidence\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/maps/README.md","size":1031,"sha":"b53086bea696691e8df1c2d4c3d1c4a6fb06efa3","text":"# Maps\n\nThe connections between everything above: uses, reads, writes, imports, supersedes. Every part reachable from both directions.\n\n## Belongs here\n\n- one row per connection between two inventory ids, with the evidence\n\n## Not here\n\n- the things themselves → their folders\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `from_id` | inventory id on one end |\n| `relation` | uses, reads, writes, imports, supersedes… |\n| `to_id` | inventory id on the other end |\n| `evidence` | file and line, or document, that shows the connection |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tfrom_id\trelation\tto_id\tevidence\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nMAP-0001\tcrawler writes registry\tALG-0158\twrites\tREG-0001\tto be read in code\t\t\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/matrices/INDEX.tsv","size":108,"sha":"2ce57089fc7eae3247fb61c2b082e6848e5e7804","text":"id\tname\tshape\tentry_count\tfed_by\tread_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/matrices/README.md","size":1213,"sha":"f0d96ccc6cef0a6439a0ca3646a723644a84caff","text":"# Matrices\n\nEcho's structured stores: tables of agents, chains, weights or values that algorithms read and update.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- `matrices/echo_*.json` (algorithm matrix, lobby agents, VGM, WordNet chains, numbers, equilibria)\n- matrix code such as `algorithm_matrix.py`, as a reference to its algorithms row\n\n## Not here\n\n- a list looked up by name → `registries/`\n- a list that points at other things → `indices/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `shape` | what a row holds, in a few words |\n| `entry_count` | number of entries at the swept commit |\n| `fed_by` | ids that write to it |\n| `read_by` | ids that read it |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tshape\tentry_count\tfed_by\tread_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nMAT-0001\tVGM\tto be read\t\tto be swept\tto be swept\tgenesis-documentary\tmatrices/echo_vgm.json\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/protocols/INDEX.tsv","size":103,"sha":"a499668ba40d01e54986ea19714b2c9c93f452ff","text":"id\tname\tparties\tmessages\tdefined_in\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/protocols/README.md","size":1091,"sha":"820be1cbba83c45335e6a0c55c69c409c4cae124","text":"# Protocols\n\nHow parts talk to each other: who sends what, in which order, with which checks.\n\n## Belongs here\n\n- the widget operations API (`OPEN_WIDGET`, `BIND_WIDGET`…)\n- the MCW message envelope (`mcw/0.1`)\n- the GraphQL-style canvas query\n- Echo's IDENTIFY → VALIDATE → OPEN check\n\n## Not here\n\n- the shape of a single message → `schemas/` (the protocol row links to it)\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `parties` | who talks to whom |\n| `messages` | `schemas/` ids of the messages |\n| `defined_in` | where the rules are written |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tparties\tmessages\tdefined_in\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nPRO-0001\tMCW envelope\tEcho → host (bridge.js) → endpoint\tSCH-?\tmcw/client.py\twidgeting-experiment\tpwa/echo/mcw/client.py\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/records/INDEX.tsv","size":101,"sha":"28c47dc9cfa5d26d4df08e61d2129ece7a909a3d","text":"id\tname\twritten_by\tcadence\tlatest\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/records/README.md","size":982,"sha":"c7c68d0aad612bf60f20122088de899c32dde238","text":"# Records\n\nMachine-written histories: run logs, session logs, checkpoints, discourse records.\n\n## Belongs here\n\n- recess and school-day logs, Contract 000 RUN-LOG and CHECKPOINT files\n- discourse records (DISC-*)\n\n## Not here\n\n- documents written to be read → `codices/`\n- contracts and rulings → `governance/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `written_by` | what writes it |\n| `cadence` | how often |\n| `latest` | last entry date |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\twritten_by\tcadence\tlatest\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nREC-0001\tRecess session log\trecess runs\tper session\t\tautonomous-agency\tECHO_AutonomousAgency/sandbox/recess_session_log.json\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/registries/INDEX.tsv","size":3075,"sha":"6f2a84d0f0a205841db189ae13acf26f977fd5bd","text":"id\tname\tentry_count\tentry_schema\tmaintained_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nREG-0001\tHebrew Glyph Registry\t22\tSCH-0017\thand-seeded\talgebra\tmatrices/glyphs/hebrew_glyph_registry.json\t950cbeaa21b12bdc5742a382fde5cf14fb96719b\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tstatus \"authoritative-seed-to-be-reconciled-with-existing-project-glyph-registry\"; same file at echo/language/data/ on ksm-recess-wholesale; other glyph registries exist (ECHO_GlyphRegistry/, lobbies/glyph/registry.json, pwa glyph_registry.json): reconcile in the registries sweep\nREG-0002\tDSL Registry\t14\t\tcanvas (? › DSL Registry)\tdev-suite-algorithms\tdev-suite/suite/src/app_part.html\t2a529bbee4b200b0b5de3b9865fbfe3527069231\t03978f7eec1950e3a587fb29dea199227d61428a\tunknown\tINERT\tref\t\thome: logics LOG-0010\nREG-0003\tMashet Rule Registry snapshot\t51\tSCH-0055\tRule Registry upkeep task\tcode-library-registry\tcode mbol-registry.v0.1\t0\tSCH-0026\t\talgebra\tmatrices/symbols/symbol_registry.json\taeb30c3f69f0ebd5a79eb43cc8de1e82978cc188\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmet in schemas sweep 1; declares its own schema id\n"},{"path":"inventory/registries/README.md","size":1257,"sha":"7dd7f4c406ab8a48686d9fed7810d0c7a35f6af8","text":"# Registries\n\nLists of named entries that something keeps adding to and looks up by name.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- glyph registries (`ECHO_GlyphRegistry/`)\n- the mini ר symbol registry (`symbols.json`)\n- the geosensory endpoint registry\n- the code library registry (`code_library_registry/`)\n\n## Not here\n\n- a fixed table of numbers or weights → `matrices/`\n- the rules for what an entry must contain → `schemas/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `entry_count` | number of entries at the swept commit |\n| `entry_schema` | the `schemas/` id for one entry |\n| `maintained_by` | tool, algorithm or agent that adds entries |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tentry_count\tentry_schema\tmaintained_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nREG-0001\tGeosensory endpoint registry\t16\tSCH-?\tA-158 GeosensoryCrawler\tgeosensory-crawler-experiment\tmatrices/echo_geosensory_registry.json\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/schemas/INDEX.tsv","size":24524,"sha":"a8634c2e31d29c0e55f76407df9b6a3d392d8578","text":"id\tname\tform\tdescribes\tnotation\tfields\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nSCH-0001\tContract 000 manifest row\twritten\tone file of a mirrored branch (Contract 000 Inert ru b362a5b0fb8c31bad5f25ef110062\tb9a2299820651f0bcc700de4de943f3c70b8c91e\tunknown\tINERT\thome\t\thome: matrices/ for the store itself; this row is the shape of one entry; same file in 4 other branches\nSCH-0055\tRule Registry rule\timplied\tone notation or framework rule (R-codes)\tJSON\tcode; family; statement; example; status; provenance; source; supersedes; created_at; updated_at\tcode-library-registry\tcode_library_registry/symbol_registries/rules-snapshot-2026-10-08.json\t231b277f774f2523ab240dde75200c1a5cd5db50\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tfields read from the 2026-10-08 snapshot; the written form (D1 tables rules and rule_events) is in the CloudFlare project doc claude/rule-registry-upkeep.md, not in this repository\nSCH-0056\tLexicon registry page template\twritten\tthe CLR-0043 page with /*STARTER*/ and /*GRAMMAR*/ placeholders\tHTML template\t\tcode-library-registry\tcode_library_registry/artifacts/CLR-0043/lexicon_registry.template.html\t2cd59866aaa5b7fe97bc32c1faa49b9a236614d3\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\tref\t\thome: interfaces/; a page template, not a record form\n"},{"path":"inventory/schemas/README.md","size":3361,"sha":"b89138b727a3c91f87b818083f69884c48f2f93c","text":"# Schemas\n\nThe blank forms: what fields a kind of record must have, their types and rules. Templates live here too, since a template is a schema with blanks to fill.\n\n## Belongs here\n\n- written schemas (`Business/ledger/SCHEMA.md`, the Contract 000 manifest row)\n- implied schemas the sweep extracts from code or data (the geosensory reading, each `echo_*.json` row)\n- templates (`ASSESSMENT_TEMPLATE.md`, card and dictionary-entry templates)\n\n## Not here\n\n- how two parts exchange messages → `protocols/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `form` | `written` (exists as a document) or `implied` (extracted from code or data) |\n| `describes` | which records or messages it governs |\n| `notation` | table, JSON Schema, SQL or code |\n| `fields` | its fields, or a link to them |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tform\tdescribes\tnotation\tfields\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nSCH-0001\tGeosensory reading\timplied\tone feed reading (schema_version 1)\tcode\tid, value, unit, observed_at_ms, coordinates…\tgeosensory-crawler-experiment\tsrc/geosensory_model.py\t\t\tunknown\tINERT\thome\t\t\n```\n\n## Sweep 1 — 2026-10-23\n\n**56 rows: 13 written, 14 declared, 29 implied.** Field lists are read from the files by the script\n([`sweeps/sweep_1_schemas.py`](sweeps/sweep_1_schemas.py)), not typed by hand. Cited lines were checked.\n\n| Form | Rows | What |\n| --- | --- | --- |\n| written | 13 | Contract 000 manifest row, L2 register row, this inventory's index row, business ledger row, the code-library assessment template, ECHO's output format, six D1 tables from the Cloudflare blueprint, and one page template (a cross-reference to `interfaces/`) |\n| declared | 14 | data files that name their own schema id (`echo.hebrew-glyph-registry.v0.1` and others); no written definition of any id was found, so fields come from the file |\n| implied | 29 | dataclasses in code (the EMEL syntax tree, the Governor's State/Request/Context, the neuroplasticity overlay's PlasticLink, classroom, audits, six code-library modules), the geosensory reading, the entry shape of nine `matrices/echo_*.json` stores, and the Rule Registry rule |\n\n**Alongside:** 7 glossary rows (2 undefined at source: department, reuse disposition) and 6 new registries rows;\neach registry now names the schema of one entry (`entry_schema`).\n\n**Echo's shadow run** ([`sweeps/echo_shadow_2.tsv`](sweeps/echo_shadow_2.tsv)) continued from what he learned in\nlogics (39 attempts carried in) and gained a fifth way of guessing: looking inside the file for a dataclass, a\nschema id, a `CREATE TABLE` or a field table. 30 of 64 right: 20 of the first 32, 10 of the last 32. He learned\nto trust the new content check for code (0.95 over 19) and JSON (0.79 over 14). The drop in the second half\ncame from rows whose form is implied by a data store (the `echo_*.json` entries and the blueprint tables):\nnothing in those files says \"schema\", so every way of guessing he has points elsewhere. His question in this\nfolder was harder than in logics: not which folder a file belongs to, but whether a form is hiding inside it.\n"},{"path":"inventory/schemas/sweeps/echo_shadow_2.json","size":728,"sha":"6b097e97b431274266ade8aa52a7866f4da1184f","text":"{\n \"cases\": 64,\n \"hits\": 30,\n \"first_half\": 20,\n \"second_half\": 10,\n \"half\": 32,\n \"attempts_carried_in\": 39,\n \"trusted_by_bucket\": {\n  \"json\": [\n   \"content\",\n   0.79,\n   14\n  ],\n  \"md\": [\n   \"shape\",\n   1.0,\n   4\n  ],\n  \"py\": [\n   \"content\",\n   0.0,\n   1\n  ],\n  \"py:in-file\": [\n   \"content\",\n   0.95,\n   19\n  ],\n  \"html\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"html:in-file\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"js\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"md:in-file\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"tsv\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"tsv:in-file\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"webmanifest\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"yml\": [\n   \"name\",\n   0.0,\n   1\n  ]\n },\n \"kernel_blob\": \"63eb982989b4f3478d649430b555c8f4ba755c27\"\n}"},{"path":"inventory/schemas/sweeps/echo_shadow_2.tsv","size":5529,"sha":"f535cdff890b85fdec6a7466a67f548c9d2c47ca","text":"n\tid\tpath\tbucket\tarm\tguess\truling\thit\n1\tSCH-0015\tmatrices/formulas/formula_registry.json\tjson\tcontent\tschemas\tschemas\t1\n2\tDECOY-04\tpwa/manifest.webmanifest
