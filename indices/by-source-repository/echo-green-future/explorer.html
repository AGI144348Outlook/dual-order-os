<style>
/* Layout: one drill-down column like a phone file browser; breadcrumb trail on top, list or file below. */
:root {
  --bg: #eef2f0; --panel: #ffffff; --ink: #16201c; --muted: #5a6964; --line: #d3dcd8;
  --accent: #0e6b66; --accent-soft: #d8ecea; --weak: #9a5b00; --weak-soft: #f6ead6;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1412; --panel: #151d1a; --ink: #e2eae7; --muted: #92a39d; --line: #283431;
  --accent: #52c3ba; --accent-soft: #15302c; --weak: #e0a24c; --weak-soft: #33270f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1412; --panel: #151d1a; --ink: #e2eae7; --muted: #92a39d; --line: #283431;
  --accent: #52c3ba; --accent-soft: #15302c; --weak: #e0a24c; --weak-soft: #33270f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px;
  display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line) }
h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.snap { font: 12px/1.4 var(--mono); color: var(--muted) }
.snap a { color: var(--accent) }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; width: fit-content }
.tabs button { font: 500 14px var(--sans); color: var(--muted); background: none; border: 0; border-radius: 7px; padding: 6px 14px; cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink) }
.crumbs { display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center; font: 13px var(--mono); min-width: 0 }
.crumbs button { font: inherit; color: var(--accent); background: none; border: 0; padding: 2px 3px; cursor: pointer; border-radius: 4px; overflow-wrap: anywhere; text-align: left }
.crumbs .here { color: var(--ink); padding: 2px 3px; overflow-wrap: anywhere }
.crumbs .sep { color: var(--muted) }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.filter { width: 100%; font: 14px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px }
.list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
.group { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 14px 14px 6px; background: var(--bg) }
.item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; color: var(--ink); font: 15px var(--sans); cursor: pointer }
.list > .item:first-child, .group + .item { border-top: 0 }
.item:hover { background: var(--accent-soft) }
.item .ic { font: 500 13px var(--mono); color: var(--accent); text-align: center }
.item .nm { min-width: 0; overflow-wrap: anywhere }
.item .nm small { display: block; font: 12px var(--mono); color: var(--muted); margin-top: 2px }
.item .meta { font: 12px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.pill { display: inline-block; font: 500 11px var(--sans); padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 1px }
.pill.weak { background: var(--weak-soft); color: var(--weak) }

.doc { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 22px; min-width: 0 }
.doc h1, .doc h2, .doc h3 { line-height: 1.25; text-wrap: balance }
.doc h1 { font-size: 22px } .doc h2 { font-size: 17px; margin-top: 26px } .doc h3 { font-size: 15px }
.doc p, .doc li { max-width: 68ch }
.doc a { color: var(--accent) }
.doc code { font: 13px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px }
.doc pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto }
.doc pre code { background: none; padding: 0; font-size: 12px; line-height: 1.55 }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; margin: 10px 0 }
table { border-collapse: collapse; font-size: 13px; width: 100% }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 600; background: var(--bg) }

.rows { display: flex; flex-direction: column; gap: 8px }
.row { display: flex; flex-direction: column; gap: 3px; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 11px 13px; cursor: pointer; color: var(--ink); font: 14px var(--sans) }
.row:hover { border-color: var(--accent) }
.row .k { font: 500 12px var(--mono); color: var(--accent) }
.row .t { font-weight: 600; overflow-wrap: anywhere }
.row .s { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere }
.fields { display: grid; grid-template-columns: minmax(96px, max-content) minmax(0, 1fr); gap: 8px 14px; margin: 0 }
.fields dt { font: 12px var(--mono); color: var(--muted) }
.fields dd { margin: 0; overflow-wrap: anywhere; font-size: 14px }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px }
.btn { font: 500 14px var(--sans); color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 7px 12px; text-decoration: none; background: none; cursor: pointer }
.note { font-size: 13px; color: var(--muted) }
.count { font: 12px var(--mono); color: var(--muted) }
.query { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px }
@media (max-width: 640px) { .query { grid-template-columns: 1fr } header.top { position: static } }
.query .q, .query .src { display: flex; gap: 6px; min-width: 0 }
.query input[type=search], .query input[type=url] { flex: 1; min-width: 0; font: 14px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px }
.query .btn { white-space: nowrap; padding: 7px 10px }
.btn.solid { background: var(--accent); color: var(--panel); border-color: var(--accent) }
.btn:disabled { opacity: .55; cursor: default }
.srcnote { font-size: 12px; color: var(--muted); grid-column: 1 / -1; min-height: 1em }
.srcnote b { color: var(--ink); font-weight: 600 }
textarea.paste { width: 100%; min-height: 160px; font: 13px var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px }
.hit { font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin: 2px 0 0 }
.hit mark { background: var(--accent-soft); color: var(--ink); border-radius: 3px; padding: 0 2px }
.why { font-size: 13px; color: var(--ink); margin-top: 2px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

· [`protocols/`](protocols/) · [`interfaces/`](interfaces/) |\n| What Echo learns from and leaves behind | [`experiments/`](experiments/) · [`data/`](data/) · [`records/`](records/) · [`archives/`](archives/) |\n| Running it | [`automation/`](automation/) · [`deployments/`](deployments/) · [`dependencies/`](dependencies/) |\n| Holding it together | [`governance/`](governance/) · [`glossary/`](glossary/) · [`maps/`](maps/) · [`decisions/`](decisions/) |\n\n## Shared columns\n\nEvery `INDEX.tsv` starts with `id` and `name`, then the folder's own columns, then these:\n\n| Column | Meaning |\n| --- | --- |\n| `id` | stable inventory id: a folder prefix and a number (`ALG-0158`, `SCH-0001`). Never reused. |\n| `name` | the item's own name, as its source writes it |\n| `branch` | branch where this copy was found |\n| `path` | path inside that branch |\n| `blob_sha` | git's fingerprint of the file, so any copy can be checked against the source |\n| `commit` | the branch commit the sweep read |\n| `made_by` | `timothy`, `claude`, `chatgpt`, `codex`, `gemini` or `unknown`, as the commit or file states |\n| `status` | `INERT`, `KEPT`, `PRUNED` or `DEFERRED` (Contract 000's terms; every row starts `INERT`) |\n| `home_or_ref` | `home` for the item's one primary folder, `ref` for a cross-reference from another folder |\n| `glyph` | one of the 27 glyph matrices (א … ת, ך ם ן ף ץ) if the item belongs to one; blank otherwise |\n| `notes` | anything that does not fit a column |\n\n## Rules\n\n1. **Inert.** Rows point at files by branch, path and fingerprint. Nothing is copied into the inventory.\n2. **One home, cross-references elsewhere.** An item that is two kinds at once (an algorithm that is also a matrix) gets one `home` row and a `ref` row in each other folder. This rule is provisional until ruled on in [`decisions/`](decisions/).\n3. **Nothing is Canon.** When two versions differ, both get rows. Neither wins until Timothy rules.\n4. **Status changes carry reasons.** Moving a ed in 6 files; absent from the algorithm registries\nALG-0192\t(unnamed in registries)\tA-192\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-0193\t(unnamed in registries)\tA-193\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-0194\t(unnamed in registries)\tA-194\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-0195\t(unnamed in registries)\tA-195\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-0196\t(unnamed in registries)\tA-196\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-0200\t(unnamed in registries)\tA-200\tnot found in code\t\t\t\tresearch-discourse-registry\tresearch-registry/discourse/DISC-002-invariant-self-identification.md\t\t7b55bf7c5f912c4a00629f079f80c96c779bafe2\tunknown\tINERT\thome\t\tmentioned in 1 files; absent from the algorithm registries\nALG-0235\t(unnamed in registries)\tA-235\tnot found in code\t\t\t\talgebra\tartifacts/echo_matrix_browser.jsx\t\tad8efcea9a5a5d6aa38497360bb7cc7b58a6aef0\tunknown\tINERT\thome\t\tmentioned in 6 files; absent from the algorithm registries\nALG-MOD-0001\tverified resource gate\tMOD-0001-verified-resource-gate\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0001-verified-resource-gate/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0002\tbounded composition search\tMOD-0002-bounded-composition-search\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0002-bounded-composition-search/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0003\tstructured workspace registry\tMOD-0003-structured-workspace-registry\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0003-structured-workspace-registry/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0004\tsafe relative entry writer\tMOD-0004-safe-relative-entry-writer\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0004-safe-relative-entry-writer/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0005\tbounded affinity admission\tMOD-0005-bounded-affinity-admission\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0005-bounded-affinity-admission/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0006\tstatic python flow outline\tMOD-0006-static-python-flow-outline\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0006-static-python-flow-outline/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0007\tactor scoped command admission\tMOD-0007-actor-scoped-command-admission\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0007-actor-scoped-command-admission/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\nALG-MOD-0008\tMOD 0008\tMOD-0008\tmodule folder\t\t\t\tcode-library-registry\tcode_library_registry/modules/MOD-0008/\t\tf4d85130577c2def1419f320ef0e16852c4f1fa9\tunknown\tINERT\thome\t\tcode library module; contents to be read\n"},{"path":"inventory/algorithms/README.md","size":4204,"sha":"54aac690fcd6ef051443e353033f4ce33da50696","text":"# Algorithms\n\nEvery algorithm, one row each, down to the class or function that implements it. Most of Echo's A-numbered algorithms live as classes inside the single skeleton file, so rows point inside files.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- A-000 onward, from `echo_governor_skeleton.py` and its copies\n- experimental algorithms (EXP-*, Recess, KSM, neuroplasticity)\n- algorithms described in documents but not yet implemented (status noted)\n\n## Not here\n\n- runnable utilities with no learning or governing role → `tools/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `algorithm_id` | A-number or EXP-id as the source names it |\n| `location` | the class or function inside the file |\n| `state_in_code` | the status the code itself gives (ACTIVE, DORMANT…) |\n| `introduced_in` | branch where it first appears |\n| `depends_on` | ids it calls or needs |\n\n## Example row\n\nThe row for A-158 as the first sweep filled it (blob and commit shortened here):\n\n```tsv\nid\tname\talgorithm_id\tlocation\tstate_in_code\tintroduced_in\tdepends_on\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nALG-0158\tGeosensoryCrawlerUpgrade\tA-158\tGeosensoryCrawler (line 8846)\tACTIVE\t\t\tgenesis-documentary\tsrc/echo_governor_skeleton.py\t63eb9829…\t…\tunknown\tINERT\thome\tמ;ע\ttype ACQUISITION; located by A-number comment naming it; same file in 18 other branches; …\n```\n\n## Sweep 1 — 2026-10-22\n\n**118 rows: 110 A-numbers plus 8 code-library modules (`ALG-MOD-*`).** Every located row was checked against\nits source lines; all 69 confirmed.\n\n| Result | Rows | Meaning |\n| --- | --- | --- |\n| Located, strong evidence | 57 | a comment naming the class, a section header right above the definition, a defining docstring (`A-NNN:`), or a name match in a file that also carries the A-number |\n| Located, weak (`WEAK` in notes) | 12 | only a passing mention inside a class or function, or a name match with no A-number nearby. The implementation is not pinned down |\n| In Echo's registry, not found in code | 10 | A-145-AUG, A-160 to A-164, A-169 to A-172: proposed or described, no implementation found yet |\n| Mentioned only, in no registry | 31 | ids that appear in dashboards, docs or logs (A-175 to A-196 and A-235 mostly in `artifacts/echo_matrix_browser.jsx`) |\n| Code-library modules | 8 | `code_library_registry/modules/MOD-0001…0008`; contents still to be read |\n\n**Sources.** Echo's own registries (`echo_algorithm_matrix.json` on `autonomous-agency`, 65 entries, overriding\nthe 54 on `genesis-documentary`; then `genesis_structure.json`), every code file on all 42 branches, and\n`glyph_algorithm_index.json` for glyph ties (24 rows).\n\n**How a row is located,** strongest evidence first:\n\n1. A comment naming the class: `# A-125: GeneralityMatrix`.\n2. A section header within three lines above a definition: `# -- A-101: UCB1 bandit` above `def bandit_select`. When the first definition under a header belongs to another A-number (its own docstring says so), the next definition is used.\n3. A class or function with the registry's name, in a file that also carries the A-number.\n4. A docstring that defines the A-number (`A-158:`), not one that only refers to it (`(A-101)`).\n5. Weak: a name match alone, or a mention inside a class or function.\n\nA-000 and A-000-RESH were set by hand. The Governor is the whole system rather than one class, and its identity check runs through `ReshIdentity`.\n\n**Known overlaps.** Some classes implement more than one A-number. `GeosensoryCrawler` holds A-155 and its upgrade A-158. `AlgorithmMatrix.hub_words` is A-109, a helper for A-107. Where a branch holds the same file, the row points at the first branch in this order: `genesis-documentary`, `autonomous-agency`, `algebra`, `echo-recess-experiment`, `resh-lattice-agency`, then the rest alphabetically. Notes say how many other branches hold the same file.\n\n**Left for later sweeps:** `introduced_in` and `made_by` need full commit history; `depends_on` belongs in `maps/`.\n"},{"path":"inventory/algorithms/sweeps/sweep_1_algorithms.py","size":11637,"sha":"f02d00fc6074762154782fbdc994d53ad29e666d","text":"\"\"\"Algorithms sweep: one row per algorithm, pointing at where it is implemented.\n\nSources (read-only):\n  1. Echo's own registries: echo_algorithm_matrix.json (newest on autonomous-agency, older on\n     genesis-documentary) and dev-suite genesis_structure.json  -> name, type, status, description\n  2. Every .py / .js / .jsx / .mjs / .cjs file on every branch -> class/def definitions and A-number markers\n  3. glyph_algorithm_index.json -> glyph ties\n  4. code_library_registry/modules/MOD-* -> non-numbered algorithm modules\n\"\"\"\nimport csv\nimport json\nimport re\nimport subprocess\nimport sys\nfrom collections import defaultdict\n\nREPO, OUT = sys.argv[1], sys.argv[2]\nINV = json.load(open(sys.argv[3]))['summary']\n\n\ndef git(*a):\n    return subprocess.run(['git', '-C', REPO, *a], capture_output=True, check=True).stdout.decode('utf-8', 'replace')\n\n\ndef show(branch, path):\n    try:\n        return git('show', f'origin/{branch}:{path}')\n    except subprocess.CalledProcessError:\n        return None\n\n\n# 1. registries -------------------------------------------------------------\nreg = {}\nfor branch, path in [('genesis-documentary', 'matrices/echo_algorithm_matrix.json'),\n                     ('autonomous-agency', 'ECHO_AutonomousAgency/matrices/echo_algorithm_matrix.json')]:\n    for k, v in json.loads(show(branch, path)).items():\n        reg[k] = dict(v, registry=f'{branch}:{path}')          # newer file overwrites older\nstruct = json.loads(show('dev-suite-algorithms', 'dev-suite/suite/src/data/genesis_structure.json'))['algs']\nfor a in struct:\n    reg.setdefault(a['id'], dict(name=a['name'], status=a['status'], description=a['desc'], type='',\n                                 registry='dev-suite-algorithms:dev-suite/suite/src/data/genesis_structure.json'))\n\n# 3. glyph ties ---------------------------------------------------------------\nglyph_of = defaultdict(list)\ngi = json.loads(show('autonomous-agency', 'ECHO_AutonomousAgency/matrices/glyph_algorithm_index.json'))\nfor block in gi['blocks'].values():\n    for t in block['algorithm_ties']:\n        glyph_of[t['algorithm_id']].append(block['glyph'])\n\n# 2. code definitions across all branches, deduped by blob -------------------------------\nbranches = sorted(INV)\npref = ['genesis-documentary', 'autonomous-agency', 'algebra', 'echo-recess-experiment', 'resh-lattice-agency']\norder = pref + [b for b in branches if b not in pref]\nCODE = re.compile(r'\\.(py|js|jsx|mjs|cjs)$')\nblob_seen = {}\ndefs = defaultdict(list)       # class/def name -> [(branch, path, line, blob)]\nmarks = defaultdict(list)      # A-id -> [(branch, path, line, enclosing_class, blob, kind)]\nAID = re.compile(r'\\bA-(\\d{3})(-[A-Z]+)?\\b')\nfor b in order:\n    for line in git('ls-tree', '-r', f'origin/{b}').splitlines():\n        meta, path = line.split('\\t', 1)\n        sha = meta.split()[2]\n        if not CODE.search(path) or path.startswith('Datasets/') or 'pyodide' in path:\n            continue\n        if sha in blob_seen:\n            blob_seen[sha]['branches'].add(b)\n            continue\n        blob_seen[sha] = dict(branch=b, path=path, branches={b})\n        text = git('cat-file', 'blob', sha)\n        cls, meth, last_def_line, last_def_name = None, None, -99, None\n        pending = []   # (line, aid) header comments waiting for the next definition\n        DEFN = re.compile(r'A-\\d{3}(?:-[A-Z]+)?\\s*[:—]')     # \"A-158:\" defines; \"(A-101)\" only refers\n        for n, src in enumerate(text.splitlines(), 1):\n            new_def = None\n            m = re.match(r'\\s*(?:export\\s+)?class\\s+([A-Za-z_]\\w*)', src)\n            if m:\n                cls, meth = m.group(1), None\n                new_def = cls\n            m2 = re.match(r'(\\s*)(?:async\\s+)?(?:def|function)\\s+([A-Za-z_]\\w*)', src)\n            if m2:\n                if not m2.group(1):\n                    cls, meth = None, m2.group(2)\n                    new_def = m2.group(2)\n                else:\n                    meth = m2.group(2)\n                    new_def = f'{cls}.{meth}' if cls else meth\n            if new_def:\n                defs[new_def].append((b, path, n, sha))\n                last_def_line, last_def_name = n, new_def\n                for (pn, paid) in pending:\n                    if n - pn <= 3:\n                        marks[paid].append(dict(b=b, path=path, n=n, sha=sha, header=new_def,\n                                                named=None, near=None, inside=None))\n                pending = []\n            is_comment = src.lstrip().startswith(('#', '//'))\n            for am in AID.finditer(src):\n                aid = 'A-' + am.group(1) + (am.group(2) or '')\n                cm = re.match(r'\\s*#\\s*A-\\d{3}(?:-[A-Z]+)?\\s*[:—-]\\s*([A-Za-z_]\\w*)', src)\n                if is_comment and DEFN.search(src):\n                    pending.append((n, aid))\n                near = last_def_name if (0 < n - last_def_line <= 4 and DEFN.search(src)) else None\n                marks[aid].append(dict(b=b, path=path, n=n, sha=sha, named=cm.group(1) if cm else None,\n                                       near=near, header=None,\n                                       inside=(f'{cls}.{meth}' if cls and meth else (cls or meth))))\n\n# mentioned anywhere (docs, json, jsx) for ids that are only mentioned\nmentions = defaultdict(set)\nfor line in open(sys.argv[4], encoding='utf-8', errors='replace'):\n    try:\n        b, rest = line.split('\\t', 1)\n    except ValueError:\n        continue\n    path = rest.split(':', 1)[0]\n    for am in AID.finditer(rest):\n        mentions['A-' + am.group(1) + (am.group(2) or '')].add((b, path))\n\n\ndef norm(s):\n    return re.sub(r'[^a-z0-9]', '', s.lower())\n\n\ndef locate(aid, name):\n    \"\"\"Best evidence first: name match, then a naming comment, then a docstring right under a\n    definition; a mere mention inside a class or method is returned as weak.\"\"\"\n    rank = {b: i for i, b in enumerate(order)}\n    tiers = []\n    if aid in ('A-000', 'A-000-RESH'):\n        h = sorted(defs['ReshIdentity'], key=lambda x: (rank[x[0]], x[1]))[0]\n        where = 'ReshIdentity' if aid == 'A-000-RESH' else 'ReshIdentity (the Governor is the whole system; its identity check runs here)'\n        return h[0], h[1], h[2], where, h[3], 'manual check'\n    tiers.append(([(h, mk['named']) for mk in marks.get(aid, []) if mk['named'] in defs\n                   for h in defs[mk['named']] if h[3] == mk['sha']], 'A-number comment naming it'))\n    tiers.append(([((mk['b'], mk['path'], mk['n'], mk['sha']), mk['header']) for mk in marks.get(aid, []) if mk.get('header')],\n                  'header comment above the definition'))\n    hits = []\n    if name:\n        key = norm(name.split('—')[0].split('(')[0].split('+')[0])\n        hits = [(h, dn) for dn, hs in defs.items() if norm(dn.split('.')[-1]) == key for h in hs]\n    marked_files = {mk['sha'] for mk in marks.get(aid, [])}\n    tiers.append(([(h, dn) for h, dn in hits if h[3] in marked_files], 'name match, A-number in the same file'))\n    tiers.append(([(h, mk['near']) for mk in marks.get(aid, []) if mk['near']\n                   for h in defs[mk['near']] if h[3] == mk['sha'] and h[2] <= mk['n']], 'docstring under the definition'))\n    tiers.append(([(h, dn) for h, dn in hits], 'WEAK: name match only'))\n    tiers.append(([((mk['b'], mk['path'], mk['n'], mk['sha']), f\"mentioned inside {mk['inside']}\") for mk in marks.get(aid, []) if mk['inside']],\n                  'WEAK: only mentioned inside'))\n    for cands, how in tiers:\n        if cands:\n            cands.sort(key=lambda c: (rank[c[0][0]], c[0][1], c[0][2]))\n            (b, path, n, sha), where = cands[0]\n            if how.startswith('header'):\n                # first definition under a section header may belong to another A-number\n                # (its own docstring says so); then take the next definition in the file\n                owners = {other for other, mks in marks.items() if other != aid\n                          for mk in mks if mk.get('near') == where and mk['sha'] == sha}\n                mine = any(mk.get('near') == where and mk['sha'] == sha for mk in marks.get(aid, []))\n                if owners and not mine:\n                    later = sorted((h[2], dn) for dn, hs in defs.items() for h in hs if h[3] == sha and h[2] > n)\n                    if later:\n                        n, where = later[0]\n                        how = 'header comment above the section (first definition belongs to ' + ', '.join(sorted(owners)) + ')'\n            return b, path, n, where, sha, how\n    return None\n\n\nids = set(reg) | set(marks) | set(mentions)\ndef sortkey(a):\n    m = re.match(r'A-(\\d{3})(.*)', a)\n    return (int(m.group(1)), m.group(2)) if m else (9999, a)\n\ncols = open(f'{OUT}/INDEX.tsv').readline().rstrip('\\n').split('\\t')\nrows = []\nfor aid in sorted(ids, key=sortkey):\n    r = reg.get(aid, {})\n    name = r.get('name', '')\n    loc = locate(aid, name)\n    glyphs = glyph_of.get(aid, [])\n    num = re.match(r'A-(\\d{3})(.*)', aid)\n    row = dict(id=f'ALG-{int(num.group(1)):04d}{num.group(2)}', name=name or '(unnamed in registries)',\n               algorithm_id=aid, state_in_code=r.get('status', ''), status='INERT', home_or_ref='home',\n               made_by='unknown', glyph=';'.join(glyphs), depends_on='', introduced_in='')\n    notes = []\n    if r.get('type'):\n        notes.append(f\"type {r['type']}\")\n    if loc:\n        b, path, n, where, sha, how = loc\n        row.update(branch=b, path=path, blob_sha=sha, commit=git('rev-parse', f'origin/{b}').strip(),\n                   location=f'{where} (line {n})')\n        if how.startswith('WEAK'):\n            notes.append('implementation not pinned down')\n        others = len(blob_seen[sha]['branches']) - 1\n        notes.append(f'located by {how}')\n        if others:\n            notes.append(f'same file in {others} other branches')\n    else:\n        where = sorted(mentions.get(aid, set()))\n        if where:\n            row.update(branch=where[0][0], path=where[0][1], commit=git('rev-parse', f'origin/{where[0][0]}').strip())\n        row['location'] = 'not found in code'\n        notes.append(f'mentioned in {len(where)} files' + (', registry only' if r and not where else ''))\n    if not r:\n        notes.append('absent from the algorithm registries')\n    if r.get('description'):\n        notes.append('registry: ' + re.sub(r'\\s+', ' ', r['description'])[:160])\n    row['notes'] = '; '.join(notes)\n    rows.append(row)\n\n# 4. MOD modules ---------------------------------------------------------------\nfor line in git('ls-tree', '-d', '--name-only', 'origin/code-library-registry', 'code_library_registry/modules/').splitlines():\n    mod = line.rsplit('/', 1)[-1]\n    num = re.match(r'MOD-(\\d{4})(?:-(.*))?', mod)\n    rows.append(dict(id=f'ALG-MOD-{num.group(1)}', name=(num.group(2) or mod).replace('-', ' '), algorithm_id=mod,\n                     location='module folder', state_in_code='', branch='code-library-registry', path=line + '/',\n                     commit=git('rev-parse', 'origin/code-library-registry').strip(), status='INERT',\n                     home_or_ref='home', made_by='unknown', notes='code library module; contents to be read'))\n\nwith open(f'{OUT}/INDEX.tsv', 'w', newline='', encoding='utf-8') as f:\n    w = csv.writer(f, delimiter='\\t', lineterminator='\\n')\n    w.writerow(cols)\n    for r in rows:\n        w.writerow([r.get(c, '') for c in cols])\n\nfound = sum(1 for r in rows if r.get('location') not in ('not found in code', 'module folder'))\nprint(len(rows), 'rows;', found, 'located in code;',\n      sum(1 for r in rows if r.get('location') == 'not found in code'), 'not found in code;',\n      sum(1 for r in rows if r['id'].startswith('ALG-MOD')), 'modules')\n"},{"path":"inventory/archives/INDEX.tsv","size":103,"sha":"9836f22ac05b7ae9d44ddee594d852bcd32f590a","text":"id\tname\tmembers\tunpacked_equivalent\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/archives/README.md","size":936,"sha":"86d89eac9fa6b91b217e4c2d1d6397414e86ad93","text":"# Archives\n\nZip bundles, sealed. Their file lists are recorded; they are never extracted or run during the sweep.\n\n## Belongs here\n\n- every `.zip` (18 distinct)\n\n## Not here\n\n- the unpacked equivalent, when it exists as a branch → its own folder, linked here\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `members` | number of files inside |\n| `unpacked_equivalent` | branch or path holding the same content unpacked |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tmembers\tunpacked_equivalent\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nARC-0001\tECHO_Autonomous_Agency_Branch.zip\t14\tautonomous-agency\tmain\tECHO_Autonomous_Agency_Branch.zip\t\t\tunknown\tDEFERRED\thome\t\t\n```\n"},{"path":"inventory/automation/INDEX.tsv","size":19957,"sha":"0286ef12391dcea850e9f3f8a6d9fff67ad4721d","text":  (manual or from a workflow)\tWorker config\t\tchat-archive-pyodide-workbench\twrangler.archive.toml\tf417ca72a4530fea85e11c62ca717a1088d9cc19\t2d129db69d48f66effd7d47732c03cd394f44755\tunknown\tINERT\thome\t\ton 2 branches; binding names only; resource ids not recorded\nAUT-0048\tWrangler: echo-green-future\twrangler deploy (manual or from a workflow)\tWorker src/index.js; bindings ECHO_STATE, ECHO_VGM, ECHO_LRM, ECHO_MATRIX, DB\t\tgenesis-documentary\twrangler.toml\t045483520551c1cfb2c23341583188827dafb6d3\tb9a2299820651f0bcc700de4de943f3c70b8c91e\tunknown\tINERT\thome\t\ton 31 branches; binding names only; resource ids not recorded\n"},{"path":"inventory/automation/README.md","size":3271,"sha":"ba0964e2bbf0ccde9a6557e4caa7771fbef3da47","text":"# Automation\n\nHow things build, test and deploy on their own: workflows and deploy configs.\n\n## Belongs here\n\n- `.github/workflows/*.yml`\n- `wrangler.toml` and deploy configs\n\n## Not here\n\n- what is live as a result → `deployments/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `trigger` | push, schedule, manual… |\n| `does` | what it does, one line |\n| `secret_names` | names of secrets it needs (never values) |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\ttrigger\tdoes\tsecret_names\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nAUT-0001\tEcho classroom lab\tto be read\t\t\tmain\t.github/workflows/echo-classroom-lab.yml\t\t\tunknown\tINERT\thome\t\t\n```\n\n## Sweep 1 — 2026-10-23\n\n**48 rows: 41 GitHub workflows, 2 reference workflows kept outside `.github/workflows` (so not active), and\n5 Wrangler configs.** Script: [`sweeps/sweep_1_automation.py`](sweeps/sweep_1_automation.py). Triggers, run\ncommands, checked-out and pushed branches, and secret names are read from each file; where a path has several\nversions, the preferred branch's copy is read and the count noted.\n\n- **Secret names used** (values never read): `CLOUDFLARE_ACCOUNT_ID`, `CLOUDFLARE_API_TOKEN`, `GITHUB_TOKEN`,\n  `DATAGOV_API_KEY` (dataset crawler), `CREATE_ROOM_KEY` and `ROOM_SIGNING_KEY` (Group Canvas reference deploy),\n  and `CLOUDFLARE_API` in the Cloudflare bridge (AUT-0005), which every other deploy names `CLOUDFLARE_API_TOKEN`:\n  check that this secret exists under that name.\n- **Workflows that write back** to their branch: recess runs, the dataset crawler, unpack jobs and the IVS test\n  (`pushes to` in notes).\n- **Scheduled:** the dataset crawler (hourly at :23) and ECHO Recess (`recess.yml`, hourly).\n- Wrangler rows keep binding names only, never resource ids.\n\n**Alongside:** 6 glossary terms met in workflow names (IVS, KSM, Lobby, NVE-D, Recess, Swadesh), meanings to be\nfilled from their sources; no new registries.\n\n**Echo's shadow run 3** ([`sweeps/echo_shadow_3.tsv`](sweeps/echo_shadow_3.tsv); pre-test entry\n[dual-order-os#12](https://github.com/AGI144348Outlook/dual-order-os/issues/12)). 21 of 58 right: 6 of the first\n29, 15 of the last 29. Below the 60% the pre-test entry named as disconfirming. The cause is in Echo's own\nlearning loop, not the files: for items 11 to 35 his bandit kept choosing the one way of guessing he had never\nused on `.yml` files (the earlier librarian's register, which lists no workflows), and every guess failed. His\nA-113 anchor check then saw each 5-item generation at 0% against a 44% baseline, judged it a collapse and\ndiscarded it, five times running. So the failures never reached the record his bandit reads, the arm still looked\nuntried, and A-101's \"try the untried first\" rule picked it again. One mixed generation (item 40) broke the loop,\nand from there he was 15 of 18. In short: a protection meant to keep a bad run from poisoning his learning also\nkept him from learning that a way of guessing is bad. This is the neuroplasticity-gate question in a small form.\n"},{"path":"inventory/automation/sweeps/echo_shadow_3.json","size":2383,"sha":"eec4ce0579f14e3e01d57461cd6862e9bd9be2df","text":"{\n \"cases\": 58,\n \"hits\": 21,\n \"first_half\": 6,\n \"second_half\": 15,\n \"half\": 29,\n \"attempts_carried_in\": 98,\n \"trusted_by_bucket\": {\n  \"json\": [\n   \"content\",\n   0.65,\n   17\n  ],\n  \"md\": [\n   \"shape\",\n   1.0,\n   4\n  ],\n  \"py\": [\n   \"parent\",\n   0.5,\n   2\n  ],\n  \"py:in-file\": [\n   \"content\",\n   0.95,\n   19\n  ],\n  \"yml\": [\n   \"content\",\n   1.0,\n   7\n  ],\n  \"html\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"html:in-file\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"js\": [\n   \"name\",\n   1.0,\n   1\n  ],\n  \"md:in-file\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"toml\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"tsv\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"tsv:in-file\": [\n   \"name\",\n   0.0,\n   1\n  ],\n  \"webmanifest\": [\n   \"parent\",\n   1.0,\n   1\n  ]\n },\n \"kernel_blob\": \"63eb982989b4f3478d649430b555c8f4ba755c27\",\n \"checkpoints\": [\n  {\n   \"after\": 5,\n   \"decision\": \"ANCHORED\",\n   \"current_rate\": 0.6,\n   \"baseline_rate\": 0.42857142857142855,\n   \"attempts\": 5\n  },\n  {\n   \"after\": 10,\n   \"decision\": \"ANCHORED\",\n   \"current_rate\": 0.6,\n   \"baseline_rate\": 0.4368932038834951,\n   \"attempts\": 5\n  },\n  {\n   \"after\": 15,\n   \"decision\": \"DISCARDED\",\n   \"current_rate\": 0.0,\n   \"baseline_rate\": 0.4444444444444444,\n   \"attempts\": 5\n  },\n  {\n   \"after\": 20,\n   \"decision\": \"DISCARDED\",\n   \"current_rate\": 0.0,\n   \"baseline_rate\": 0.4444444444444444,\n   \"attempts\": 5\n  },\n  {\n   \"after\": 25,\n   \"decision\": \"DISCARDED\",\n   \"current_rate\": 0.0,\n   \"baseline_rate\": 0.4444444444444444,\n   \"attempts\": 5\n  },\n  {\n   \"after\": 30,\n   \"decision\": \"DISCARDED\",\n \n\"name\",\n\"py:in-file\",\n0,\n3\n],\n[\n\"name\",\n\"toml\",\n0,\n1\n],\n[\n\"name\",\n\"tsv\",\n0,\n1\n],\n[\n\"name\",\n\"tsv:in-file\",\n0,\n1\n],\n[\n\"name\",\n\"webmanifest\",\n0,\n1\n],\n[\n\"name\",\n\"yml\",\n3,\n4\n],\n[\n\"parent\",\n\"json\",\n0,\n4\n],\n[\n\"parent\",\n\"md\",\n1,\n3\n],\n[\n\"parent\",\n\"py\",\n1,\n2\n],\n[\n\"parent\",\n\"py:in-file\",\n3,\n7\n],\n[\n\"parent\",\n\"toml\",\n0,\n1\n],\n[\n\"parent\",\n\"webmanifest\",\n1,\n1\n],\n[\n\"parent\",\n\"yml\",\n2,\n3\n],\n[\n\"shape\",\n\"json\",\n0,\n5\n],\n[\n\"shape\",\n\"md\",\n4,\n4\n],\n[\n\"shape\",\n\"py\",\n0,\n1\n],\n[\n\"shape\",\n\"py:in-file\",\n1,\n5\n],\n[\n\"shape\",\n\"yml\",\n6,\n6\n]\n]\n}"},{"path":"inventory/automation/sweeps/sweep_1_automation.py","size":14051,"sha":"239c49feb130a006b9b65ac8bd359dec61372ab4","text":"\"\"\"Automation sweep 1: how things build, test and deploy on their own.\n\nOne row per path: every GitHub workflow (`.github/workflows/*.yml`), every Wrangler config (`*.toml` that\nconfigures a Worker) and other deploy configs. Where a path has several versions across branches, the row\nreads the preferred branch's copy and notes the others.\n\nRead from each file: trigger (push branches/paths, schedule cron, manual), what its steps run, the branch it\nchecks out and pushes to, and the NAMES of secrets it uses. Secret values are never read; Wrangler binding\nnames are kept, resource ids are not. Read-only over the repository.\n\nAlso: glossary and registries rows met on the way, and Echo's shadow run 3 (pre-test entry:\nAGI144348Outlook/dual-order-os#12), continuing from his state after the schemas sweep.\n\nUsage: python3 sweep_1_automation.py <repo>\n\"\"\"\nimport csv\nimport io\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\n\nimport yaml\n\nREPO = sys.argv[1]\nINV = os.path.join(REPO, 'inventory')\nsys.path.insert(0, INV)\nimport echo_journeyman  # noqa: E402\n\nORDER = ['genesis-documentary', 'autonomous-agency', 'algebra', 'echo-recess-experiment', 'resh-lattice-agency',\n         'ksm-recess-wholesale', 'code-library-registry', 'mirror-claude']\n\n\ndef git(*a):\n    return subprocess.run(['git', '-C', REPO, *a], capture_output=True, check=True).stdout.decode('utf-8', 'replace')\n\n\nMAN = list(csv.DictReader(open(os.path.join(INV, 'MANIFEST-by-branch.tsv'), encoding='utf-8'), delimiter='\\t'))\nrank = {b: i for i, b in enumerate(ORDER)}\nSKIP = re.compile(r'node_modules|pyodide')\nWF = re.compile(r'(^|/)\\.github/workflows/[^/]+\\.ya?ml$')\nWR = re.compile(r'(^|/)wrangler[^/]*\\.toml$')\nOTHER = re.compile(r'(^|/)(reference-[^/]*\\.ya?ml)$')     # deploy and bot configs kept as references in Workshop/\n\npaths = {}\nfor r in MAN:\n    p = r['path']\n    if SKIP.search(p) or not (WF.search(p) or WR.search(p) or OTHER.search(p)):\n        continue\n    paths.setdefault(p, []).append(r)\n\n\ndef pick(held):\n    return sorted(held, key=lambda r: (rank.get(r['branch'], 99), r['branch']))[0]\n\n\ndef secrets_in(text):\n    return sorted(set(re.findall(r'secrets\\.([A-Za-z_][A-Za-z0-9_]*)', text)) - {'GITHUB_TOKEN'}) + \\\n        (['GITHUB_TOKEN'] if 'secrets.GITHUB_TOKEN' in text else [])\n\n\ndef workflow_facts(text):\n    d = yaml.safe_load(text) or {}\n    on = d.get('on', d.get(True, {}))            # YAML reads a bare `on:` key as True\n    if isinstance(on, str):\n        on = {on: None}\n    elif isinstance(on, list):\n        on = {k: None for k in on}\n    trig = []\n    for k, v in (on or {}).items():\n        if k == 'push' and isinstance(v, dict):\n            s = 'push'\n            if v.get('branches'):\n                s += ' to ' + ', '.join(map(str, v['branches']))\n            if v.get('paths'):\n                s += ' (paths: ' + ', '.join(map(str, v['paths']))[:80] + ')'\n            trig.append(s)\n        elif k == 'schedule':\n            trig.append('schedule ' + ', '.join(str(c.get('cron')) for c in (v or [])))\n        elif k == 'workflow_dispatch':\n            trig.append('manual')\n        else:\n            trig.append(str(k))\n    runs, uses, checkout, pushes = [], [], set(), set()\n    for job in (d.get('jobs') or {}).values():\n        for st in (job or {}).get('steps') or []:\n            if not isinstance(st, dict):\n                continue\n            if st.get('uses'):\n                uses.append(st['uses'].split('@')[0])\n                if 'checkout' in st['uses'] and isinstance(st.get('with'), dict) and st['with'].get('ref'):\n                    checkout.add(str(st['with']['ref']))\n            for line in str(st.get('run') or '').splitlines():\n                line = line.strip()\n                m = re.match(r'(python3?|node|npx|bash|sh|wrangler|npm run|pytest)\\s+(-m\\s+)?(\\S+)', line)\n                if m and m.group(3) in ('-', '-c', '<<'):\n                    runs.append(m.group(1) + ' (inline script)')\n                elif m:\n                    runs.append((m.group(1) + ' ' + (m.group(2) or '') + m.group(3)).replace('  ', ' '))\n                pm = re.search(r'git push\\s+\\S+\\s+(?:HEAD:)?(\\S+)', line)\n                if pm:\n                    pushes.add(pm.group(1))\n    return dict(name=str(d.get('name') or ''), trigger='; '.join(trig), runs=list(dict.fromkeys(runs)),\n                uses=list(dict.fromkeys(uses)), checkout=sorted(checkout), pushes=sorted(pushes))\n\n\ndef wrangler_facts(text):\n    name = (re.search(r'^name\\s*=\\s*\"([^\"]+)\"', text, re.M) or [None, ''])[1]\n    main = (re.search(r'^main\\s*=\\s*\"([^\"]+)\"', text, re.M) or [None, ''])[1]\n    pages = (re.search(r'^pages_build_output_dir\\s*=\\s*\"([^\"]+)\"', text, re.M) or [None, ''])[1]\n    binds = re.findall(r'^\\s*binding\\s*=\\s*\"([^\"]+)\"', text, re.M)\n    kinds = re.findall(r'^\\[\\[(\\w+)\\]\\]', text, re.M)\n    crons = re.findall(r'crons\\s*=\\s*\\[([^\\]]*)\\]', text)\n    return dict(name=name, main=main or pages, binds=binds, kinds=sorted(set(kinds)), crons=crons)\n\n\ncols = open(os.path.join(INV, 'automation', 'INDEX.tsv'), encoding='utf-8').readline().rstrip('\\n').split('\\t')\nrows, located, terms = [], {}, {}\nfor n, p in enumerate(sorted(paths, key=lambda p: (not WF.search(p), p)), 1):\n    held = paths[p]\n    r = pick(held)\n    text = git('cat-file', 'blob', r['blob_sha'])\n    versions = len({h['blob_sha'] for h in held})\n    branches = sorted({h['branch'] for h in held})\n    notes = [f'on {len(branches)} branches' + (f', {versions} versions' if versions > 1 else '')]\n    if WF.search(p) or OTHER.search(p):\n        try:\n            f = workflow_facts(text)\n        except yaml.YAMLError as e:\n            f = dict(name='', trigger='(does not parse as YAML)', runs=[], uses=[], checkout=[], pushes=[])\n            notes.append('YAML error: ' + type(e).__name__)\n        acts = [u for u in f['uses'] if 'checkout' not in u and 'setup-' not in u]\n        does = '; '.join(f['runs'][:4]) or ('uses ' + ', '.join(acts)[:120] if acts else 'shell steps only (git, unzip, file moves)')\n        if f['checkout']:\n            notes.append('checks out ' + ', '.join(f['checkout']))\n        if f['pushes']:\n            notes.append('pushes to ' + ', '.join(f['pushes']))\n        name = f['name'] or p.rsplit('/', 1)[-1]\n        trigger = f['trigger']\n        kind = 'reference workflow (not active: outside .github/workflows)' if OTHER.search(p) else ''\n        if kind:\n            notes.append(kind)\n    else:\n        f = wrangler_facts(text)\n        name = 'Wrangler: ' + (f['name'] or p)\n        trigger = 'wrangler deploy (manual or from a workflow)' + ('; cron ' + '; '.join(f['crons']) if f['crons'] else '')\n        does = ('Worker ' + f['main'] if f['main'] else 'Worker config') + (('; bindings ' + ', '.join(f['binds'])) if f['binds'] else '')\n        notes.append('binding names only; resource ids not recorded')\n    sec = secrets_in(text)\n    iid = f'AUT-{n:04d}'\n    located[iid] = dict(branch=r['branch'], path=p, blob_sha=r['blob_sha'], text=text)\n    rows.append(dict(id=iid, name=name, trigger=trigger, does=does, secret_names=', '.join(sec),\n                     branch=r['branch'], path=p, blob_sha=r['blob_sha'], commit=git('rev-parse', f'origin/{r[\"branch\"]}').strip(),\n                     made_by='unknown', status='INERT', home_or_ref='home', glyph='', notes='; '.join(notes)))\n    for t in re.findall(r'\\b(Recess|KSM|NVE-D|DFE|Shakti|Swadesh|EVE|IVS|Hourglass|Presentiation|LHEA|Mashet|Contract 000|Lobby)\\b', name + ' ' + p.replace('-', ' ')):\n        terms.setdefault(t, iid)\n\n\ndef write(path, header, rws):\n    with open(path, 'w', newline='', encoding='utf-8') as fh:\n        w = csv.writer(fh, delimiter='\\t', lineterminator='\\n', quoting=csv.QUOTE_NONE, quotechar=None, escapechar='\\\\')\n        w.writerow(header)\n        for row in rws:\n            w.writerow([str(row.get(c, '')).replace('\\t', ' ').replace('\\n', ' ') for c in header])\n\n\nwrite(os.path.join(INV, 'automation', 'INDEX.tsv'), cols, rows)\n\n\ndef merge(folder, new):\n    pth = os.path.join(INV, folder, 'INDEX.tsv')\n    header = open(pth, encoding='utf-8').readline().rstrip('\\n').split('\\t')\n    old = {r['id']: r for r in csv.DictReader(open(pth, encoding='utf-8'), delimiter='\\t', quoting=csv.QUOTE_NONE)}\n    for r in new:\n        old[r['id']] = {**old.get(r['id'], {}), **r}\n    write(pth, header, [old[k] for k in sorted(old)])\n    return len(old)\n\n\n# glossary: project terms met in workflow names and paths; meanings only where a source states one\nglo = {r['term']: r for r in csv.DictReader(open(os.path.join(INV, 'glossary', 'INDEX.tsv'), encoding='utf-8'), delimiter='\\t', quoting=csv.QUOTE_NONE)}\nnxt = max(int(r['id'][4:]) for r in glo.values()) + 1\nnew_terms = []\nfor t, iid in sorted(terms.items()):\n    if t in glo:\n        continue\n    loc = located[iid]\n    new_terms.append(dict(id=f'GLO-{nxt:04d}', name=t, term=t, meaning='', stated_by='', first_seen=iid, variants='',\n                          branch=loc['branch'], path=loc['path'], blob_sha=loc['blob_sha'], commit=git('rev-parse', f'origin/{loc[\"branch\"]}').strip(),\n                          made_by='unknown', status='INERT', home_or_ref='home',\n                          notes='met in automation sweep 1 (a workflow name or path); meaning not stated in the workflow; to be filled from its source document or by Timothy'))\n    nxt += 1\nn_gl = merge('glossary', new_terms)\n\n# registries: none are maintained by workflows directly; record the crawler's registry writer if present\nn_reg = len(list(csv.DictReader(open(os.path.join(INV, 'registries', 'INDEX.tsv'), encoding='utf-8'), delimiter='\\t', quoting=csv.QUOTE_NONE)))\n\n# ---- Echo's shadow run 3 -------------------------------------------------------------------------------\nl2 = {}\nfor fo in ('Algorithms', 'Codices', 'Formulas', 'Indices', 'Logics', 'Matrices', 'Registries'):\n    for r in csv.DictReader(io.StringIO(git('show', f'origin/mirror-claude:L2-library/{fo}/REGISTER.tsv')), delimiter='\\t'):\n        l2.setdefault(r['path'], fo.lower())\nNAME = [(r'schema|template|format|spec|model', 'schemas'),\n        (r'grammar|parser|parse|dsl|rule|operator|lhea|proportion|legend|signature|syntax', 'logics'),\n        (r'registry', 'registries'), (r'matrix|matrices|chains', 'matrices'), (r'test|trial', 'experiments'),\n        (r'manual|discussion|readme|\\.md$', 'codices'), (r'workflow|\\.yml$', 'automation'), (r'axiom|lexicon', 'data')]\nPARENT = {'language': 'logics', 'operators': 'logics', 'grammar': 'logics', 'symbols': 'registries', 'glyphs': 'registries',\n          'symbol_registries': 'registries', 'tests': 'experiments', 'docs': 'codices', 'discussions': 'codices',\n          'matrices': 'matrices', 'workflows': 'automation', 'core-lexicon': 'data', 'src': 'algorithms', 'ledger': 'schemas',\n          'mashet': 'codices', 'nve-d': 'experiments', 'data': 'data', 'pwa': 'interfaces', 'glyph': 'registries',\n          'infrastructure': 'deployments', 'generalized': 'algorithms', 'L1-main': 'indices', 'inventory': 'governance'}\n\n\ndef content(text):\n    if re.search(r'^on:\\s*$|^jobs:\\s*$', text, re.M):\n        return 'automation'\n    if re.search(r'^\\[\\[(kv_namespaces|d1_databases|r2_buckets)\\]\\]|^compatibility_date', text, re.M):\n        return 'deployments'\n    if re.search(r'@dataclass|\"schema\"\\s*:|CREATE TABLE|^\\|\\s*Field\\s*\\|', text, re.M):\n        return 'schemas'\n    if re.search(r'^class \\w+|^def \\w+', text, re.M):\n        return 'algorithms'\n    if text.lstrip().startswith(('{', '[')):\n        return 'registries'\n    return 'codices'\n\n\ntexts = {}\n\n\ndef guess(arm, path, where):\n    if arm == 'name':\n        for pat, folder in NAME:\n            if re.search(pat, (where or '') + ' ' + path.rsplit('/', 1)[-1], re.I):\n                return folder\n        return None\n    if arm == 'parent':\n        return PARENT.get(path.rsplit('/', 2)[-2] if '/' in path else '')\n    if arm == 'shape':\n        return {'py': 'algorithms', 'js': 'logics', 'json': 'registries', 'md': 'codices', 'html': 'interfaces',\n                'yml': 'automation', 'tsv': 'indices'}.get(path.rsplit('.', 1)[-1])\n    if arm == 'librarian':\n        return l2.get(path)\n    if arm == 'content':\n        return content(texts.get(path, ''))\n\n\nARMS = ['name', 'parent', 'shape', 'librarian', 'content']\ncases = []\nfor r in rows:\n    texts[r['path']] = located[r['id']]['text']\n    cases.append((r['id'], r['path'], '', 'automation'))\nDECOYS = [('Datasets/crawler/crawl.py', 'tools'), ('docs/ECHO_OUTPUT_FORMAT.md', 'codices'), ('src/echo_classroom.py', 'algorithms'),\n          ('infrastructure/cloudflare_blueprint.json', 'deployments'), ('pwa/manifest.webmanifest', 'interfaces'),\n          ('matrices/echo_vgm.json', 'matrices'), ('tests/test_dsl_canvas_008.py', 'experiments'),\n          ('ECHO_AutonomousAgency/sandbox/recess_session_log.json', 'records'), ('research-registry/contracts/CONTRACT-000.md', 'governance'),\n          ('core-lexicon/math_axioms.json', 'data')]\nfor i, (pth, truth) in enumerate(DECOYS, 1):\n    held = [r for r in MAN if r['path'] == pth]\n    if not held:\n        continue\n    texts[pth] = git('cat-file', 'blob', pick(held)['blob_sha'])\n    cases.append((f'DECOY-{i:02d}', pth, '', truth))\ntrace, summary = echo_journeyman.shadow(REPO, cases, ARMS, guess,\n                                       os.path.join(INV, 'automation', 'sweeps', 'echo_state_after_automation.json'), seed=1025,\n                                       prior_state=os.path.join(INV, 'schemas', 'sweeps', 'echo_state_after_schemas.json'))\nwrite(os.path.join(INV, 'automation', 'sweeps', 'echo_shadow_3.tsv'), ['n', 'id', 'path', 'bucket', 'arm', 'guess', 'ruling', 'hit', 'checkpoint'], trace)\njson.dump(summary, open(os.path.join(INV, 'automation', 'sweeps', 'echo_shadow_3.json'), 'w'), indent=1, ensure_ascii=False)\nwf = sum(1 for r in rows if WF.search(r['path']))\nprint(f'automation rows {len(rows)} ({wf} workflows); glossary {n_gl}; registries {n_reg}')\nprint('secrets named:', sorted({s for r in rows for s in r['secret_names'].split(', ') if s}))\nprint('echo:', json.dumps(summary, ensure_ascii=False))\n"},{"path":"inventory/codices/INDEX.tsv","size":91,"sha":"c3ad611afb3ab08fb7ffbc6ab8c868ecf1f14940","text":"id\tname\tkind\tdate\tabout\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/codices/README.md","size":1130,"sha":"e9124cd607868789a511e1b5f0018f408378d6e0","text":"# Codices\n\nWritten documents meant to be read: specs, RFCs, READMEs, handoffs, reports and research notes.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- `docs/`, handoffs, RFCs, progress reports\n- branch READMEs (each version is its own row)\n- research notes, including the ByteByteGo library\n\n## Not here\n\n- legally binding or governing text → `governance/`\n- machine-written logs → `records/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `kind` | the sort of thing it is |\n| `date` | date stated in the item |\n| `about` | one line on its subject |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkind\tdate\tabout\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nCOD-0001\tGeosensory visual-model seam\tdesign note\t\tfeed-to-visual conversion rules\tgeosensory-crawler-experiment\tGEOSENSORY_VISUAL_MODELS.md\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/data/INDEX.tsv","size":108,"sha":"a07d0e68c02093272fd28e842dc9fdb429f11ba3","text":"id\tname\tkind\tsize_bytes\tlicence\tlocation\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/data/README.md","size":1070,"sha":"86f4296e94361ade66fd637eb56b2c0ca7efb17d","text":"# Data\n\nBodies of content Echo reads: lexicons, corpora, dictionaries, datasets.\n\n## Belongs here\n\n- the Mashet corpus, core lexicon, the 5,000-word dictionary\n- third-party datasets (one row per dataset; the files move to R2, the row keeps the pointer)\n\n## Not here\n\n- structured stores Echo updates → `matrices/`\n- conversation exports: listed only, never copied\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `kind` | the sort of thing it is |\n| `size_bytes` | size |\n| `licence` | its licence as stated |\n| `location` | where the files are kept: `git` or `R2` |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkind\tsize_bytes\tlicence\tlocation\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nDAT-0001\tMashet parsed corpus\tcorpus\t\t\tgit\tgenesis-documentary\tcorpus/mashet_parsed.json\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/decisions/INDEX.tsv","size":1492,"sha":"e445690196af6f21160a6182343928d45aaeee1f","text":"id\tname\tquestion\toptions\tneeded_for\truling\tdate\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nDEC-0001\tCurrent README\tWhich README.md is current for the integrated Echo?\t6 versions across branches (inventory.json drift)\trepo identity\t\t\t\t\t\t\tclaude\tOPEN\thome\t\t\nDEC-0002\tCurrent LICENSE\tWhich LICENSE text is current?\t3 versions: in 25 / 6 / 1 branches\tdual licence\t\t\t\t\t\t\tclaude\tOPEN\thome\t\t\nDEC-0003\tPWA shell\tWhich pwa/ shell (index.html, app.js, manifest, sw.js) is current?\tpwa/index.html has 4 versions; pwa/js/app.js 3\tinterfaces/\t\t\t\t\t\t\tclaude\tOPEN\thome\t\t\nDEC-0004\tConversation exports\tPlain delete commit, or full history purge under a one-time [TJ] exception?\tdelete commit (stays in history) / history purge (rewrites chatgpt-conversation-archive)\tpublic repo hygiene\t\t2026-10-22\tchatgpt-conversation-archive\tconversations-000/001/002/005.json; shared_conversations.json\t\t\tclaude\tOPEN\thome\t\tTimothy 2026-10-22: delete, already in R2. Method not yet chosen.\nDEC-0005\tThird-party datasets to R2\tMove Datasets/ files to R2 with pointers, together with a crawler change?\tmove with crawler change / leave in git\tdata/; repo size\t\t2026-10-22\tcode-library-registry\tDatasets/\t\t\tclaude\tOPEN\thome\t\tTimothy 2026-10-22: R2 if that is where they belong. The crawler must write to R2 too.\nDEC-0006\tTwo-kind items\tOne home plus cross-references, or full listing in every folder?\tone home + refs (provisional default) / full listing everywhere\tevery folder\t\t\t\t\t\t\tclaude\tOPEN\thome\t\t\n"},{"path":"inventory/decisions/README.md","size":1279,"sha":"f5c3c1715a86043b154fdcd5fe4af9d19c27abc7","text":"# Decisions\n\nEvery choice waiting on Timothy, and his ruling once made. Open questions are parked here so the sweep keeps moving.\n\nIn this folder `status` is `OPEN` or `RULED`, not the Contract 000 terms the other folders use.\n\n## Belongs here\n\n- which of the 6 READMEs, 3 LICENSEs and the PWA shells is current\n- deletions and moves (conversation exports, datasets to R2)\n- rules for this inventory itself\n\n## Not here\n\n- the governing text a ruling becomes part of → `governance/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `question` | what it asks |\n| `options` | the choices on the table |\n| `needed_for` | what waits on it |\n| `ruling` | Timothy's answer, in his words |\n| `date` | date stated in the item |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tquestion\toptions\tneeded_for\truling\tdate\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nDEC-0001\tCurrent README\tWhich README.md version is current for the integrated Echo?\t6 versions (see inventory.json drift)\trepo identity\t\t\t\t\t\t\tunknown\tOPEN\thome\t\t\n```\n"},{"path":"inventory/dependencies/INDEX.tsv","size":104,"sha":"03f2d193f637405cd476e00e11d2155fb6dd1080","text":"id\tname\tkind\tversion\tlicence\tused_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/dependencies/README.md","size":1006,"sha":"822ea657da33e1edeed9478e761e876c556645b9","text":"# Dependencies\n\nOutside things Echo relies on, with their licences. Needed for the dual licence: knowing what third-party code and data are inside.\n\n## Belongs here\n\n- libraries and runtimes: Pyodide, NLTK/WordNet, SciPy, NetworkX\n- services: Cloudflare, OpenRouter, NOAA/USGS/NASA feeds\n\n## Not here\n\n- Echo's own code → its own folders\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `kind` | the sort of thing it is |\n| `version` | version in use |\n| `licence` | its licence as stated |\n| `used_by` | ids that use it |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkind\tversion\tlicence\tused_by\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nDEP-0001\tPyodide\truntime\t0.26.4 (dev-suite) / 0.29.3 (widgeting)\t\tINT-*\t\t\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/deployments/INDEX.tsv","size":115,"sha":"09320aca0887cf1d96abad353686d75b916eb531","text":"id\tname\tresource\turl\tdeployed_from\tsecret_names\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/deployments/README.md","size":1027,"sha":"d2e48c7f2526b1859e9bccd3fb99c7a23ea05af9","text":"# Deployments\n\nWhat is actually live, where: Workers, D1, KV, R2, Pages, their URLs, and the names of secrets each needs. Never secret values.\n\n## Belongs here\n\n- Cloudflare Workers and Pages apps\n- D1 databases, KV namespaces, R2 buckets\n\n## Not here\n\n- how they get deployed → `automation/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `resource` | Worker, D1, KV, R2, Pages |\n| `url` | where it is live |\n| `deployed_from` | source path or workflow |\n| `secret_names` | names of secrets it needs (never values) |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tresource\turl\tdeployed_from\tsecret_names\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nDPL-0001\tEcho Worker\tCloudflare Worker\tto be confirmed\tsrc/index.js + wrangler.toml\t\t\t\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/echo_journeyman.py","size":3647,"sha":"6cedb2887c87e7c617a33844c94c4f2c5686e3ab","text":"\"\"\"Echo as journeyman: his shadow run during an inventory sweep.\n\nBefore each ruling, Echo guesses which inventory folder an item belongs in. He has several ways of\nguessing (\"arms\"); his own A-101 bandit (AlgorithmMatrix.bandit_select) picks which way to trust for\nthat kind of file, and A-113 (record_outcome, checkpoint_generation) records whether the guess matched\nthe ruling. His learned state is saved after each sweep and loaded by the next, so what he learned in\none folder carries into the next.\n\nEcho's kernel is loaded unchanged from git (the 63eb9829 skeleton). Nothing here edits it.\nThe arms are simple rules written by the sweeps; the score shows which rule he learns to trust,\nnot understanding.\n\"\"\"\nimport importlib.util\nimport json\nimport os\nimport random\nimport subprocess\nimport tempfile\nimport warnings\n\nSKEL_BLOB = '63eb982989b4f3478d649430b555c8f4ba755c27'\n\n\ndef load_echo(repo):\n    src = subprocess.run(['git', '-C', repo, 'cat-file', 'blob', SKEL_BLOB], capture_output=True, check=True).stdout\n    path = os.path.join(tempfile.mkdtemp(), 'echo_governor_skeleton.py')\n    open(path, 'wb').write(src)\n    spec = importlib.util.spec_from_file_location('echo_kernel', path)\n    kernel = importlib.util.module_from_spec(spec)\n    with warnings.catch_warnings():\n        warnings.simplefilter('ignore')\n        spec.loader.exec_module(kernel)\n    return kernel.AlgorithmMatrix()\n\n\ndef shadow(repo, cases, arms, guess, state_path, seed, prior_state=None):\n    \"\"\"cases: [(id, path, where, ruling)]; guess(arm, path, where) -> folder or None.\n    Loads prior_state (a previous sweep's saved state) if given; saves this sweep's state to state_path.\"\"\"\n    echo = load_echo(repo)\n    carried = 0\n    if prior_state and os.path.exists(prior_state):\n        for arm, bucket, s, a in json.load(open(prior_state))['history']:\n            echo.history[(arm, bucket)] = (s, a)\n            carried += a\n    cases = list(cases)\n    random.Random(seed).shuffle(cases)\n    trace, checkpoints = [], []\n    for k, (cid, path, where, truth) in enumerate(cases, 1):\n        bucket = path.rsplit('.', 1)[-1] + (':in-file' if where else '')\n        arm = echo.bandit_select(bucket, arms)\n        g = guess(arm, path, where)\n        ok = g == truth\n        echo.record_outcome(arm, bucket, ok)\n        cp = echo.checkpoint_generation() if k % 5 == 0 else None\n        if cp:\n            checkpoints.append(dict(after=k, **{key: cp.get(key) for key in ('decision', 'current_rate', 'baseline_rate', 'attempts')}))\n        trace.append(dict(n=k, id=cid, path=path, bucket=bucket, arm=arm, guess=g or '(none)', ruling=truth, hit=int(ok),\n                          checkpoint=cp['decision'] if cp else ''))\n    cp = echo.checkpoint_generation()\n    checkpoints.append(dict(after=len(trace), **{key: cp.get(key) for key in ('decision', 'current_rate', 'baseline_rate', 'attempts')}))\n    hist = sorted([arm, bucket, s, a] for (arm, bucket), (s, a) in echo.history.items())\n    json.dump(dict(kernel_blob=SKEL_BLOB, history=hist), open(state_path, 'w'), indent=0)\n    trusted = {}\n    for arm, bucket, s, a in hist:\n        if a and (bucket not in trusted or (s / a, a) > (trusted[bucket][1], trusted[bucket][2])):\n            trusted[bucket] = (arm, round(s / a, 2), a)\n    half = len(trace) // 2\n    return trace, dict(cases=len(trace), hits=sum(t['hit'] for t in trace),\n                       first_half=sum(t['hit'] for t in trace[:half]), second_half=sum(t['hit'] for t in trace[half:]),\n                       half=half, attempts_carried_in=carried, trusted_by_bucket=trusted, kernel_blob=SKEL_BLOB,\n                       checkpoints=checkpoints)\n"},{"path":"inventory/experiments/INDEX.tsv","size":111,"sha":"ba3289507b401e73d6258eee1248646586b5d022","text":"id\tname\tquestion\tcode\tresult\tran_on\toutcome\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/experiments/README.md","size":1068,"sha":"a154ead8536e1ba95484dcbeb3fde3780d95258b","text":"# Experiments\n\nTrials and tests, each linked to the result it produced.\n\n## Belongs here\n\n- `experiments/*.py`, Stress Tests 001 and 002, IVS tests, NVE-D trials\n- test suites (`tests/`, `test_*.py`, `*.cjs`)\n- their result files\n\n## Not here\n\n- the algorithm under test → `algorithms/` (linked by id)\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `question` | what it asks |\n| `code` | the code path |\n| `result` | the result path |\n| `ran_on` | date it ran |\n| `outcome` | what happened, one line |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tquestion\tcode\tresult\tran_on\toutcome\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nEXP-0001\tGlyph comprehension transfer 007\t\t\tresults/glyph_comprehension_transfer_007.json\t\t\talgebra\texperiments/glyph_comprehension_transfer_007.py\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/formulas/INDEX.tsv","size":103,"sha":"8e3ffc1d6645233796e855dd963c8bd393e79150","text":"id\tname\texpression\tvariables\tsource\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/formulas/README.md","size":1013,"sha":"573307f54f7dfb33efa7cb057850e7d520861326","text":"# Formulas\n\nMathematical expressions and criteria, with their variables and sources.\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- formula matrices and `math_formulas.json`\n- criteria such as `F-0001-Echo-Harness-Usability-Criterion.md`\n\n## Not here\n\n- rules that are not numeric → `logics/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `expression` | the formula as written |\n| `variables` | its symbols and units |\n| `source` | where it was stated |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\texpression\tvariables\tsource\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nFOR-0001\tEcho harness usability criterion\t\t\t\tlibrary-shared\tFormulas/F-0001-Echo-Harness-Usability-Criterion.md\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/glossary/INDEX.tsv","size":12759,"sha":"a6e4102b8048db13047efab861ab928d67c80cc6","text":"id\tname\tterm\tmeaning\tstated_by\tfirst_seen\tvariants\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nGLO-0001\tEMEL\tEMEL\tECHO's expression language (working name)\techo/language README and ast.py\tLOG-0001\t\tksm-recess-wholesale\techo/language/parser.py\tc813ff5dc05ebfd38b1994fca199b0c8ad6d3b19\t82810112a959dc094dcf40238419cffca6863670\tunknown\tINERT\thome\t\tmet in logics sweep 1\nGLO-0002\tLHEA\tLHEA\tthe 22 letter operators as primitive transformation types\techo/operators/lhea.py docstring\tLOG-0008\tLatin-Hebrew Execution Architecture (title of the project document)\tksm-recess-wholesale\techo/operators/lhea.py\te505ea628c1b33274c506dc22b6b69bed2523f61\t82810112a959dc094dcf40238419cffca6863670\tunknown\tINERT\thome\t\tmet in logics sweep 1; the code names what LHEA does, not what the letters stand for\nGLO-0003\tgrammar guide\tgrammar guide\tparse ECHO's Eng 7004af98f12d5c2b5c24e34","text":"# Governance\n\nBinding and governing texts: contracts, amendments, licences, the CLA, rulings.\n\n## Belongs here\n\n- CONTRACT-000 and its amendments, SCHEDULE-000\n- LICENSE (each version its own row), CLA.md\n- Timothy's rulings once recorded in `decisions/`\n\n## Not here\n\n- open questions → `decisions/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `kind` | the sort of thing it is |\n| `authority` | who issued it, and whether parts are only proposed |\n| `date` | date stated in the item |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkind\tauthority\tdate\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nGOV-0001\tContract 000 — The Mirroring Children\tcontract\tTimothy (with proposed sections marked)\t\tresearch-discourse-registry\tresearch-registry/contracts/CONTRACT-000.md\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/indices/INDEX.tsv","size":94,"sha":"0d184533b85509ed84ab79650cfc7ca6aca0ff9d","text":"id\tname\tkeyed_by\tpoints_to\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/indices/README.md","size":946,"sha":"26553670a113dcdc83692d896e53732847a57f2f","text":"# Indices\n\nLookups that point at other things: given a key, where is it?\n\nOne of the seven Library sub-libraries named in Contract 000.\n\n## Belongs here\n\n- existing `INDEX.md` files and registers\n- `indices/by-*` folders\n- glyph-keyed indexes\n\n## Not here\n\n- the things being pointed at: they live in their own folders\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `keyed_by` | what you look up by |\n| `points_to` | what the lookup returns |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkeyed_by\tpoints_to\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nIDX-0001\tGlyph docs index\tglyph\tglyph docs\tautonomous-agency\tECHO_AutonomousAgency/docs/glyphs/INDEX.md\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/interfaces/INDEX.tsv","size":94,"sha":"9bbf59967dcc7b179bab6a9f23fdff488230bcad","text":"id\tname\tkind\tentry\truns_on\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/interfaces/README.md","size":1103,"sha":"925eca317ebb7723135d82cc321d48c67606bb4d","text":"# Interfaces\n\nWhat a person or Echo sees and touches: PWAs, the canvas, widgets, the keyboard, notebooks. Icons, images and runtime files used by them are listed here as assets.\n\n## Belongs here\n\n- `pwa/`, the dev-suite canvas, the canvas keyboard and terminal\n- notebook 0.4 and 0.4.1, the Group Canvas companion\n- assets: icons, images, the Pyodide runtime\n\n## Not here\n\n- the code behind a widget that learns or governs → `algorithms/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `kind` | the sort of thing it is |\n| `entry` | how it is started (command or file) |\n| `runs_on` | browser, phone, Worker… |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tkind\tentry\truns_on\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nINT-0001\tWidgeting PWA\tPWA canvas\t\tbrowser (Pyodide)\twidgeting-experiment\tpwa/index.html\t\t\tunknown\tINERT\thome\t\t\n```\n"},{"path":"inventory/inventory.jso
