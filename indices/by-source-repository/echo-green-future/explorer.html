tschemas\tcodices\t0\n44\tSCH-0048\tmatrices/echo_vgm.json\tjson\tshape\tregistries\tschemas\t0\n45\tSCH-0009\tinfrastructure/cloudflare_blueprint.json\tjson\tshape\tregistries\tschemas\t0\n46\tSCH-0050\tmatrices/echo_number_matrix.json\tjson\tcontent\tregistries\tschemas\t0\n47\tDECOY-06\tGEOSENSORY_VISUAL_MODELS.md\tmd\tparent\t(none)\tcodices\t0\n48\tDECOY-05\ttests/test_geosensory_model.py\tpy\tname\tschemas\texperiments\t0\n49\tSCH-0052\tmatrices/echo_formula_matrix.json\tjson\tcontent\tregistries\tschemas\t0\n50\tSCH-0046\tmatrices/echo_algorithm_matrix.json\tjson\tcontent\tregistries\tschemas\t0\n51\tSCH-0047\tmatrices/echo_lobby_agents.json\tjson\tcontent\tregistries\tschemas\t0\n52\tSCH-0024\tnotebook/registry_catalog.json\tjson\tcontent\tschemas\tschemas\t1\n53\tSCH-0033\tsrc/echo_homework_audit.py\tpy:in-file\tcontent\tschemas\tschemas\t1\n54\tSCH-0029\techo_neuroplasticity_overlay.py\tpy:in-file\tcontent\tschemas\tschemas\t1\n55\tSCH-0007\tinfrastructure/cloudflare_blueprint.json\tjson\tcontent\tschemas\tschemas\t1\n56\tSCH-0034\tsrc/echo_gf_wordnet.py\tpy:in-file\tcontent\tschemas\tschemas\t1\n57\tSCH-0056\tcode_library_registry/artifacts/CLR-0043/lexicon_registry.template.html\thtml\tname\tschemas\tinterfaces\t0\n58\tSCH-0051\tmatrices/echo_equilibria.json\tjson\tname\t(none)\tschemas\t0\n59\tSCH-0054\tmatrices/echo_geosensory_registry.json\tjson\tname\tregistries\tschemas\t0\n60\tSCH-0021\tmatrices/symbols/mashet_symbols.json\tjson\tname\t(none)\tschemas\t0\n61\tSCH-0025\tmatrices/substrates/substrate_registry.json\tjson\tlibrarian\tmatrices\tschemas\t0\n62\tSCH-0055\tcode_library_registry/symbol_registries/rules-snapshot-2026-10-08.json\tjson\tlibrarian\tregistries\tschemas\t0\n63\tSCH-0031\tsrc/echo_classroom.py\tpy:in-file\tcontent\tschemas\tschemas\t1\n64\tSCH-0003\tinventory/README.md\tmd:in-file\tname\tcodices\tschemas\t0\n"},{"path":"inventory/schemas/sweeps/echo_state_after_schemas.json","size":886,"sha":"4d3454a8228594f52f0a0730170bf6b23f0c704b","text":"{\n\"kernel_blob\": \"63eb982989b4f3478d649430b555c8f4ba755c27\",\n\"history\": [\n[\n\"content\",\n\"json\",\n11,\n14\n],\n[\n\"content\",\n\"md\",\n0,\n1\n],\n[\n\"content\",\n\"py\",\n0,\n1\n],\n[\n\"content\",\n\"py:in-file\",\n18,\n19\n],\n[\n\"librarian\",\n\"json\",\n1,\n6\n],\n[\n\"librarian\",\n\"md\",\n1,\n3\n],\n[\n\"librarian\",\n\"py\",\n0,\n1\n],\n[\n\"librarian\",\n\"py:in-file\",\n0,\n4\n],\n[\n\"name\",\n\"html\",\n0,\n1\n],\n[\n\"name\",\n\"html:in-file\",\n1,\n1\n],\n[\n\"name\",\n\"js\",\n1,\n1\n],\n[\n\"name\",\n\"json\",\n1,\n7\n],\n[\n\"name\",\n\"md\",\n0,\n2\n],\n[\n\"name\",\n\"md:in-file\",\n0,\n1\n],\n[\n\"name\",\n\"py\",\n0,\n1\n],\n[\n\"name\",\n\"py:in-file\",\n0,\n3\n],\n[\n\"name\",\n\"tsv\",\n0,\n1\n],\n[\n\"name\",\n\"tsv:in-file\",\n0,\n1\n],\n[\n\"name\",\n\"webmanifest\",\n0,\n1\n],\n[\n\"name\",\n\"yml\",\n0,\n1\n],\n[\n\"parent\",\n\"json\",\n0,\n4\n],\n[\n\"parent\",\n\"md\",\n0,\n1\n],\n[\n\"parent\",\n\"py\",\n0,\n1\n],\n[\n\"parent\",\n\"py:in-file\",\n3,\n7\n],\n[\n\"shape\",\n\"json\",\n0,\n5\n],\n[\n\"shape\",\n\"md\",\n4,\n4\n],\n[\n\"shape\",\n\"py\",\n0,\n1\n],\n[\n\"shape\",\n\"py:in-file\",\n1,\n5\n]\n]\n}"},{"path":"inventory/schemas/sweeps/sweep_1_schemas.py","size":24663,"sha":"ff314e8b650b03d5694505ef76bc4c8ed1fa424c","text":"\"\"\"Schemas sweep 1: the blank forms. What fields a kind of record must have.\n\nThree kinds of row (`form` column):\n  written   the schema exists as a document or a column header someone wrote down\n  declared  a data file names its own schema id (\"schema\": \"echo.x.v0.1\"); fields are read from the file\n  implied   no written form; fields are read from the code (dataclasses, returned dicts) or the data\n\nRead-only over the repository. Field lists are extracted by the script, not typed by hand.\nWrites inventory/schemas/INDEX.tsv, merges glossary and registries rows, and runs Echo's shadow\n(continuing from his state after the logics sweep).\n\nUsage: python3 sweep_1_schemas.py <repo>\n\"\"\"\nimport ast\nimport csv\nimport io\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\n\nREPO = sys.argv[1]\nINV = os.path.join(REPO, 'inventory')\nsys.path.insert(0, INV)\nimport echo_journeyman  # noqa: E402\n\nORDER = ['genesis-documentary', 'autonomous-agency', 'algebra', 'echo-recess-experiment', 'resh-lattice-agency',\n         'ksm-recess-wholesale', 'code-library-registry', 'mirror-claude']\n\n\ndef git(*a):\n    return subprocess.run(['git', '-C', REPO, *a], capture_output=True, check=True).stdout.decode('utf-8', 'replace')\n\n\nMAN = list(csv.DictReader(open(os.path.join(INV, 'MANIFEST-by-branch.tsv'), encoding='utf-8'), delimiter='\\t'))\n\n\ndef locate(path, branch=None, find=None):\n    held = [r for r in MAN if r['path'] == path]\n    if branch == 'integration/echo-whole':        # the inventory's own files are not in the census\n        sha = git('rev-parse', f'origin/{branch}:{path}').strip()\n        held = [dict(branch=branch, path=path, blob_sha=sha)]\n    if not held:\n        raise SystemExit(f'not in census: {path}')\n    if branch is None:\n        rank = {b: i for i, b in enumerate(ORDER)}\n        branch = sorted(held, key=lambda r: (rank.get(r['branch'], 99), r['branch']))[0]['branch']\n    row = next(r for r in held if r['branch'] == branch)\n    text = git('cat-file', 'blob', row['blob_sha'])\n    line = ''\n    if find:\n        for n, src in enumerate(text.splitlines(), 1):\n            if re.search(find, src):\n                line = n\n                break\n        if not line:\n            raise SystemExit(f'{find!r} not found in {path}')\n    return dict(branch=branch, path=path, blob_sha=row['blob_sha'], commit=git('rev-parse', f'origin/{branch}').strip(),\n                same=sum(1 for r in held if r['blob_sha'] == row['blob_sha']) - 1, line=line, text=text)\n\n\ndef short(fields, n=14):\n    fields = list(dict.fromkeys(fields))\n    return ', '.join(fields[:n]) + (f' (+{len(fields) - n} more)' if len(fields) > n else '')\n\n\nrows, located = [], {}\n\n\ndef add(iid, name, form, describes, notation, fields, path, branch=None, find=None, glyph='', notes='', kind='home'):\n    loc = locate(path, branch, find)\n    located[iid] = loc\n    n = notes + (f'; line {loc[\"line\"]}' if loc['line'] else '') + (f'; same file in {loc[\"same\"]} other branches' if loc['same'] else '')\n    rows.append(dict(id=iid, name=name, form=form, describes=describes, notation=notation,\n                     fields=fields(loc['text']) if callable(fields) else fields,\n                     branch=loc['branch'], path=path, blob_sha=loc['blob_sha'], commit=loc['commit'], made_by='unknown',\n                     status='INERT', home_or_ref=kind, glyph=glyph, notes=n.strip('; ')))\n\n\ndef md_table_fields(text):\n    return [m.group(1) for m in re.finditer(r'^\\|\\s*`([^`]+)`\\s*\\|', text, re.M)]\n\n\ndef sql_columns(table):\n    def f(text):\n        m = re.search(r'CREATE TABLE IF NOT EXISTS ' + table + r' \\((.*?)\\);', json.loads(text)['migration_sql'], re.S)\n        return [c.strip().split()[0] for c in m.group(1).split(',\\n') if c.strip()]\n    return f\n\n\ndef tsv_header(text):\n    for line in text.splitlines():\n        if line.startswith('# columns:'):\n            return [c.strip().split()[0] for c in line.split(':', 1)[1].split('<TAB>')]\n        if not line.startswith('#'):\n            return line.split('\\t')\n    return []\n\n\n# ---- written ---------------------------------------------------------------------------------------------\nadd('SCH-0001', 'Contract 000 manifest row', 'written', 'one file of a mirrored branch (Contract 000 Inert rule)', 'TSV',\n    lambda t: tsv_header(t), 'L1-main/MANIFEST.tsv', 'mirror-claude', r'^# columns:', '',\n    'rule stated in research-registry/contracts/CONTRACT-000.md: \"every file of every branch is listed in a manifest (path, git blob fingerprint, size)\", status INERT, KEPT, PRUNED or DEFERRED')\nadd('SCH-0002', 'L2 Library register row', 'written', 'one file placed in a Library sub-library (L2-library/*/REGISTER.tsv)', 'TSV',\n    tsv_header, 'L2-library/Algorithms/REGISTER.tsv', 'mirror-claude', None, '', 'the earlier librarian\\'s register; same header in all seven REGISTER.tsv files')\nadd('SCH-0003', 'Inventory index row', 'written', 'one row of any inventory/*/INDEX.tsv', 'Markdown table',\n    lambda t: ['id', 'name', '(folder columns)'] + [f for f in md_table_fields(t.split('Shared columns', 1)[1].split('\\n## ', 1)[0])\n                                                    if f not in ('id', 'name')],\n    'inventory/README.md', 'integration/echo-whole', r'^### Shared columns|^## Shared columns', '',\n    'this inventory\\'s own form; each folder README adds its own columns', kind='home')\nrows[-1]['made_by'] = 'claude'\nadd('SCH-0004', 'Business ledger row', 'written', 'one transaction (stored privately; only the schema is public)', 'Markdown table',\n    md_table_fields, 'Business/ledger/SCHEMA.md', None, None, '',\n    'rules: amounts never estimated; a missing figure is recorded as missing; corrections are new reversing rows, never edits')\nadd('SCH-0005', 'Code library assessment template', 'written', 'one assessment of a code library artifact (CLR-XXXX)', 'Markdown headings',\n    lambda t: [m.group(1) for m in re.finditer(r'^## (.+)$', t, re.M)], 'code_library_registry/ASSESSMENT_TEMPLATE.md', None, None, '',\n    'a template: a schema with blanks to fill')\nadd('SCH-0006', 'ECHO output format', 'written', \"ECHO's own responses: ## sections, [N] footnotes, timestamps\", 'JSON example',\n    lambda t: re.findall(r'\"(## [^\"]+)\"', t), 'docs/ECHO_OUTPUT_FORMAT.md', None, None, '',\n    'applies the Dual-Order structure to responses: sections read content-first, footnotes lookup-first')\nfor k, (table, describes) in enumerate([('agents', 'one word agent'), ('ties', 'one tie between two words'),\n                                         ('formulas', 'one formula'), ('wordnet_chains', 'one WordNet chain'),\n                                         ('etymology', 'one word\\'s etymology'), ('geosensory_endpoints', 'one feed endpoint')], 7):\n    add(f'SCH-{k:04d}', f'D1 table {table}', 'written', describes, 'SQL (D1)', sql_columns(table),\n        'infrastructure/cloudflare_blueprint.json', None, None, '',\n        'migration_sql in the blueprint A-157 DeploymentTranslator generates; not deployed (L2 register: deploy DEFERRED)')\n\n# ---- declared schema ids -----------------------------------------------------------------------------------\nDECLARED = {}\nfor r in MAN:\n    if r['path'].endswith('.json') and not r['path'].startswith(('Datasets/', 'L2-library/')):\n        DECLARED.setdefault(r['path'], r)\n\n\ndef json_fields(text):\n    d = json.loads(text)\n    top = [k for k in d if k != 'schema'] if isinstance(d, dict) else []\n    best = None\n    for k, v in (d.items() if isinstance(d, dict) else []):\n        if isinstance(v, list) and v and isinstance(v[0], dict):\n            if best is None or len(v) > len(best[1]):\n                best = (k, v)\n    if best:\n        keys = list(dict.fromkeys(k for e in best[1] for k in e))\n        return [f'{x}' for x in top if x != best[0]] + [f'{best[0]}[]: ' + short(keys, 10)]\n    return top\n\n\nseen_ids = {}\nfor path in sorted(DECLARED):\n    try:\n        d = json.loads(git('cat-file', 'blob', DECLARED[path]['blob_sha']))\n    except (json.JSONDecodeError, subprocess.CalledProcessError):\n        continue\n    if isinstance(d, dict) and isinstance(d.get('schema'), str) and re.match(r'echo\\.', d['schema']):\n        seen_ids[d['schema']] = path\nn = 13\nfor sid, path in sorted(seen_ids.items()):\n    add(f'SCH-{n:04d}', sid, 'declared', path.rsplit('/', 1)[-1], 'JSON', json_fields, path, None, None, '',\n        'the file names its schema id; no written definition of the id was found, so fields are read from the file')\n    n += 1\n\n\n# ---- implied from code ----------------------------------------------------------------------------------------\ndef dataclass_fields(classes):\n    def f(text):\n        tree = ast.parse(text)\n        out = []\n        for node in tree.body:\n            if isinstance(node, ast.ClassDef) and node.name in classes:\n                fs = [s.target.id for s in node.body if isinstance(s, ast.AnnAssign) and isinstance(s.target, ast.Name)]\n                out.append(f'{node.name}({\", \".join(fs)})')\n        return out\n    return f\n\n\nCODE = [\n    ('EMEL syntax tree', 'one EMEL statement as a typed tree', 'echo/language/ast.py', 'ksm-recess-wholesale',\n     ['Term', 'Relation', 'Property', 'Proportion', 'Continued', 'Apply', 'Not', 'Join'], r'^class Term', 'פ',\n     '\"English, EMEL notation and Canvas are renderers of these nodes; none of them is the meaning\"'),\n    ('Governor request and state', \"the Governor's State, Request and Context\", 'src/echo_governor_skeleton.py', None,\n     ['State', 'Request', 'Context'], r'^class State', 'ר', 'top of the kernel'),\n    ('Plastic link', 'one neuroplastic link in the overlay', 'echo_neuroplasticity_overlay.py', None,\n     ['PlasticLink'], r'^class PlasticLink', '', 'the overlay that wraps AlgorithmMatrix (neuroplasticity gate precedent)'),\n    ('Matrix dictionary cells', 'custom matrices and their cells', 'ECHO_AutonomousAgency/src/echo_matrix_dictionary.py', None,\n     ['CustomMatrix', 'MatrixCell'], r'^class CustomMatrix|^class MatrixCell', '', ''),\n    ('Classroom exam item', 'one exam item', 'src/echo_classroom.py', None, ['ExamItem'], r'^class ExamItem', '', ''),\n    ('Comprehension record', 'one comprehension audit record', 'src/echo_comprehension_audit.py', None, ['ComprehensionRecord'],\n     r'^class ComprehensionRecord', '', ''),\n    ('Homework event', 'one homework audit event', 'src/echo_homework_audit.py', None, ['HomeworkEvent'], r'^class HomeworkEvent', '', ''),\n    ('Lexical entry (WordNet)', 'one lexical entry', 'src/echo_gf_wordnet.py', None, ['LexicalEntry'], r'^class LexicalEntry', '', ''),\n    ('Sub-governor finding', 'one finding a sub-governor reports', 'src/echo_sub_governor.py', None, ['Finding'], r'^class Finding', 'ר', ''),\n    ('EVE classroom lobby', 'a classroom lobby and its vocabulary neighbours', 'pwa/public/eve/classroom/lobby.py', None,\n     ['EchoLobby', 'VocabularyNeighbor'], r'^class EchoLobby|^class VocabularyNeighbor', '', ''),\n    ('Inert EVE', 'an inert EVE instance', 'pwa/public/eve/inert_eve.py', None, ['InertEVE'], r'^class InertEVE', '', ''),\n    ('NVE-D configuration lab', 'nodes, links, budget and clock of an NVE-D configuration', 'experiments/nve-d/configuration_lab.py', None,\n     ['Node', 'Link', 'Budget', 'Clock'], r'^class (Node|Link|Budget|Clock)\\b', '', 'also writes schema ids nve-d-arm-v1 and nve-d-tested-set-v1'),\n]\nfor name, describes, path, branch, classes, find, glyph, notes in CODE:\n    add(f'SCH-{n:04d}', name, 'implied', describes, 'Python dataclasses', dataclass_fields(classes), path, branch, find, glyph, notes)\n    n += 1\nadd(f'SCH-{n:04d}', 'Geosensory reading', 'implied', 'one feed reading turned into map points (schema_version 1)', 'Python dict',\n    lambda t: ['schema_version', 'view', 'generated_at_ms', 'freshness', 'feed_age_ms', 'coverage', 'points[]: id, coordinates, value, quantity, unit, observed_at_ms, information_kind, value_status, source, lineage, label, review_status', 'rejected', 'source_url', 'persistence'],\n    'src/geosensory_model.py', 'geosensory-crawler-experiment', r\"'schema_version':1\", '',\n    'USGS GeoJSON to points; feed freshness kept separate from event age; \"absence is not absence of earthquakes\"')\nn += 1\nMODS = [('MOD-0001 verified resource gate', 'code_library_registry/modules/MOD-0001-verified-resource-gate/generalized/verified_resource_gate.py', ['ResourceSpec']),\n        ('MOD-0002 bounded composition search', 'code_library_registry/modules/MOD-0002-bounded-composition-search/generalized/bounded_composition_search.py', ['SearchEvent', 'SearchResult']),\n        ('MOD-0003 structured workspace', 'code_library_registry/modules/MOD-0003-structured-workspace-registry/generalized/structured_workspace.py', ['Collection', 'Item', 'Relation', 'IndexBinding']),\n        ('MOD-0005 bounded affinity admission', 'code_library_registry/modules/MOD-0005-bounded-affinity-admission/generalized/bounded_affinity_admission.py', ['AdmissionDecision', 'CycleResult']),\n        ('MOD-0006 static python flow outline', 'code_library_registry/modules/MOD-0006-static-python-flow-outline/generalized/static_python_flow_outline.py', ['FlowOutline', 'OutlineNode', 'OutlineEdge']),\n        ('MOD-0008 schedule gate', 'code_library_registry/modules/MOD-0008/generalized/schedule_gate.py', ['Schedule', 'Decision'])]\nfor name, path, classes in MODS:\n    add(f'SCH-{n:04d}', name + ' records', 'implied', 'the records this module passes around', 'Python dataclasses',\n        dataclass_fields(classes), path, 'code-library-registry', r'^class ' + classes[0] + r'\\b', '', 'algorithm row: ALG-' + name.split()[0])\n    n += 1\n\n# ---- implied from data: Echo's matrices --------------------------------------------------------------------------\ndef entry_fields(text):\n    d = json.loads(text)\n    entries = list(d.values()) if isinstance(d, dict) else d\n    objs = [e for e in entries if isinstance(e, dict)]\n    if not objs:\n        return ['(entries are not objects)']\n    counts = {}\n    for e in objs:\n        for k in e:\n            counts[k] = counts.get(k, 0) + 1\n    keys = sorted(counts, key=lambda k: -counts[k])\n    keyed = 'keyed by id; ' if isinstance(d, dict) else 'list; '\n    return [keyed + f'{len(objs)} entries'] + [k + ('' if counts[k] == len(objs) else f' ({counts[k]}/{len(objs)})') for k in keys]\n\n\nMATRICES = [('echo_algorithm_matrix.json', 'one algorithm'), ('echo_lobby_agents.json', 'one word agent'),\n            ('echo_vgm.json', 'one validated generalization'), ('echo_wordnet_chains.json', 'one WordNet chain'),\n            ('echo_number_matrix.json', 'one number'), ('echo_equilibria.json', 'one equilibrium'),\n            ('echo_formula_matrix.json', 'one formula'), ('echo_lhea_chains.json', 'one LHEA chain'),\n            ('echo_geosensory_registry.json', 'one feed endpoint')]\nfor fname, describes in MATRICES:\n    add(f'SCH-{n:04d}', f'{fname} entry', 'implied', describes, 'JSON', entry_fields, 'matrices/' + fname, None, None, '',\n        'home: matrices/ for the store itself; this row is the shape of one entry')\n    n += 1\nadd(f'SCH-{n:04d}', 'Rule Registry rule', 'implied', 'one notation or framework rule (R-codes)', 'JSON',\n    lambda t: list(json.loads(t)[0]), 'code_library_registry/symbol_registries/rules-snapshot-2026-10-08.json', None, None, '',\n    'fields read from the 2026-10-08 snapshot; the written form (D1 tables rules and rule_events) is in the CloudFlare project doc claude/rule-registry-upkeep.md, not in this repository')\nn += 1\n\n# ---- cross-references ----------------------------------------------------------------------------------------------\nadd(f'SCH-{n:04d}', 'Lexicon registry page template', 'written', 'the CLR-0043 page with /*STARTER*/ and /*GRAMMAR*/ placeholders', 'HTML template',\n    '', 'code_library_registry/artifacts/CLR-0043/lexicon_registry.template.html', None, None, '', 'home: interfaces/; a page template, not a record form', kind='ref')\nn += 1\n\ncols = open(os.path.join(INV, 'schemas', 'INDEX.tsv'), encoding='utf-8').readline().rstrip('\\n').split('\\t')\n\n\ndef write(path, header, rws):\n    with open(path, 'w', newline='', encoding='utf-8') as f:\n        w = csv.writer(f, delimiter='\\t', lineterminator='\\n', quoting=csv.QUOTE_NONE, quotechar=None, escapechar='\\\\')\n        w.writerow(header)\n        for r in rws:\n            w.writerow([(r.get(c, '') if not isinstance(r.get(c), list) else '; '.join(r[c])) for c in header])\n\n\nwrite(os.path.join(INV, 'schemas', 'INDEX.tsv'), cols, rows)\n\n\ndef merge(folder, new):\n    p = os.path.join(INV, folder, 'INDEX.tsv')\n    header = open(p, encoding='utf-8').readline().rstrip('\\n').split('\\t')\n    old = {r['id']: r for r in csv.DictReader(open(p, encoding='utf-8'), delimiter='\\t', quoting=csv.QUOTE_NONE)}\n    for r in new:\n        old[r['id']] = {**old.get(r['id'], {}), **r}\n    write(p, header, [old[k] for k in sorted(old)])\n    return len(old)\n\n\ndef src(iid):\n    loc = located[iid]\n    return dict(branch=loc['branch'], path=loc['path'], blob_sha=loc['blob_sha'], commit=loc['commit'])\n\n\nby_name = {r['name']: r['id'] for r in rows}\nG = [\n    ('GLO-0026', 'schema', 'the blank form: what fields a kind of record must have, their types and rules', 'inventory/schemas README (Claude, for this inventory)', 'SCH-0003', '', ''),\n    ('GLO-0027', 'Inert (manifest)', 'every file of every branch is listed in a manifest (path, git blob fingerprint, size) with no content copied', 'CONTRACT-000.md', 'SCH-0001', '', ''),\n    ('GLO-0028', 'Dual-Order', 'every elemental part reachable both ways: content-first (Matrix) and lookup-first (Index)', 'docs/ECHO_OUTPUT_FORMAT.md (citing the Dual-Order OS RFC)', 'SCH-0006', '', ''),\n    ('GLO-0029', 'SOURCE-OBSERVED / INFERRED (evidence)', 'from a processor record / not', 'Business/ledger/SCHEMA.md', 'SCH-0004', 'Rule Registry provenance uses DECLARED / INFERRED / OBSERVED', ''),\n    ('GLO-0030', 'freshness', 'whether a feed is missing, future, stale or fresh; kept separate from event age', 'src/geosensory_model.py', by_name['Geosensory reading'], '', ''),\n    ('GLO-0031', 'department', '', '', 'SCH-0007', '', 'UNDEFINED AT SOURCE: also a column of the D1 agents table; see GLO-0025'),\n    ('GLO-0032', 'reuse disposition', '', '', 'SCH-0005', '', 'UNDEFINED AT SOURCE: a heading of the assessment template; its allowed values are not listed there'),\n]\ngl = [dict(id=g, name=t, term=t, meaning=m, stated_by=b, first_seen=f, variants=v, made_by='unknown', status='INERT',\n           home_or_ref='home', notes='met in schemas sweep 1' + ('; ' + nt if nt else ''), **src(f)) for g, t, m, b, f, v, nt in G]\nn_gl = merge('glossary', gl)\n\nREG = [dict(id='REG-0005', name='Geosensory endpoint registry', entry_count=str(len(json.loads(located[by_name['echo_geosensory_registry.json entry']]['text']))),\n            maintained_by='A-155/A-158 GeosensoryCrawler', home_or_ref='home', entry_schema=by_name['echo_geosensory_registry.json entry'],\n            notes='met in schemas sweep 1; also a D1 table (SCH-0012)', **src(by_name['echo_geosensory_registry.json entry'])),\n       dict(id='REG-0006', name='Algorithm registry (echo_algorithm_matrix.json)',\n            entry_count=str(len(json.loads(located[by_name['echo_algorithm_matrix.json entry']]['text']))), maintained_by='hand and A-150',\n            home_or_ref='ref', entry_schema=by_name['echo_algorithm_matrix.json entry'],\n            notes='home: matrices/ (its README lists it there); registry-shaped: A-numbers to name, status, purpose; newer copy on autonomous-agency', **src(by_name['echo_algorithm_matrix.json entry']))]\nfor r in REG:\n    r.update(made_by='unknown', status='INERT', glyph='')\nDECL_REG = sorted(sid for sid in seen_ids if ('registry' in sid or 'catalog' in sid)\n                  and sid not in ('echo.hebrew-glyph-registry.v0.1', 'echo.grammar-registry.v0.1'))   # already REG-0001, REG-0004\nfor k, sid in enumerate(DECL_REG, 7):\n    loc = located[by_name[sid]]\n    d = json.loads(loc['text'])\n    big = max((v for v in d.values() if isinstance(v, list)), key=len, default=[])\n    REG.append(dict(id=f'REG-{k:04d}', name=sid, entry_count=str(len(big)), entry_schema=by_name[sid], maintained_by='', home_or_ref='home',\n                    made_by='unknown', status='INERT', glyph='', notes='met in schemas sweep 1; declares its own schema id', **src(by_name[sid])))\nREG.append(dict(id='REG-0001', entry_schema=by_name['echo.hebrew-glyph-registry.v0.1']))\nREG.append(dict(id='REG-0004', entry_schema=by_name['echo.grammar-registry.v0.1']))\nREG.append(dict(id='REG-0003', entry_schema=by_name['Rule Registry rule']))\nn_reg = merge('registries', REG)\n\n# ---- Echo's shadow run, continuing from the logics sweep ------------------------------------------------------------\nl2 = {}\nfor f in ('Algorithms', 'Codices', 'Formulas', 'Indices', 'Logics', 'Matrices', 'Registries'):\n    for r in csv.DictReader(io.StringIO(git('show', f'origin/mirror-claude:L2-library/{f}/REGISTER.tsv')), delimiter='\\t'):\n        l2.setdefault(r['path'], f.lower())\nNAME = [(r'schema|template|format|spec|model', 'schemas'),\n        (r'grammar|parser|parse|dsl|rule|operator|lhea|proportion|legend|signature|syntax', 'logics'),\n        (r'registry', 'registries'), (r'matrix|matrices|chains', 'matrices'), (r'test|trial', 'experiments'),\n        (r'manual|discussion|readme|\\.md$', 'codices'), (r'workflow|\\.yml$', 'automation'), (r'axiom|lexicon', 'data')]\nPARENT = {'language': 'logics', 'operators': 'logics', 'grammar': 'logics', 'symbols': 'registries', 'glyphs': 'registries',\n          'symbol_registries': 'registries', 'tests': 'experiments', 'docs': 'codices', 'discussions': 'codices',\n          'matrices': 'matrices', 'workflows': 'automation', 'core-lexicon': 'data', 'src': 'algorithms', 'ledger': 'schemas',\n          'mashet': 'codices', 'nve-d': 'experiments', 'data': 'data', 'pwa': 'interfaces', 'glyph': 'registries',\n          'infrastructure': 'deployments', 'generalized': 'algorithms', 'L1-main': 'indices', 'inventory': 'governance'}\n\n\ndef content(text):\n    if re.search(r'@dataclass|\"schema\"\\s*:|CREATE TABLE|^\\|\\s*Field\\s*\\|', text, re.M):\n        return 'schemas'\n    if re.search(r'^class \\w+|^def \\w+', text, re.M):\n        return 'algorithms'\n    if text.lstrip().startswith(('{', '[')):\n        return 'registries'\n    return 'codices'\n\n\ntexts = {}\n\n\ndef guess(arm, path, where):\n    if arm == 'name':\n        for pat, folder in NAME:\n            if re.search(pat, (where or '') + ' ' + path.rsplit('/', 1)[-1], re.I):\n                return folder\n        return None\n    if arm == 'parent':\n        return PARENT.get(path.rsplit('/', 2)[-2] if '/' in path else '')\n    if arm == 'shape':\n        return {'py': 'algorithms', 'js': 'logics', 'json': 'registries', 'md': 'codices', 'html': 'interfaces',\n                'yml': 'automation', 'tsv': 'indices'}.get(path.rsplit('.', 1)[-1])\n    if arm == 'librarian':\n        return l2.get(path)\n    if arm == 'content':\n        return content(texts.get(path, ''))\n\n\nARMS = ['name', 'parent', 'shape', 'librarian', 'content']\ncases = []\nfor r in rows:\n    texts[r['path']] = located[r['id']]['text']\n    cases.append((r['id'], r['path'], r['name'] if located[r['id']]['line'] else '',\n                  'schemas' if r['home_or_ref'] == 'home' else 'interfaces'))\nDECOYS = [('src/echo_classroom.py', 'algorithms'), ('docs/ECHO_Polymath_Unified_Spec.md', 'codices'),\n          ('notebook/query_workspace/specs.md', 'codices'), ('pwa/manifest.webmanifest', 'interfaces'),\n          ('tests/test_geosensory_model.py', 'experiments'), ('GEOSENSORY_VISUAL_MODELS.md', 'codices'),\n          ('matrices/symbols/mashet_instruction_manual.json', 'logics'), ('matrices/grammar/grammar_registry.json', 'logics')]\nfor i, (p, truth) in enumerate(DECOYS, 1):\n    texts[p] = locate(p)['text']\n    cases.append((f'DECOY-{i:02d}', p, '', truth))\n# a file can be both a schema row and a decoy elsewhere: keep the first ruling for each path+id pair only\ntrace, summary = echo_journeyman.shadow(REPO, cases, ARMS, guess,\n                                       os.path.join(INV, 'schemas', 'sweeps', 'echo_state_after_schemas.json'), seed=1024,\n                                       prior_state=os.path.join(INV, 'logics', 'sweeps', 'echo_state_after_logics.json'))\nwrite(os.path.join(INV, 'schemas', 'sweeps', 'echo_shadow_2.tsv'), ['n', 'id', 'path', 'bucket', 'arm', 'guess', 'ruling', 'hit'], trace)\njson.dump(summary, open(os.path.join(INV, 'schemas', 'sweeps', 'echo_shadow_2.json'), 'w'), indent=1, ensure_ascii=False)\nforms = {}\nfor r in rows:\n    forms[r['form']] = forms.get(r['form'], 0) + 1\nprint(f'schemas rows {len(rows)} {forms}; glossary {n_gl}; registries {n_reg}')\nprint('echo:', json.dumps(summary, ensure_ascii=False))\n"},{"path":"inventory/tools/INDEX.tsv","size":120,"sha":"348cd8d050fb1a86ea67951b73334383a55754ff","text":"id\tname\tentry\tinputs\toutputs\tside_effects\truns_where\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\n"},{"path":"inventory/tools/README.md","size":1217,"sha":"13a79e6ef417b53e2de913bac5391050e3b35509","text":"# Tools\n\nRunnable utilities: builders, crawlers, migrators, checkers. A tool does a job; it does not learn or govern.\n\n## Belongs here\n\n- `build.py` scripts, `a159_cloudflare_migrator.py`, the dataset crawler\n- the F-001 checking and build scripts\n- shell scripts such as `fetch-pyodide.sh`\n\n## Not here\n\n- anything with an A-number or a learning role → `algorithms/`\n- CI workflows → `automation/`\n\n## Row format\n\n`INDEX.tsv` holds one row per item, tab-separated. Its own columns sit after `id` and `name`; the shared columns that follow are explained in [`../README.md`](../README.md).\n\n| Column | Meaning |\n| --- | --- |\n| `entry` | how it is started (command or file) |\n| `inputs` | what it reads |\n| `outputs` | what it produces |\n| `side_effects` | what it changes beyond its outputs (writes, network) |\n| `runs_where` | Pydroid, browser, CI… |\n\n## Example row\n\nReal item, filled only as far as already known; the sweep completes it.\n\n```tsv\nid\tname\tentry\tinputs\toutputs\tside_effects\truns_where\tbranch\tpath\tblob_sha\tcommit\tmade_by\tstatus\thome_or_ref\tglyph\tnotes\nTOOL-0001\tDataset crawler\t\t\t\twrites Datasets/ on a schedule\tGitHub Actions\tcode-library-regist <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const GH = 'https://github.com/' + D.repo;
const enc = p => p.split('/').map(encodeURIComponent).join('/');
const ghBlob = (branch, path, line) => GH + '/blob/' + branch + '/' + enc(path) + (line ? '#L' + line : '');
const ghTree = (branch, path) => GH + '/tree/' + branch + '/' + enc(path.replace(/\/$/, ''));
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : n >= 1e3 ? (n / 1e3).toFixed(1) + ' KB' : n + ' B';
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const k of kids) if (k != null) e.append(k); return e; };

document.getElementById('snap').append(
  'Snapshot of ', el('a', { href: ghTree(D.branch, 'inventory'), target: '_blank', rel: 'noopener', text: D.branch }),
  ' at ' + D.commit.slice(0, 7) + ', ' + D.date.slice(0, 10));

// ---- inventory tree -------------------------------------------------------
const invFiles = new Map(D.inventory.map(f => [f.path, f]));
function children(prefix) {          // prefix like 'inventory/' or 'inventory/algorithms/'
  const dirs = new Map(), files = [];
  for (const f of D.inventory) {
    if (!f.path.startsWith(prefix)) continue;
    const rest = f.path.slice(prefix.length), i = rest.indexOf('/');
    if (i < 0) files.push(f); else { const d = rest.slice(0, i); dirs.set(d, (dirs.get(d) || 0) + 1); }
  }
  return { dirs, files };
}
const rowsIn = folder => { const f = invFiles.get('inventory/' + folder + '/INDEX.tsv'); return f && f.text ? Math.max(0, f.text.trim().split('\n').length - 1) : 0; };
const GROUPS = [
  ['The seven Library sub-libraries', ['registries', 'matrices', 'indices', 'codices', 'logics', 'algorithms', 'formulas']],
  ['How Echo is built and talks', ['tools', 'schemas', 'protocols', 'interfaces']],
  ['What Echo learns from and leaves behind', ['experiments', 'data', 'records', 'archives']],
  ['Running it', ['automation', 'deployments', 'dependencies']],
  ['Holding it together', ['governance', 'glossary', 'maps', 'decisions']],
];

// ---- state ------------------------------------------------------------------
let S = { tab: 'inventory', path: 'inventory/', file: null, row: null, branch: null, bpath: '', bfile: null };
try { const saved = JSON.parse(localStorage.getItem('echo-explorer') || 'null'); if (saved && saved.tab) S = Object.assign(S, saved); } catch (e) {}
function go(patch) { S = Object.assign({}, S, patch); try { localStorage.setItem('echo-explorer', JSON.stringify(S)); } catch (e) {} render(); window.scrollTo(0, 0); }

document.getElementById('tab-inventory').addEventListener('click', () => go({ tab: 'inventory' }));
document.getElementById('tab-branches').addEventListener('click', () => go({ tab: 'branches' }));
document.getElementById('tab-explore').addEventListener('click', () => go({ tab: 'explore', xfile: null }));

function crumbs(parts) {
  const nav = document.getElementById('crumbs'); nav.replaceChildren();
  parts.forEach((p, i) => {
    if (i) nav.append(el('span', { class: 'sep', text: '/' }));
    nav.append(i === parts.length - 1 ? el('span', { class: 'here', text: p[0] }) : el('button', { text: p[0], onclick: p[1] }));
  });
}

function itemBtn(icon, name, sub, meta, onclick, pill) {
  return el('button', { class: 'item', onclick },
    el('span', { class: 'ic', text: icon }),
    el('span', { class: 'nm' }, name, pill || null, sub ? el('small', { text: sub }) : null),
    el('span', { class: 'meta', text: meta || '' }));
}
function filterBox(placeholder, onInput) {
  const box = el('input', { class: 'filter', type: 'search', id: 'filter', placeholder, 'aria-label': placeholder });
  box.addEventListener('input', () => onInput(box.value.trim().toLowerCase()));
  return box;
}

// ---- render ---------------------------------------------------------------
function render() {
  document.getElementById('tab-inventory').setAttribute('aria-selected', S.tab === 'inventory');
  document.getElementById('tab-branches').setAttribute('aria-selected', S.tab === 'branches');
  document.getElementById('tab-explore').setAttribute('aria-selected', S.tab === 'explore');
  const view = document.getElementById('view'); view.replaceChildren();
  if (S.tab === 'inventory') renderInventory(view); else if (S.tab === 'explore') renderExplore(view); else renderBranches(view);
}

function invCrumbs() {
  const segs = (S.file || S.path).replace(/\/$/, '').split('/');
  const parts = segs.map((s, i) => [s, () => go({ path: segs.slice(0, i + 1).join('/') + '/', file: null, row: null })]);
  if (S.row != null) parts.push(['row ' + (S.row + 1), null]);
  crumbs(parts);
}

function renderInventory(view) {
  invCrumbs();
  if (S.file) return renderFile(view, invFiles.get(S.file));
  const { dirs, files } = children(S.path);
  const list = el('div', { class: 'list' });
  if (S.path === 'inventory/') {
    for (const [title, names] of GROUPS) {
      list.append(el('div', { class: 'group', text: title }));
      for (const n of names) if (dirs.has(n)) {
        const r = rowsIn(n);
        list.append(itemBtn('▸', n, null, r ? r + ' rows' : 'empty', () => go({ path: 'inventory/' + n + '/', file: null, row: null })));
      }
    }
    list.append(el('div', { class: 'group', text: 'Census and rules' }));
  } else {
    for (const [d, n] of [...dirs].sort()) list.append(itemBtn('▸', d, null, n + ' files', () => go({ path: S.path + d + '/', file: null, row: null })));
  }
  const order = f => f.path.endsWith('README.md') ? 0 : f.path.endsWith('INDEX.tsv') ? 1 : 2;
  for (const f of files.sort((a, b) => order(a) - order(b) || a.path.localeCompare(b.path))) {
    const name = f.path.slice(S.path.length);
    const meta = name === 'INDEX.tsv' ? (rowsIn(S.path.split('/')[1]) + ' rows') : fmt(f.size);
    list.append(itemBtn(name.endsWith('.tsv') ? '▦' : '¶', name, null, meta, () => go({ file: f.path, row: null })));
  }
  view.append(list);
}

function parseTSV(text) {
  const lines = text.replace(/\n$/, '').split('\n');
  const head = lines[0].split('\t');
  return { head, rows: lines.slice(1).filter(Boolean).map(l => l.split('\t')) };
}

function renderFile(view, f) {
  const name = f.path.split('/').pop();
  if (!f.text) {
    view.append(el('div', { class: 'doc' }, el('p', { text: name + ' is ' + fmt(f.size) + ', too large to show here.' }),
      el('div', { class: 'actions' }, el('a', { class: 'btn', href: ghBlob(D.branch, f.path), target: '_blank', rel: 'noopener', text: 'Open on GitHub' }))));
    return;
  }
  if (name.endsWith('.tsv')) return renderTable(view, f);
  const doc = el('div', { class: 'doc' });
  if (name.endsWith('.md') && window.marked) {
    doc.innerHTML = marked.parse(f.text);
    doc.querySelectorAll('table').forEach(t => { const w = el('div', { class: 'tablewrap' }); t.replaceWith(w); w.append(t); });
    doc.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (/^https?:/.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      a.addEventListener('click', ev => { ev.preventDefault(); openRelative(f.path, href); });
    });
  } else {
    doc.append(el('pre', {}, el('code', { text: f.text })));
  }
  doc.append(el('div', { class: 'actions' }, el('a', { class: 'btn', href: ghBlob(D.branch, f.path), target: '_blank', rel: 'noopener', text: 'Open on GitHub' })));
  view.append(doc);
}

function openRelative(from, href) {
  const base = from.split('/').slice(0, -1);
  for (const seg of href.split('#')[0].split('/')) { if (seg === '..') base.pop(); else if (seg && seg !== '.') base.push(seg); }
  const target = base.join('/');
  if (invFiles.has(target)) return go({ file: target, row: null, path: target.split('/').slice(0, -1).join('/') + '/' });
  if (D.inventory.some(x => x.path.startsWith(target + '/'))) return go({ path: target + '/', file: null, row: null });
  window.open(ghBlob(D.branch, target), '_blank', 'noopener');
}

function rowSummary(head, r) {
  const get = k => r[head.indexOf(k)] || '';
  const sub = get('location') || get('question') || get('path');
  return { key: get('id'), title: get('name') || get('term'), sub, weak: /WEAK/.test(get('notes')) };
}

function renderTable(view, f) {
  const { head, rows } = parseTSV(f.text);
  if (S.row != null && rows[S.row]) return renderRow(view, f, head, rows[S.row]);
  if (!rows.length) {
    view.append(el('div', { class: 'doc' }, el('p', { text: 'No rows yet. The sweep for this folder has not run.' }),
      el('p', { class: 'note', text: 'Columns: ' + head.join(', ') })));
    return;
  }
  const count = el('div', { class: 'count' });
  const box = el('div', { class: 'rows' });
  const draw = q => {
    box.replaceChildren(); let n = 0;
    rows.forEach((r, i) => {
      if (q && !r.join(' ').toLowerCase().includes(q)) return;
      n++;
      const s = rowSummary(head, r);
      box.append(el('button', { class: 'row', onclick: () => go({ row: i }) },
        el('span', { class: 'k', text: s.key }),
        el('span', { class: 't' }, s.title, s.weak ? el('span', { class: 'pill weak', text: 'weak' }) : null),
        s.sub ? el('span', { class: 's', text: s.sub }) : null));
    });
    count.textContent = n + ' of ' + rows.length + ' rows';
  };
  view.append(el('div', { class: 'rows' }, filterBox('Filter rows (id, name, location, notes…)', draw), count, box));
  draw('');
}

function renderRow(view, f, head, r) {
  const get = k => r[head.indexOf(k)] || '';
  const dl = el('dl', { class: 'fields' });
  head.forEach((h, i) => { if (r[i]) dl.append(el('dt', { text: h }), el('dd', { text: r[i] })); });
  const actions = el('div', { class: 'actions' });
  const branch = get('branch'), path = get('path');
  if (branch && path && !/;/.test(path)) {
    const line = (get('location').match(/\(line (\d+)\)/) || [])[1];
    const url = path.endsWith('/') ? ghTree(branch, path) : ghBlob(branch, path, line);
    actions.append(el('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener', text: line ? 'Open source at line ' + line : 'Open source on GitHub' }));
  }
  actions.append(el('button', { class: 'btn', text: 'Back to rows', onclick: () => go({ row: null }) }));
  view.append(el('div', { class: 'doc' }, el('h2', { text: (get('id') + '  ' + (get('name') || '')).trim() }), dl, actions));
}

// ---- branches ---------------------------------------------------------------
const byName = new Map(D.branches.map(b => [b.name, b]));
const FAMILIES = ['Foundation', 'Genesis & agency', 'PWA & canvas', 'Library & data', 'Governance & research', 'Contract 000 orphans'];

function renderBranches(view) {
  const b = S.branch && byName.get(S.branch);
  if (!b) {
    crumbs([['42 branches', null]]);
    const list = el('div', { class: 'list' });
    const draw = q => {
      list.replaceChildren();
      for (const fam of FAMILIES) {
        const bs = D.branches.filter(x => x.family === fam && (!q || x.name.includes(q))).sort((a, c) => c.last.localeCompare(a.last));
        if (!bs.length) continue;
        list.append(el('div', { class: 'group', text: fam }));
        for (const x of bs) list.append(itemBtn('⎇', x.name, x.last + ' · ' + x.commits + ' commits · ' + x.unique + ' unique files',
          x.files + ' files', () => go({ branch: x.name, bpath: '', bfile: null }), x.live ? el('span', { class: 'pill', text: 'live' }) : null));
      }
    };
    view.append(el('div', { class: 'rows' }, filterBox('Filter branches', draw), list));
    draw('');
    return;
  }
  const segs = S.bpath ? S.bpath.replace(/\/$/, '').split('/') : [];
  const parts = [['42 branches', () => go({ branch: null, bpath: '', bfile: null })],
                 [b.name, () => go({ bpath: '', bfile: null })]];
  segs.forEach((s, i) => parts.push([s, () => go({ bpath: segs.slice(0, i + 1).join('/') + '/', bfile: null })]));
  if (S.bfile) parts.push([S.bfile.split('/').pop(), null]);
  parts[parts.length - 1][1] = null;
  crumbs(parts);

  if (S.bfile) {
    const f = b.tree.find(t => t[0] === S.bfile);
    if (f) {
      const [path, bytes, sha, same, versions] = f;
      const dl = el('dl', { class: 'fields' },
        el('dt', { text: 'branch' }), el('dd', { text: b.name }),
        el('dt', { text: 'path' }), el('dd', { text: path }),
        el('dt', { text: 'size' }), el('dd', { text: fmt(bytes) }),
        el('dt', { text: 'fingerprint' }), el('dd', { text: sha }),
        el('dt', { text: 'same content in' }), el('dd', { text: same === 1 ? 'this branch only' : same + ' branches' }),
        el('dt', { text: 'versions of this path' }), el('dd', { text: versions === 1 ? 'one, identical wherever it appears' : versions + ' different versions across branches' }));
      view.append(el('div', { class: 'doc' }, el('h2', { text: path.split('/').pop() }), dl,
        el('div', { class: 'actions' },
          el('a', { class: 'btn', href: ghBlob(b.name, path), target: '_blank', rel: 'noopener', text: 'Open on GitHub' }),
          el('button', { class: 'btn', text: 'Back to folder', onclick: () => go({ bfile: null }) }))));
    }
    return;
  }
  const prefix = S.bpath;
  const dirs = new Map(), files = [];
  for (const t of b.tree) {
    if (!t[0].startsWith(prefix)) continue;
    const rest = t[0].slice(prefix.length), i = rest.indexOf('/');
    if (i < 0) files.push(t); else { const d = rest.slice(0, i); const v = dirs.get(d) || [0, 0]; v[0]++; v[1] += t[1]; dirs.set(d, v); }
  }
  const list = el('div', { class: 'list' });
  const draw = q => {
    list.replaceChildren();
    for (const [d, [n, bytes]] of [...dirs].sort()) if (!q || d.toLowerCase().includes(q))
      list.append(itemBtn('▸', d, null, n + ' files · ' + fmt(bytes), () => go({ bpath: prefix + d + '/', bfile: null })));
    for (const t of files.sort()) { const name = t[0].slice(prefix.length); if (q && !name.toLowerCase().includes(q)) continue;
      list.append(itemBtn('¶', name, t[3] === 1 ? 'only here' : 'in ' + t[3] + ' branches', fmt(t[1]), () => go({ bfile: t[0] }),
        t[4] > 1 ? el('span', { class: 'pill weak', text: t[4] + ' versions' }) : null)); }
    if (!list.children.length) list.append(el('div', { class: 'group', text: 'Nothing matches' }));
  };
  const head = !prefix ? el('p', { class: 'note', text: b.family + ' · last change ' + b.last + ' · ' + b.files + ' files · ' + fmt(b.bytes) }) : null;
  view.append(el('div', { class: 'rows' }, head, filterBox('Filter this folder', draw), list));
  draw('');
}

// ---- explore: a category word plus a body of content to sort -----------------------------------
// The body is this inventory (default), or files the viewer uploads (a .zip is opened in the page),
// or pasted text. The page has no network: a URL cannot be fetched from here, so the URL box tells
// the viewer how to bring that content in. Sorting runs in the page with simple, visible rules;
// "Ask Claude" (optional, the viewer's own usage) sorts by any word with reasons.
const FOLDERS = GROUPS.flatMap(g => g[1]);
const SYN = {
  registries: 'registry registries register catalog catalogue', matrices: 'matrix matrices store stores',
  indices: 'index indices indexes lookup', codices: 'codex codices doc docs document documents spec specs report readme',
  logics: 'logic logics grammar grammars rule rules operator operators dsl', algorithms: 'algorithm algorithms algo',
  formulas: 'formula formulas formulae equation equations', tools: 'tool tools script scripts utility utilities',
  schemas: 'schema schemas template templates form forms', protocols: 'protocol protocols api message messages',
  interfaces: 'interface interfaces ui page pages pwa widget widgets canvas', experiments: 'experiment experiments test tests trial trials',
  data: 'data dataset datasets corpus lexicon dictionary', records: 'record records log logs history checkpoint',
  archives: 'archive archives zip zips bundle', automation: 'automation workflow workflows ci action actions',
  deployments: 'deployment deployments deploy worker workers d1 kv r2', dependencies: 'dependency dependencies library libraries package packages',
  governance: 'governance license licence contract contracts ruling rulings', glossary: 'glossary term terms definition definitions',
  maps: 'map maps connection connections relation relations', decisions: 'decision decisions question questions',
};
const folderOf = w => { w = (w || '').trim().toLowerCase(); return FOLDERS.find(f => f === w || SYN[f].split(' ').includes(w)) || null; };

let BODY = null;          // {label, files: [{path, size, text|null}]}
let LAST = { word: '' };  // last query

// Rules, in order. Each returns [folder, why] or null. Content checks read at most the first 200 KB.
function sortFile(path, text) {
  const p = path.toLowerCase(), name = p.split('/').pop(), ext = name.includes('.') ? name.split('.').pop() : '';
  const t = text || '';
  const R = [
    () => /(^|\/)\.github\/workflows\//.test(p) || (ext === 'yml' && /^on:/m.test(t) && /^jobs:/m.test(t)) ? ['automation', 'a CI workflow'] : null,
    () => /wrangler\.toml$|cloudflare|_blueprint\.json$/.test(p) ? ['deployments', 'deploy config or blueprint'] : null,
    () => /(^|\/)(package\.json|requirements[^/]*\.txt|pyproject\.toml|setup\.py|[^/]*\.lock)$/.test(p) ? ['dependencies', 'a dependency list'] : null,
    () => ext === 'zip' || ext === 'tar' || ext === 'gz' ? ['archives', 'a bundle'] : null,
    () => /(^|\/)(license|licence|cla|contract[^/]*)(\.md|\.txt)?$/.test(p) || /governance/.test(p) ? ['governance', 'licence, contract or governing text'] : null,
    () => /glossary/.test(p) ? ['glossary', 'named glossary'] : null,
    () => /(^|\/)(tests?|experiments?)\//.test(p) || /^test_|_test\.|\.test\.|\.spec\./.test(name) ? ['experiments', 'a test or experiment'] : null,
    () => /(^|\/)(results|logs?|state)\//.test(p) || ext === 'log' || ext === 'jsonl' || /log|checkpoint|run-log/.test(name) ? ['records', 'a machine-written log or result'] : null,
    () => ['html', 'htm', 'css', 'svg', 'png', 'jpg', 'jpeg', 'webp', 'gif', 'ico', 'webmanifest'].includes(ext) || /(^|\/)sw\.js$/.test(p) ? ['interfaces', 'something a person sees'] : null,
    () => {
      if (ext !== 'json') return null;
      if (/"\$schema"|"properties"\s*:\s*\{/.test(t)) return ['schemas', 'a JSON Schema'];
      if (/"schema"\s*:\s*"/.test(t) && /registry|catalog/.test(t.slice(0, 400))) return ['registries', 'names its own schema; registry'];
      if (/registry|catalog/.test(name)) return ['registries', 'registry by name'];
      if (/index/.test(name)) return ['indices', 'index by name'];
      const nums = (t.match(/:\s*-?\d+(\.\d+)?\s*[,}\]]/g) || []).length, strs = (t.match(/:\s*"/g) || []).length;
      if (nums > strs * 2 && nums > 20) return ['matrices', 'mostly numbers'];
      if (/matri/.test(p)) return ['matrices', 'matrix by name'];
      return ['data', 'a JSON body of content'];
    },
    () => {
      if (ext !== 'tsv' && ext !== 'csv') return null;
      const head = t.split('\n').find(l => l && !l.startsWith('#')) || '';
      return /\bpath\b|\bblob_sha\b|\bid\b/.test(head) ? ['indices', 'a table that points at things'] : ['data', 'a data table'];
    },
    () => {
      if (!['py', 'js', 'mjs', 'cjs', 'ts', 'jsx', 'tsx'].includes(ext)) return null;
      const classes = (t.match(/^\s*(export\s+)?class\s+\w+/gm) || []).length, dcs = (t.match(/@dataclass/g) || []).length;
      const defs = (t.match(/^\s*(async\s+)?(def|function)\s+\w+/gm) || []).length;
      if (dcs && dcs >= classes && defs <= dcs * 2) return ['schemas', 'record shapes (dataclasses)'];
      if (/grammar|parser|tokeni[sz]e|operator|signature|inference rule/i.test(t.slice(0, 3000))) return ['logics', 'grammar, parser or operator rules'];
      if (/\bA-\d{3}\b/.test(t) || classes >= 2) return ['algorithms', classes + ' classes' + (/\bA-\d{3}\b/.test(t) ? ', A-numbers' : '')];
      if (/__main__|argparse|sys\.argv|process\.argv/.test(t)) return ['tools', 'a runnable script'];
      return ['algorithms', 'code'];
    },
    () => ['md', 'txt', 'rst', 'pdf', 'docx'].includes(ext) ? (/^\|\s*(field|column)\s*\|/im.test(t) || /template/.test(name) ? ['schemas', 'a written form or template'] : /rfc|spec|readme|handoff|report|notes?|docs?\//.test(p) || true ? ['codices', 'a document to read'] : null) : null,
    () => ['toml', 'yml', 'yaml', 'ini', 'cfg', 'env'].includes(ext) ? ['deployments', 'a config file'] : null,
  ];
  for (const r of R) { const v = r(); if (v) return v; }
  return ['data', 'no rule matched'];
}

function bodyFromInventory() {
  // every INDEX.tsv row becomes an item: path = folder/id, text = the row's cells
  const files = [];
  for (const f of D.inventory) {
    if (!f.path.endsWith('/INDEX.tsv') || !f.text) continue;
    const folder = f.path.split('/')[1];
    const { head, rows } = parseTSV(f.text);
    rows.forEach((r, i) => files.push({ path: folder + '/' + (r[0] || 'row ' + (i + 1)), size: 0, folder, why: 'its folder in this inventory',
      title: r[head.indexOf('name')] || r[head.indexOf('term')] || '', text: head.map((h, k) => r[k] ? h + ': ' + r[k] : '').filter(Boolean).join('\n'),
      open: () => go({ tab: 'inventory', path: 'inventory/' + folder + '/', file: f.path, row: i }) }));
  }
  return { label: 'this inventory (' + files.length + ' rows in all folders)', files, inventory: true };
}

function setNote(html) { document.getElementById('srcnote').innerHTML = html; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function readUploads(fileList) {
  const files = [];
  const textish = n => !/\.(png|jpe?g|gif|webp|ico|pdf|docx?|xlsx?|pptx?|zip|gz|tar|woff2?|ttf|mp[34]|mov|wasm|pyc|bin)$/i.test(n);
  for (const f of fileList) {
    if (/\.zip$/i.test(f.name) && window.JSZip) {
      setNote('Opening <b>' + esc(f.name) + '</b>…');
      const zip = await JSZip.loadAsync(f);
      const entries = Object.values(zip.files).filter(e => !e.dir);
      const root = entries.length && entries.every(e => e.name.split('/')[0] === entries[0].name.split('/')[0]) ? entries[0].name.split('/')[0] + '/' : '';
      for (const e of entries) {
        const path = e.name.slice(root.length);
        if (!path || /(^|\/)(\.git|node_modules)\//.test(path)) continue;
        const size = e._data && e._data.uncompressedSize || 0;
        const text = textish(path) && size < 2e6 ? (await e.async('string')).slice(0, 200000) : null;
        files.push({ path, size, text });
      }
    } else {
      files.push({ path: f.webkitRelativePath || f.name, size: f.size, text: textish(f.name) && f.size < 2e6 ? (await f.text()).slice(0, 200000) : null });
    }
  }
  return files;
}

function sortBody() {
  for (const f of BODY.files) if (!f.folder) { const [folder, why] = sortFile(f.path, f.text); f.folder = folder; f.why = why; }
}

function snippet(text, word) {
  if (!text || !word) return null;
  const i = text.toLowerCase().indexOf(word.toLowerCase());
  if (i < 0) return null;
  const a = Math.max(0, text.lastIndexOf('\n', i - 1) + 1), b = text.indexOf('\n', i);
  const line = text.slice(a, b < 0 ? undefined : b).trim().slice(0, 220);
  const k = line.toLowerCase().indexOf(word.toLowerCase());
  const pre = el('div', { class: 'hit' });
  if (k < 0) { pre.textContent = line; return pre; }
  pre.append(line.slice(0, k), el('mark', { text: line.slice(k, k + word.length) }), line.slice(k + word.length));
  return pre;
}

function renderExplore(view) {
  if (!BODY) BODY = bodyFromInventory();
  sortBody();
  const word = LAST.word, folder = folderOf(word);
  crumbs([['Explore', null]]);
  const box = el('div', { class: 'rows' });
  box.append(el('p', { class: 'note', text: 'Exploring ' + BODY.label + '. ' + (word
    ? (folder ? 'Showing what sorts into ' + folder + ', plus anything that mentions "' + word + '".' : 'Showing everything that mentions "' + word + '", grouped by where it sorts.')
    : 'Type a category or word above and press Sort. Without one, everything is listed by folder.') }));
  if (!BODY.inventory) box.append(el('div', { class: 'actions' }, el('button', { class: 'btn', text: 'Back to this inventory', onclick: () => { BODY = null; setNote('Exploring: this inventory (all folders).'); go({ tab: 'explore' }); } })));

  const groups = new Map(FOLDERS.map(f => [f, []]));
  for (const f of BODY.files) {
    const hay = (f.path + ' ' + (f.title || '') + ' ' + (f.text || '')).toLowerCase();
    const mentions = word && hay.includes(word.toLowerCase());
    if (!word || (folder && f.folder === folder) || mentions) groups.get(f.folder).push({ f, mentions });
  }
  const shown = [...groups.values()].reduce((n, g) => n + g.length, 0);
  box.append(el('div', { class: 'count', text: shown + ' of ' + BODY.files.length + ' items' }));
  const list = el('div', { class: 'list' });
  const order = folder ? [folder, ...FOLDERS.filter(f => f !== folder)] : FOLDERS;
  for (const g of order) {
    const items = groups.get(g);
    if (!items.length) continue;
    list.append(el('div', { class: 'group', text: g + ' · ' + items.length }));
    for (const { f } of items.slice(0, 200)) {
      const b = itemBtn(BODY.inventory ? '▦' : '¶', f.title ? f.path.split('/').pop() + '  ' + f.title : f.path, (BODY.inventory ? '' : 'sorted here: ' + f.why), f.size ? fmt(f.size) : '',
        () => f.open ? f.open() : go({ tab: 'explore', xfile: f.path }));
      const sn = snippet(f.text, word); if (sn) b.querySelector('.nm').append(sn);
      if (f.claude) b.querySelector('.nm').append(el('div', { class: 'why', text: 'Claude: ' + f.claude }));
      list.append(b);
    }
    if (items.length > 200) list.append(el('div', { class: 'group', text: (items.length - 200) + ' more not shown: narrow the word' }));
  }
  if (!shown) list.append(el('div', { class: 'group', text: 'Nothing matches "' + word + '"' }));
  if (S.xfile && !BODY.inventory) {
    const f = BODY.files.find(x => x.path === S.xfile);
    if (f) {
      crumbs([['Explore', () => go({ xfile: null })], [f.path, null]]);
      view.append(el('div', { class: 'doc' }, el('h2', { text: f.path }),
        el('p', { class: 'note', text: 'Sorts into ' + f.folder + ': ' + f.why + (f.size ? ' · ' + fmt(f.size) : '') }),
        f.text != null ? el('pre', {}, el('code', { text: f.text.slice(0, 60000) })) : el('p', { class: 'note', text: 'Not text, so not shown.' }),
        el('div', { class: 'actions' }, el('button', { class: 'btn', text: 'Back to results', onclick: () => go({ xfile: null }) }))));
      return;
    }
  }
  box.append(list);
  if (word) box.append(askBlock(word));
  view.append(box);
}

// ---- optional: ask Claude to sort by the word, with reasons -------------------------------------
let samplePromise = window.claude && claude.use ? claude.use('sample') : Promise.resolve(null);
function askBlock(word) {
  const wrap = el('div', { class: 'doc' });
  const status = el('p', { class: 'note', text: 'The rules above are simple and visible. Claude can also read the items and say which fit "' + word + '" and why. This uses your own Claude usage.' });
  const btn = el('button', { class: 'btn solid', text: 'Ask Claude to sort by "' + word + '"' });
  wrap.append(el('h3', { text: 'Ask Claude' }), status, el('div', { class: 'actions' }, btn));
  samplePromise.then(s => { if (!s) wrap.remove(); });
  btn.addEventListener('click', async () => {
    const sample = await samplePromise;
    if (!sample) { wrap.remove(); return; }
    const items = BODY.files.slice(0, 150).map(f => ({ path: f.path, title: f.title || '', start: (f.text || '').slice(0, 350) }));
    btn.disabled = true; status.textContent = 'Thinking…';
    try {
      const out = await sample.json(
        'You sort items for an inventory. The category is: "' + word + '".\n' +
        'For each item below decide whether it belongs under that category. Judge by what the item is, not only by its name.\n' +
        'Reply with only a JSON array of {"path": string, "fits": boolean, "why": string} objects, one per item, "why" at most 15 words.\n\n' +
        'Items (path, title, first characters):\n' + JSON.stringify(items));
      const by = new Map((Array.isArray(out) ? out : []).map(o => [String(o.path), o]));
      let n = 0;
      for (const f of BODY.files) { const o = by.get(f.path); if (o && o.fits) { f.claude = String(o.why || 'fits'); n++; if (!f.text || !f.text.toLowerCase().includes(word.toLowerCase())) f.text = (f.text || '') + '\n' + word; } else delete f.claude; }
      status.textContent = 'Claude marked ' + n + ' of ' + items.length + ' items as fitting "' + word + '"' + (BODY.files.length > 150 ? ' (only the first 150 items were sent).' : '.') + ' They now show with Claude’s reason.';
      btn.disabled = false;
      render();
    } catch (e) {
      btn.disabled = false;
      const msg = { not_granted: 'Claude is not allowed for this page.', sampling_disabled: 'Claude is not available on this account.', rate_limited: 'Too many requests just now. Try again in a little while.', prompt_too_large: 'Too much to send at once. Narrow the upload.', invalid_json: 'Claude’s answer could not be read. Try again.' }[e && e.code];
      if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'not_declared' || e.code === 'capability_disabled')) wrap.remove();
      status.textContent = msg || 'That did not work. Try again.';
    }
  });
  return wrap;
}

// ---- the query form ------------------------------------------------------------------------------
const qform = document.getElementById('query'), qword = document.getElementById('qword'), qurl = document.getElementById('qurl'), qfile = document.getElementById('qfile');
qform.addEventListener('submit', ev => {
  ev.preventDefault();
  const url = qurl.value.trim();
  if (url) {
    const gh = url.match(/github\.com\/([^/]+)\/([^/#?]+)/);
    setNote('This page cannot reach the internet, so it cannot open <b>' + esc(url) + '</b> itself. ' +
      (gh ? 'For a GitHub repository: open it, choose Code → Download ZIP, then press Upload and pick the zip.' : 'Open the link, save the page or file, then press Upload; or copy its text and press Paste.'));
  }
  LAST.word = qword.value.trim();
  go({ tab: 'explore', xfile: null });
});
document.getElementById('qupload').addEventListener('click', () => qfile.click());
qfile.addEventListener('change', async () => {
  if (!qfile.files.length) return;
  try {
    const files = await readUploads([...qfile.files]);
    const label = qfile.files.length === 1 ? qfile.files[0].name : qfile.files.length + ' uploaded files';
    BODY = { label: label + ' (' + files.length + ' files)', files };
    setNote('Exploring: <b>' + esc(label) + '</b>, ' + files.length + ' files. Nothing is saved or sent anywhere.');
    qurl.value = '';
    LAST.word = qword.value.trim();
    go({ tab: 'explore', xfile: null });
  } catch (e) {
    setNote('That file could not be opened.');
  } finally { qfile.value = ''; }
});
document.getElementById('qpaste').addEventListener('click', () => {
  S.tab = 'explore';
  const view = document.getElementById('view'); view.replaceChildren();
  ['tab-inventory', 'tab-branches', 'tab-explore'].forEach(id => document.getElementById(id).setAttribute('aria-selected', id === 'tab-explore'));
  crumbs([['Explore', null], ['paste', null]]);
  const ta = el('textarea', { class: 'paste', placeholder: 'Paste text here. Separate several items with a line holding only ---' , 'aria-label': 'Text to explore' });
  const name = el('input', { class: 'filter', type: 'text', placeholder: 'Name for this text (optional, e.g. notes.md)', 'aria-label': 'Name for the pasted text' });
  view.append(el('div', { class: 'doc' }, el('h2', { text: 'Paste text to explore' }), name, el('p'), ta,
    el('div', { class: 'actions' }, el('button', { class: 'btn solid', text: 'Explore this', onclick: () => {
      const parts = ta.value.split(/^---\s*$/m).map(x => x.trim()).filter(Boolean);
      if (!parts.length) return;
      const base = name.value.trim() || 'pasted.txt';
      BODY = { label: 'pasted text (' + parts.length + (parts.length === 1 ? ' item)' : ' items)'), files: parts.map((t, i) => ({ path: parts.length === 1 ? base : base.replace(/(\.\w+)?$/, '-' + (i + 1) + '$1'), size: t.length, text: t })) };
      setNote('Exploring: <b>pasted text</b>. Nothing is saved or sent anywhere.');
      LAST.word = qword.value.trim();
      go({ tab: 'explore', xfile: null });
    } }))));
  ta.focus();
});

render();
</script>
